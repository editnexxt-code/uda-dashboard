  {k:"kp",t:"Particip.",s:p=>p.stats.kp,f:p=>`<span class="num">${nf(p.stats.kp,0)}%</span>`},
  {k:"cs_min",t:"CS/min",s:p=>p.stats.cs_min,f:p=>`<span class="num">${nf(p.stats.cs_min,1)}</span>`},
  {k:"gold_min",t:"Ouro/min",s:p=>p.stats.gold_min,f:p=>`<span class="num">${ni(p.stats.gold_min)}</span>`},
  {k:"dmg_min",t:"Dano/min",s:p=>p.stats.dmg_min,f:p=>`<span class="num">${ni(p.stats.dmg_min)}</span>`},
  {k:"dmg_share",t:"% do dano",s:p=>p.stats.dmg_share,f:p=>`<span class="num">${nf(p.stats.dmg_share,0)}%</span>`},
  {k:"vision_min",t:"Visão/min",s:p=>p.stats.vision_min,f:p=>`<span class="num">${nf(p.stats.vision_min,2)}</span>`},
  {k:"dmg_taken_min",t:"Dano sofrido/min",s:p=>p.stats.dmg_taken_min,f:p=>`<span class="num">${ni(p.stats.dmg_taken_min)}</span>`},
  {k:"heal_shield_game",t:"Cura+escudo",s:p=>p.stats.heal_shield_game,f:p=>`<span class="num">${ni(p.stats.heal_shield_game)}</span>`},
  {k:"turrets_game",t:"Torres/jogo",s:p=>p.stats.turrets_game,f:p=>`<span class="num">${nf(p.stats.turrets_game,1)}</span>`},
  {k:"first_blood_rate",t:"First blood",s:p=>p.stats.first_blood_rate,f:p=>`<span class="num">${nf(p.stats.first_blood_rate,0)}%</span>`},
  {k:"multikills",t:"Multikills",s:p=>{const m=p.stats.multikills;return m.double+m.triple*3+m.quadra*9+m.penta*27;},
   f:p=>{const m=p.stats.multikills;
     return `<span class="num" title="${m.double} duplos · ${m.triple} triplos · ${m.quadra} quádruplos · ${m.penta} pentas">${m.double+m.triple+m.quadra+m.penta}</span>`
       +(m.penta?` <span class="pill g" style="font-size:9.5px;padding:2px 6px">${m.penta} PENTA</span>`:"");}},
  {k:"deaths_10min",t:"Mortes/10min",s:p=>-p.stats.deaths_10min,
   f:p=>`<span class="num ${p.stats.deaths_10min<=1.6?"good":"bad"}">${nf(p.stats.deaths_10min,2)}</span>`},
  {k:"score",t:"UDA Score",s:p=>p.score??-1,f:p=>p.score==null?`<span style="color:var(--dim)">—</span>`
    :`<span class="pill ${p.score>=60?"t":p.score>=45?"g":"r"}" style="font-size:13px;padding:6px 12px">${nf(p.score,1)}</span>`},
];
let sortKey="rank",sortDir=1;

function tabela(g){
  const col=COLS.find(c=>c.k===sortKey);
  const rows=[...g.players].sort((a,b)=>{
    if(sortKey==="rank") return ((a.rank??1e9)-(b.rank??1e9))*(sortDir>0?1:-1);
    const av=col.s?col.s(a):0,bv=col.s?col.s(b):0;
    return typeof av==="string"?av.localeCompare(bv)*(sortDir>0?1:-1):(bv-av)*(sortDir>0?1:-1);});
  return `<div class="tbox"><table><thead><tr>${COLS.map(c=>
    `<th class="${c.l?"l":""} ${c.k===sortKey?"on":""}" data-k="${c.k}">${c.t}${c.k===sortKey?(sortDir>0?" ↓":" ↑"):""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(p=>{const s=p.stats,e=eloTxt(p.ranks.solo);
      const t=tip(h(p.gameName),[
        ["Elo",e.name+(e.sub?` · ${e.sub}`:"")],
        ["UDA Score",p.score==null?"sem ranking":`${nf(p.score,1)} · ${p.rank}º lugar`,
          p.score==null?null:(p.score>=60?"var(--teal)":p.score>=45?"var(--gold)":"var(--red)")],
        ["Partidas",`${s.games} · ${s.wins}V ${s.losses}D`],
        ["KDA",`${nf(s.kills,1)} / ${nf(s.deaths,1)} / ${nf(s.assists,1)} = ${nf(s.kda,2)}`],
        ["Rota mais jogada",p.roles&&p.roles[0]?`${ROTAS[p.roles[0].role]||p.roles[0].role} (${p.roles[0].games})`:"—"],
        ["Campeão mais jogado",p.champions&&p.champions[0]?`${p.champions[0].champion} (${p.champions[0].games})`:"—"],
      ],"clique para abrir o cartão completo");
      return `<tr data-p="${h(p.puuid)}"${t}>${COLS.map(c=>`<td class="${c.l?"l":""}">${c.f(p)}</td>`).join("")}</tr>`;}).join("")}</tbody></table></div>`;
}

const AWICON={carregador:I.bolt,assassino:I.sword,imortal:I.heart,farmador:I.grid,
  sentinela:I.eye,presenca:I.users,doador:I.skull,cego:I.eye,fantasma:I.user,
  turista:I.grid,azarado:I.target,figurante:I.bolt};

function awards(l,bad){
  if(!l||!l.length) return "";
  return `<div class="awards">${l.map(a=>{
    const edge=a.edge==null?null:Math.round(a.edge);
    return `<div class="aw ${bad?"bad":""}">
      <div class="aw-h"><div class="ic">${svg(AWICON[a.key]||I.award)}</div><div class="t">${h(a.title)}</div></div>
      <div class="aw-b">
        <img src="${iconImg(a.icon)}"${FB}>
        <div class="who"><div class="p">${h(a.player)}</div><div class="d">${h(a.desc)}</div></div>
        <div class="big"><div class="n2">${h(a.value)}</div><div class="u">${h(a.unit)}</div></div>
      </div>
      <div class="aw-m">
        <div class="track"><i style="width:${Math.max(6,Math.min(100,a.fill??100))}%"></i></div>
        <div class="cap"><span>média do grupo <b>${h(a.avg??"—")}</b></span>
          ${edge!=null?`<span><b>${edge>0?"+":""}${edge}%</b> ${edge>=0?"acima":"abaixo"}</span>`:""}</div>
      </div>
      ${a.runnersUp&&a.runnersUp.length?`<div class="aw-f"><span class="lbl">seguido por</span>
        ${a.runnersUp.map(r=>`<span class="ru"><img src="${iconImg(r.icon)}"${FB}>
          <span>${h(short(r.player))} ${h(r.value)}</span></span>`).join("")}</div>`:""}
    </div>`;}).join("")}</div>`;
}

function playerCard(p,labels){
  const s=p.stats,e=eloTxt(p.ranks.solo),ef=eloTxt(p.ranks.flex);
  const c=p.score==null?"var(--dim)":p.score>=60?"var(--teal)":p.score>=45?"var(--gold)":"var(--red)";
  return `<div class="pc" id="pc-${h(p.puuid)}">
    <div class="pc-h"><img src="${iconImg(p.icon)}"${FB}>
      <div style="min-width:0"><div class="nm">${h(p.gameName)}</div>
      <div class="tg">#${h(p.tagLine)} · ${h(e.name)}${ef.tier!=="unranked"?` · Flex ${h(ef.name)}`:""}</div></div>
      <div class="rt"><div class="s" style="color:${c}">${p.score==null?"—":nf(p.score,1)}</div>
      <div class="l">Score${p.rank?` · ${p.rank}º`:""}</div></div></div>
    <div class="avgl">Média: <b>${nf(s.kills,1)} / ${nf(s.deaths,1)} / ${nf(s.assists,1)}</b> em <b>${nf(s.avg_minutes,0)} min</b> · <b>${nf(s.winrate,0)}%</b> de vitórias em <b>${s.games}</b> jogos</div>
    <div class="pc-b"><div>${radar(p,labels)}</div><div class="mini">
      <div><span>KDA</span><b class="${cl(s.kda,3)}">${nf(s.kda,2)}</b></div>
      <div><span>Participação</span><b>${nf(s.kp,0)}%</b></div>
      <div><span>CS/min</span><b>${nf(s.cs_min,1)}</b></div>
      <div><span>Ouro/min</span><b>${ni(s.gold_min)}</b></div>
      <div><span>Dano/min</span><b>${ni(s.dmg_min)}</b></div>
      <div><span>% do dano</span><b>${nf(s.dmg_share,0)}%</b></div>
      <div><span>Visão/min</span><b>${nf(s.vision_min,2)}</b></div>
      <div><span>Sentinelas</span><b>${nf(s.wards_game,1)}</b></div>
      <div><span>Mortes/10min</span><b class="${s.deaths_10min<=1.6?"good":"bad"}">${nf(s.deaths_10min,2)}</b></div>
      <div><span>First blood</span><b>${nf(s.first_blood_rate,0)}%</b></div>
      <div><span>Torres</span><b>${nf(s.turrets_game,1)}</b></div>
      <div><span>Pentakills</span><b class="${s.multikills.penta?"good":""}">${s.multikills.penta}</b></div>
    </div></div>
    ${p.roles&&p.roles.length?`<div class="roles">${p.roles.map(r=>
      `<span class="pill n">${h(ROTAS[r.role]||r.role)} · ${r.games}</span>`).join("")}</div>`:""}
    <div class="form">${p.form.map(f=>`<i class="${f.win?"w":"l"}"${tip(h(f.champion),[
      ["Resultado",f.win?"Vitória":"Derrota",f.win?"var(--teal)":"var(--red)"],
      ["KDA",`${f.k} / ${f.d} / ${f.a} = ${nf(f.kda,2)}`],
      ["Dano",ni(f.dmg)],["Farm",`${ni(f.cs)} CS`],
    ],`${h(f.queue)} · ${f.minutes} min`)}>${f.win?"V":"D"}</i>`).join("")}</div>
    ${(p.bestGame||p.worstGame)?`<div class="bw">
      ${p.bestGame?`<div class="bwc"><img src="${champImg(p.bestGame.championId,p.bestGame.champion)}"${FB}>
        <div><div class="l">Melhor partida</div><div class="v good">${p.bestGame.k}/${p.bestGame.d}/${p.bestGame.a} · ${h(p.bestGame.champion)}</div></div></div>`:""}
      ${p.worstGame?`<div class="bwc"><img src="${champImg(p.worstGame.championId,p.worstGame.champion)}"${FB}>
        <div><div class="l">Pior partida</div><div class="v bad">${p.worstGame.k}/${p.worstGame.d}/${p.worstGame.a} · ${h(p.worstGame.champion)}</div></div></div>`:""}
    </div>`:""}
    <div class="champs">${p.champions.map(c=>`<div class="champ"><img src="${champImg(c.championId,c.champion)}"${FB}>
      <span class="cn">${h(c.champion)}</span><span class="cg">${c.games} jogo${c.games>1?"s":""}</span>
      <span class="cw ${cl(c.winrate,50)}">${nf(c.winrate,0)}%</span><span class="ck">${nf(c.kda,2)} KDA</span></div>`).join("")
      ||`<div style="color:var(--dim);font-size:12px">sem dados</div>`}</div></div>`;
}
const ROTAS={TOP:"Topo",JUNGLE:"Selva",MIDDLE:"Meio",BOTTOM:"Atirador",UTILITY:"Suporte"};

function championTable(l){
  if(!l.length) return noData("SEM CAMPEÕES","Nenhum campeão atingiu 3 partidas nesta fila.");
  return `<div class="tbox"><table><thead><tr><th class="l">Campeão</th><th>Jogos</th><th>Pilotos</th><th>Vitórias</th><th>KDA</th></tr></thead>
    <tbody>${l.map(c=>`<tr${tip(h(c.champion),[
      ["Partidas",ni(c.games)],
      ["Resultado",`${c.wins}V ${c.losses}D`],
      ["Aproveitamento",nf(c.winrate,1)+"%",c.winrate>=50?"var(--teal)":"var(--red)"],
      ["KDA médio",nf(c.kda,2)],
      ["Pilotos",`${c.pilots} membro${c.pilots>1?"s":""} do grupo`],
    ],c.pilots>1?"mais de uma pessoa joga esse campeão":"exclusividade de um membro")}>
      <td class="l"><div class="pl"><img src="${champImg(c.championId,c.champion)}"${FB} style="width:32px;height:32px;border-radius:9px">
      <div class="a">${h(c.champion)}</div></div></td>
      <td><span class="num">${c.games}</span></td><td><span class="num" style="color:var(--mut)">${c.pilots}</span></td>
      <td><div class="wr" style="min-width:auto"><div class="t ${cl(c.winrate,50)}">${nf(c.winrate,0)}%</div>
        <div class="track"><i class="${c.winrate<50?"lo":""}" style="width:${c.winrate}%"></i></div></div></td>
      <td><span class="num ${cl(c.kda,3)}">${nf(c.kda,2)}</span></td></tr>`).join("")}</tbody></table></div>`;
}

function recordes(r){
  const it=[["Maior massacre",r.bestKda,x=>`${nf(x.kda,2)}`,"var(--teal)"],
            ["Maior dano numa partida",r.mostDamage,x=>ni(x.dmg),"var(--gold)"],
            ["A vergonha máxima",r.mostDeaths,x=>`${x.d}`,"var(--red)"]].filter(([,v])=>v);
  if(!it.length) return noData("SEM RECORDES","Sem partidas nesta fila.");
  return it.map(([lb,g,fv,cor])=>`<div class="rec"><img src="${champImg(g.championId,g.champion)}"${FB}>
    <div style="min-width:0"><div class="lb">${lb}</div><div class="t1">${h(g.player)} · ${h(g.champion)}</div>
    <div class="t2">${g.k}/${g.d}/${g.a} · ${h(g.queue)} · ${g.minutes} min</div></div>
    <div class="vv" style="color:${cor}">${fv(g)}</div></div>`).join("");
}

function comparacao(list){
  const ok=list.filter(p=>p.comparable),falta=list.filter(p=>!p.comparable);
  if(!ok.length) return noData("AMOSTRA PEQUENA","Cada jogador precisa de partidas suficientes nos dois cenários: com a UDA no time e sem ninguém da UDA.");
  return `<div class="tbox"><table><thead><tr><th class="l">Jogador</th><th>WR juntos</th><th>WR sozinho</th>
    <th>Δ vitórias</th><th>KDA juntos</th><th>KDA sozinho</th><th>Δ KDA</th><th>Δ mortes</th><th>Δ particip.</th><th>Δ dano/min</th></tr></thead><tbody>
    ${ok.map(p=>{const d=p.delta;return `<tr>
      <td class="l"><div class="pl"><img src="${iconImg(p.icon)}"${FB}><div><div class="a">${h(p.gameName)}</div>
        <div class="b">${p.together.games} juntos · ${p.alone.games} sozinho</div></div></div></td>
      <td><span class="num">${nf(p.together.winrate,1)}%</span></td>
      <td><span class="num" style="color:var(--mut)">${nf(p.alone.winrate,1)}%</span></td>
      <td><span class="pill ${d.winrate>0?"t":d.winrate<0?"r":"n"}">${sg(d.winrate)}pp</span></td>
      <td><span class="num">${nf(p.together.kda,2)}</span></td>
      <td><span class="num" style="color:var(--mut)">${nf(p.alone.kda,2)}</span></td>
      <td><span class="num ${dcl(d.kda)}">${sg(d.kda,2)}</span></td>
      <td><span class="num ${dcl(d.deaths,true)}">${sg(d.deaths,2)}</span></td>
      <td><span class="num ${dcl(d.kp)}">${sg(d.kp)}pp</span></td>
      <td><span class="num ${dcl(d.dmg_min)}">${sg(d.dmg_min,0)}</span></td></tr>`;}).join("")}
    </tbody></table>${falta.length?`<div style="padding:14px 16px;font-size:12px;color:var(--dim);border-top:1px solid var(--line2)">
      Sem amostra dos dois lados ainda: ${falta.map(p=>h(p.gameName)).join(" · ")}</div>`:""}</div>`;
}

function matriz(m){
  if(!m.order.length) return noData("SEM DUPLAS","Ninguém jogou junto o suficiente.");
  const cor=w=>w>=50?`background:rgba(10,200,185,${.1+(w-50)/50*.6})`:`background:rgba(229,72,77,${.1+(50-w)/50*.6})`;
  const cur=n=>short(n).slice(0,10);
  return `<div class="tbox" style="padding:16px"><table class="mx"><thead><tr><th class="mx-corner"></th>
    ${m.order.map(p=>`<th class="mx-h"><span>${h(cur(m.names[p]))}</span></th>`).join("")}</tr></thead><tbody>
    ${m.order.map(a=>`<tr><th class="mx-r"><img src="${iconImg(m.icons[a])}"${FB}><span>${h(cur(m.names[a]))}</span></th>
      ${m.order.map(b=>{if(a===b) return `<td class="mx-c mx-self">—</td>`;
        const c=m.cells[a+"|"+b];
        if(!c) return `<td class="mx-c"${tip(`${h(short(m.names[a]))} + ${h(short(m.names[b]))}`,
          ["Menos de "+m.minPair+" partidas juntos"])}></td>`;
        return `<td class="mx-c" style="${cor(c.winrate)}"${tip(
          `${h(short(m.names[a]))} + ${h(short(m.names[b]))}`,[
          ["Aproveitamento",nf(c.winrate,1)+"%",c.winrate>=50?"var(--teal)":"var(--red)"],
          ["Partidas juntos",ni(c.games)],
          ["Resultado",`${c.wins}V ${c.losses}D`],
        ],c.winrate>=50?"essa dupla funciona":"essa dupla afunda junto")}>
          <b>${nf(c.winrate,0)}%</b><i>${c.games}</i></td>`;}).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="legend"><span><i style="background:rgba(10,200,185,.65)"></i>vencem juntos</span>
    <span><i style="background:rgba(229,72,77,.65)"></i>afundam juntos</span>
    <span><i style="background:var(--card2)"></i>menos de ${m.minPair} partidas</span>
    <span>número pequeno = partidas juntos</span></div>`;
}

const formacoes=(l)=>!l.length?noData("SEM FORMAÇÕES","Ninguém jogou junto o suficiente ainda."):
  l.map(f=>`<div class="lrow"><span class="ims">${f.icons.slice(0,5).map(i=>`<img src="${iconImg(i)}"${FB}>`).join("")}</span>
    <span class="nm"><span class="pill n" style="font-size:10px;padding:3px 8px">${h(f.label)}</span>
    <div style="margin-top:5px;font-size:12.5px">${f.members.map(h).join(" · ")}</div></span>
    <span class="st">${f.wins}V ${f.losses}D</span>
    <span class="pill ${f.winrate>=50?"t":"r"}">${nf(f.winrate,0)}%</span></div>`).join("");

const confrontos=(l)=>!l.length?noData("SEM CONFRONTOS","Vocês nunca caíram em times opostos."):
  l.map(c=>`<div class="lrow"><span class="ims"><img src="${iconImg(c.iconA)}"${FB}><img src="${iconImg(c.iconB)}"${FB}></span>
    <span class="nm">${h(c.a)} <span style="color:var(--dim)">×</span> ${h(c.b)}</span>
    <span class="st">${c.games} duelo${c.games>1?"s":""}</span>
    <span class="pill n" style="font-size:13px">${c.aWins} – ${c.bWins}</span></div>`).join("");

/* ============================================================= PÁGINAS */
const PAGES=[
  {k:"visao",n:"Visão geral",i:I.grid,g:"Principal",q:1,sub:"O panorama do grupo na fila selecionada"},
  {k:"ranking",n:"Classificação",i:I.rank,g:"Principal",q:1,sub:"Todos os jogadores, todas as métricas"},
  {k:"evolucao",n:"Evolução",i:I.trend,g:"Principal",q:1,sub:"Como o desempenho de vocês muda ao longo do tempo"},
  {k:"equipe",n:"Em equipe",i:I.users,g:"Grupo",q:0,sub:"Só as partidas com 2 ou mais da UDA no mesmo time"},
  {k:"jogadores",n:"Jogadores",i:I.user,g:"Grupo",q:1,sub:"Um cartão por pessoa, com radar comparativo"},
  {k:"campeoes",n:"Campeões",i:I.sword,g:"Grupo",q:1,sub:"O que o grupo joga, e com que resultado"},
  {k:"regras",n:"Regras",i:I.book,g:"Ajuda",q:0,sub:"Como o UDA Score é calculado"},
];
let page="visao",fila="all";
const grupo=()=>DATA.data[page==="equipe"?"squad":fila];
const filas=()=>DATA.groups.filter(g=>g.key!=="squad");

function pVisao(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  const t=g.team, acima=t.winrate>=50;
  return `<section>${statRow(g)}</section>
    <section><div class="grid g23">
      <div class="card">${chead(I.award,"O pódio",`mínimo de ${DATA.minGames} partidas para entrar no ranking`,"gold")}
        ${podio(g)}</div>
      <div class="card">${chead(I.target,"Aproveitamento do grupo","na fila selecionada")}
        ${gauge(t.winrate,`${ni(t.wins)}V · ${ni(t.losses)}D`,
          `<span class="pill ${acima?"t":"r"}">${acima?"Acima de 50%":"Abaixo de 50%"}</span>`,
          acima?"var(--teal)":"var(--red)")}</div>
    </div></section>
    ${afundados(g)?`<section>${afundados(g)}</section>`:""}
    <section><div class="sh-plain">${chead(I.award,"Hall da fama",
      "o melhor de cada métrica, e quanto ele está à frente da média do grupo","gold")}</div>
      ${awards(g.awardsGood,false)}</section>
    <section><div class="sh-plain">${chead(I.skull,"Hall da vergonha","alguém tinha que ser","red")}</div>
      ${awards(g.awardsBad,true)}</section>
    <section><div class="grid g23">
      <div class="card">${chead(I.bolt,"Carrega ou alimenta?","dano por minuto contra mortes a cada 10 minutos")}
        ${scatter(g.players)}
        <div class="legend"><span><i style="background:var(--teal)"></i>dano acima da média, morrendo pouco</span>
        <span><i style="background:var(--gold)"></i>meio-termo</span>
        <span><i style="background:var(--red)"></i>pouco dano, morrendo muito</span></div></div>
      <div class="card">${chead(I.award,"Recordes","","gold")}${recordes(g.records)}</div>
    </div></section>
    <section><div class="grid g2">
      <div class="card">${chead(I.user,"Rotas do grupo","quanto vocês jogam de cada uma, e com que aproveitamento")}
        ${barrasHoriz(g.roles,"role","games","winrate","share")}</div>
      <div class="card">${chead(I.grid,"Filas","distribuição das partidas")}
        ${barrasHoriz(g.queues,"queue","matches","winrate","share")}</div>
    </div></section>
    <section><div class="card">${chead(I.clock,"Últimas partidas",
      "as mais recentes do grupo — passe o mouse para ver dano e CS")}
      ${feedRecentes(g.recent)}</div></section>`;
}

function pRanking(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  return `<section><div id="tbl">${tabela(g)}</div></section>
    <section><div class="card"><div class="prose" style="max-width:none">
      <p style="margin:0">O <b>UDA Score</b> compara cada jogador contra o próprio grupo, não contra o servidor —
      50 é exatamente a média da UDA. Já a coluna <b>Elo</b> é a medida absoluta, vinda direto da Riot.
      Alguém pode ter Score alto e elo baixo: significa que rende bem <i>para o padrão de vocês</i>.
      A página <b>Regras</b> tem a fórmula inteira.</p></div></div></section>`;
}

function seletorJogadores(g){
  const lista=g.players.filter(p=>p.stats.games>0);
  const n=selJog.size;
  return `<div class="card">${chead(I.user,"Quem aparece nos gráficos",
    n?`${n} de ${lista.length} selecionados — clique para ligar e desligar`
     :`todos os ${lista.length} — clique num jogador para isolar`)}
    <div class="psel">
      ${n?`<button class="pbtn" data-sel="todos"${tip("Mostrar todos",["Volta a desenhar o elenco inteiro"])}>Mostrar todos</button>`:""}
      ${lista.map(p=>{const on=!n||selJog.has(p.puuid);
        return `<button class="pchip" data-jog="${h(p.puuid)}" aria-pressed="${on}"
          ${tip(h(p.gameName),[["UDA Score",p.score==null?"—":nf(p.score,1)],
            ["Partidas",ni(p.stats.games)],["Aproveitamento",nf(p.stats.winrate,1)+"%"]],
            n?(selJog.has(p.puuid)?"clique para tirar dos gráficos":"clique para incluir")
             :"clique para ver só este jogador")}>
          <img src="${iconImg(p.icon)}"${FB}>
          <span class="sw" style="background:${corDe(p.puuid,0)}"></span>
          ${h(short(p.gameName))}</button>`;}).join("")}
    </div></div>`;
}

function pEvolucao(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  const ev=DATA.evolution&&DATA.evolution[page==="equipe"?"squad":fila];
  let o=`<section>${seletorJogadores(g)}</section>
    <section><div class="card">${chead(I.cal,"Aproveitamento por semana","barras são as semanas; a linha dourada acompanha a taxa de vitórias")}
    ${barLine(g.trend)}</div></section>`;
  if(ev&&ev.scoreMensal&&ev.scoreMensal.length)
    o+=`<section><div class="card">${chead(I.trend,"A corrida do UDA Score","o Score recalculado dentro de cada mês — quem sobe e quem afunda","gold")}
      ${corridaMensal(ev.scoreMensal)}</div></section>`;
  if(ev&&ev.mediaMovel&&ev.mediaMovel.length)
    o+=`<section><div class="card">${chead(I.heart,"Forma recente","média móvel de KDA nas últimas 10 partidas de cada um")}
      ${serieChart(ev.mediaMovel,{campo:"kda",H:410,eixo:"partidas, da mais antiga à mais recente",yFmt:v=>nf(v,1)})}</div></section>`;
  if(ev&&ev.saldo&&ev.saldo.length)
    o+=`<section><div class="card">${chead(I.trend,"Saldo acumulado","vitórias menos derrotas ao longo do tempo — acima de zero é lucro")}
      ${serieChart(ev.saldo,{campo:"saldo",H:410,zero:0,eixo:"partidas, da mais antiga à mais recente",yFmt:v=>sg(v,0)})}</div></section>`;
  if(ev&&ev.atividade)
    o+=`<section><div class="card">${chead(I.clock,"Quando vocês jogam",
      ev.atividade.pico?`pico: ${ev.atividade.diaLabel} às ${String(ev.atividade.pico.hora).padStart(2,"0")}h, com ${ev.atividade.pico.n} partidas`:"")}
      ${heatmap(ev.atividade)}</div></section>`;
  if(ev&&ev.sequencias&&ev.sequencias.length)
    o+=`<section><div class="card flush">${`<div style="padding:22px 24px 0">${chead(I.bolt,"Sequências","a maior sequência de cada um, e como está agora")}</div>`}
      <div class="tbox" style="border:0;border-radius:0"><table><thead><tr><th class="l">Jogador</th>
      <th>Sequência atual</th><th>Maior de vitórias</th><th>Maior de derrotas</th></tr></thead><tbody>
      ${ev.sequencias.map(s=>`<tr><td class="l"><div class="pl"><img src="${iconImg(s.icon)}"${FB}>
        <div class="a">${h(s.gameName)}</div></div></td>
        <td>${s.atual>0?`<span class="pill t">${s.atual}V seguidas</span>`:s.atual<0?`<span class="pill r">${-s.atual}D seguidas</span>`:`<span class="pill n">—</span>`}</td>
        <td><span class="num good">${s.maiorVitorias}</span></td>
        <td><span class="num bad">${s.maiorDerrotas}</span></td></tr>`).join("")}</tbody></table></div></div></section>`;
  return o;
}

function pEquipe(){
  const g=DATA.data.squad,x=g&&g.squadExtra;
  if(!g||!x||!g.players.length) return noData("SEM PARTIDAS EM EQUIPE","Ninguém do grupo jogou no mesmo time ainda.");
  return `<section><div class="stats">
      ${stat("gold",I.users,"Partidas em equipe",ni(x.squadMatches),`de ${ni(x.totalMatches)}`)}
      ${stat("teal",I.target,"Fatia do total",nf(x.coopRate,0)+"%","do que vocês jogam")}
      ${stat(g.team.winrate>=50?"teal":"red",I.award,"Aproveitamento juntos",nf(g.team.winrate,1)+"%",`${ni(g.team.wins)}V ${ni(g.team.losses)}D`)}
      ${stat("blue",I.sword,"KDA em equipe",nf(g.team.kda,2),`${nf(g.team.kills,1)}/${nf(g.team.deaths,1)}/${nf(g.team.assists,1)}`)}
    </div></section>
    <section><div class="card flush" style="padding:22px 24px 0">${chead(I.trend,"Junto ou sozinho?","o mesmo jogador nos dois cenários — Δ é quanto ele muda com a UDA no time")}</div>
      <div style="margin-top:-6px">${comparacao(x.comparison)}</div></section>
    <section><div class="card">${chead(I.users,"Matriz de sinergia",`aproveitamento de cada dupla no mesmo time · mínimo de ${x.matrix.minPair} partidas`)}
      ${matriz(x.matrix)}</div></section>
    <section><div class="grid g2">
      <div class="card">${chead(I.users,"Formações","trios, quartetos e time completo")}${formacoes(x.lineups)}</div>
      <div class="card">${chead(I.sword,"Confrontos internos","quando caem em times opostos","red")}${confrontos(x.clashes)}</div>
    </div></section>`;
}

function pJogadores(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  return `<section><div class="pcards">${g.players.map(p=>playerCard(p,DATA.metricLabels)).join("")}</div></section>`;
}

function pCampeoes(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  return `<section>${championTable(g.champions)}</section>`;
}

function pRegras(){
  const P=[["Vitórias",28],["KDA",18],["Dano por minuto",14],["Participação em abates",12],
           ["CS por minuto",10],["Sobrevivência",10],["Visão por minuto",8]];
  return `<section><div class="card"><div class="prose">
    <h3>O que o UDA Score mede</h3>
    <p>O Score compara <b>vocês com vocês</b>, não com o servidor. Um Score de <b>50 é exatamente a média
    da UDA</b>. Acima disso você está acima dos seus amigos; abaixo, o contrário.</p>
    <p>Isso não é preguiça: a Riot não publica estatísticas agregadas do BR. Não existe endpoint de
    "média do Esmeralda". Sites como o LeagueOfGraphs conseguem porque baixam milhões de partidas por
    conta própria. Comparar vocês com um número inventado seria pior do que não comparar.</p>

    <h3>As sete métricas e seus pesos</h3>
    <div class="wtable">${P.map(([m,v])=>`<div class="wrow"><span class="wn">${m}</span>
      <span class="wb"><i style="width:${v/28*100}%"></i></span><span class="wv">${v}%</span></div>`).join("")}</div>
    <p><b>Sobrevivência</b> é quantos minutos você vive por morte. <b>Participação</b> é a fatia dos
    abates do time em que você entrou, matando ou assistindo.</p>

    <h3>Como as métricas viram nota</h3>
    <p>Cada métrica vira um <b>z-score</b>: quantos desvios-padrão você está da média do grupo.
    Se a UDA ganha 50% em média e você ganha 58%, seu z de vitórias é positivo.</p>
    <p>É isso que torna a nota justa. Uma métrica em que todos são parecidos quase não separa ninguém;
    uma em que vocês se espalham muito pesa de verdade. O peso diz o quanto a métrica <i>importa</i>;
    o z-score diz o quanto ela <i>distingue</i>.</p>
    <p>O z é travado em <code>±2,6</code> desvios, para que um único jogo fora da curva não domine a nota.</p>
    <div class="formula">Score = 50 + 15,5 × Σ (peso × z-score)</div>
    <p>O resultado é limitado entre 1 e 99.</p>

    <h3>Quem entra no ranking</h3>
    <p>É preciso ter no mínimo <b>${DATA.minGames} partidas</b> na fila em questão. Sem isso, alguém com
    dois jogos de sorte lideraria. Quem não atinge aparece na tabela com <code>—</code> no lugar da nota.</p>

    <h3>Por fila, não no geral</h3>
    <p>O Score é recalculado dentro de cada fila, porque a média do grupo muda. Em <b>ARAM</b> e
    <b>Outros modos</b> os pesos são diferentes: CS e visão saem (não significam nada lá) e o dano sobe
    para 25%.</p>

    <h3>O que não entra na conta</h3>
    <ul>
      <li><b>Partidas contra bots</b>, tutorial e o modo Prática — inflariam vitórias e KDA artificialmente.</li>
      <li><b>Arena</b> (o 2v2v2v2, <code>gameMode=CHERRY</code>) — a API agrupa os jogadores de um jeito em que
      "abates do time" somaria 9 pessoas, destruindo participação e % de dano.</li>
      <li><b>Remakes</b> e qualquer partida com menos de 5 minutos.</li>
    </ul>
    <p>A classificação é por <code>gameMode</code>, que vem dentro da partida, e não por ID de fila —
    a Riot cria IDs novos sem avisar e a lista pública dela fica desatualizada.</p>

    <h3>O radar de cada jogador</h3>
    <p>Usa exatamente os mesmos z-scores, só que por métrica isolada, numa escala de 0 a 100. É por isso
    que ele mostra o <i>formato</i> do jogador: quem é dano puro tem uma ponta esticada, quem é equilibrado
    tem um polígono cheio.</p>
    <p style="border-top:1px solid var(--line);padding-top:16px;margin-top:24px">O Score não mede habilidade
    absoluta. Se a UDA inteira melhorasse 20% amanhã, as notas continuariam em torno de 50 — a régua é o
    próprio grupo. Para habilidade absoluta, a coluna <b>Elo</b> é a medida honesta.</p>
  </div></div></section>`;
}

const vazio=()=>noData("SEM PARTIDAS NESTA FILA",
  `Ninguém do grupo jogou <b>${h((DATA.groups.find(x=>x.key===fila)||{}).label||fila)}</b> na janela analisada.`);
const RENDER={visao:pVisao,ranking:pRanking,evolucao:pEvolucao,equipe:pEquipe,
  jogadores:pJogadores,campeoes:pCampeoes,regras:pRegras};

/* ========================================================== NAVEGAÇÃO */
function pintarNav(){
  const grupos=[...new Set(PAGES.map(p=>p.g))];
  $("#nav").innerHTML=grupos.map(gr=>`<div class="navgroup"><div class="lbl">${gr}</div>
    ${PAGES.filter(p=>p.g===gr).map(p=>{
      const badge=p.k==="equipe"&&DATA.data.squad?`<span class="badge">${DATA.data.squad.team.uniqueMatches}</span>`:"";
      return `<button class="nav" data-p="${p.k}" ${p.k===page?'aria-current="page"':""}>${svg(p.i)}${h(p.n)}${badge}</button>`;
    }).join("")}</div>`).join("");
  document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>irPara(b.dataset.p,fila));

  const meta=PAGES.find(p=>p.k===page)||PAGES[0];
  $("#ptitle").textContent=meta.n;
  $("#psub").textContent=meta.sub;

  const t=DATA.data.all?DATA.data.all.team:{winrate:0,uniqueMatches:0};
  $("#sidecard").innerHTML=`<div class="k">Aproveitamento geral</div>
    <div class="v ${t.winrate>=50?"good":"bad"}">${nf(t.winrate,1)}%</div>
    <div class="s">${ni(t.uniqueMatches)} partidas analisadas</div>
    <div class="track"><i style="width:${Math.max(0,Math.min(100,t.winrate))}%;background:${t.winrate>=50?"var(--teal)":"var(--red)"}"></i></div>`;

  const idade=DATA.lastFetch?(Date.now()-DATA.lastFetch)/3600000:999;
  $("#tbright").innerHTML=`${meta.q?`<div class="seg">${filas().map(g=>{
      const d=DATA.data[g.key];
      return `<button data-q="${g.key}" aria-pressed="${g.key===fila}">${h(g.label)}<b>${d?d.team.uniqueMatches:0}</b></button>`;
    }).join("")}</div>`:""}
    <span class="chip"><span class="dot ${idade<26?"":"old"}"></span>${DATA.demo?"Gerado":"Atualizado"} <b>${ago(DATA.lastFetch||DATA.generatedAt)}</b></span>
    <span class="chip">Patch <b>${h(DD)}</b></span>`;
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>irPara(page,b.dataset.q));
}

function irPara(p,q){
  page=RENDER[p]?p:"visao"; fila=DATA.data[q]?q:"all";
  location.hash=`#/${page}/${fila}`;
  sortKey="rank";sortDir=1;
  pintarNav(); desenhar(); window.scrollTo({top:0,behavior:"instant"});
}
function desenhar(){
  $("#app").innerHTML=RENDER[page]();
  if($("#tbl")) ligarTabela();
  ligarSeletor();
}

function ligarSeletor(){
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{selJog.clear();desenhar();});
  document.querySelectorAll("[data-jog]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.jog;
    // Sem seleção ativa, o primeiro clique ISOLA aquele jogador.
    // Com seleção ativa, alterna; tirar o último volta a mostrar todos.
    if(!selJog.size) selJog=new Set([id]);
    else if(selJog.has(id)) selJog.delete(id);
    else selJog.add(id);
    desenhar();
  });
}

function ligarTabela(){
  document.querySelectorAll("#tbl thead th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(k===sortKey) sortDir*=-1; else {sortKey=k;sortDir=1;}
    $("#tbl").innerHTML=tabela(grupo()); ligarTabela();});
  document.querySelectorAll("#tbl tbody tr[data-p]").forEach(tr=>tr.onclick=()=>{
    const id=tr.dataset.p; irPara("jogadores",fila);
    setTimeout(()=>{const c=document.getElementById("pc-"+id);
      if(c){c.scrollIntoView({behavior:"smooth",block:"center"});
        c.style.borderColor="var(--teal)";setTimeout(()=>c.style.borderColor="",1800);}},60);});
}

if(!DATA){
  $("#app").innerHTML=noData("PAINEL AINDA NÃO GERADO","Rode <code>python run.py</code> para buscar os dados e montar o painel.");
}else{
  if(DATA.demo){$("#demo-banner").hidden=false;document.title="DADOS FICTÍCIOS · "+document.title;
    $("#ft-fonte").innerHTML="<b style='color:var(--red)'>Dados fictícios</b> — gerados por demo.py, sem chamada à Riot";}
  $("#brandsub").textContent=(DATA.platform||"br1").toUpperCase()+" · "+(DATA.data.all?DATA.data.all.players.length:0)+" jogadores";
  $("#ft-jan").textContent=`Janela: ${DATA.windowDays>0?DATA.windowDays+" dias":"histórico completo"}`;
  $("#ft-ger").textContent=`Gerado em ${new Date(DATA.generatedAt).toLocaleString("pt-BR")}`;
  const m=(location.hash||"").match(/^#\/([a-z]+)\/([a-z]+)/);
  if(m){if(RENDER[m[1]])page=m[1];if(DATA.data[m[2]])fila=m[2];}
  window.addEventListener("hashchange",()=>{const x=(location.hash||"").match(/^#\/([a-z]+)\/([a-z]+)/);
    if(x&&(x[1]!==page||x[2]!==fila)) irPara(x[1],x[2]);});
  pintarNav(); desenhar();
}
</script>
</body>
</html>
