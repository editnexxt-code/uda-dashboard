function afundados(g){
  const rk=g.players.filter(p=>p.rank!=null);
  const l=g.shame.map(id=>rk.find(p=>p.puuid===id)).filter(Boolean).filter(p=>!g.podium.includes(p.puuid));
  if(!l.length) return "";
  const lider=rk[0]?rk[0].score:99;
  /* pílulas só com o que está de fato abaixo da média do grupo */
  const med=(f)=>rk.reduce((s,p)=>s+f(p),0)/rk.length;
  const mWr=med(p=>p.stats.winrate), mKda=med(p=>p.stats.kda),
        mD=med(p=>p.stats.deaths_10min), mDmg=med(p=>p.stats.dmg_min),
        mKp=med(p=>p.stats.kp), mCs=med(p=>p.stats.cs_min);
  const why=p=>{const s=p.stats,c=[];
    if(s.winrate<mWr) c.push([`${nf(s.winrate,0)}% de vitórias`,`média ${nf(mWr,0)}%`]);
    if(s.kda<mKda) c.push([`KDA ${nf(s.kda,2)}`,`média ${nf(mKda,2)}`]);
    if(s.deaths_10min>mD) c.push([`${nf(s.deaths_10min,2)} mortes/10min`,`média ${nf(mD,2)}`]);
    if(s.dmg_min<mDmg) c.push([`${ni(s.dmg_min)} dano/min`,`média ${ni(mDmg)}`]);
    if(s.kp<mKp) c.push([`${nf(s.kp,0)}% de participação`,`média ${nf(mKp,0)}%`]);
    if(s.cs_min<mCs) c.push([`${nf(s.cs_min,1)} cs/min`,`média ${nf(mCs,1)}`]);
    return c.slice(0,4);};
  return `<div class="card">${chead(I.skull,"Os afundados",
      "a régua é o próprio grupo — alguém tinha que ficar embaixo","red")}
    <div class="sunk">${l.map(p=>{
      const e=eloTxt(p.ranks.solo), w=p.worstGame, motivos=why(p);
      return `<div class="sk">
        <div class="sk-h"><div class="pos">${p.rank}º</div>
          <img src="${iconImg(p.icon)}"${FB}>
          <div class="who"><div class="nm">${h(short(p.gameName))}</div>
            <div class="el">${h(e.name)} · ${p.stats.games} partidas</div></div>
          <div class="sc">${nf(p.score,1)}</div></div>
        ${motivos.length?`<div class="sk-why">${motivos.map(([a,b])=>
          `<span class="pill r" title="${h(b)}">${h(a)}</span>`).join("")}</div>`:""}
        <div class="sk-gap"><div class="lbl"><span>UDA Score</span>
            <span>líder: <b style="color:var(--gold)">${nf(lider,1)}</b></span></div>
          <div class="track"><i style="width:${Math.max(3,Math.min(100,p.score))}%"></i>
            <u style="left:50%" title="50 = média do grupo"></u></div></div>
        ${w?`<div class="sk-worst"><img src="${champImg(w.championId,w.champion)}"${FB}>
          <div><div class="l">Pior partida</div>
            <div class="v bad">${w.k}/${w.d}/${w.a} de ${h(w.champion)} · ${w.minutes} min</div></div></div>`:""}
      </div>`;}).join("")}</div></div>`;
}

/* As 19 colunas viram SEIS blocos. O cabecalho de familia paga por si duas
   vezes: da o contexto que deixa o <th> encurtar ("Dano sofrido/min" ->
   "sofrido" sob SOBREVIVENCIA), e e o encurtamento que faz a coluna cair de
   112px para 60px. O nome inteiro vai em `n` -- que vira o data-l lido pela
   gaveta do celular e pela ficha de ordenacao. Um dado, dois nomes. */
const FAM=[
  {k:"quem",     t:"Quem",          c:"var(--mut)"},
  {k:"combate",  t:"Combate",       c:"var(--red)"},
  {k:"economia", t:"Economia",      c:"var(--gold-2)"},
  {k:"sobrev",   t:"Sobrevivência", c:"var(--teal)"},
  {k:"mapa",     t:"Mapa",          c:"var(--blue)"},
  {k:"veredito", t:"Veredito",      c:"var(--gold-1)"},
];
/* m:{} marca a coluna-REGUA: ela e desenhada por gg() com a barra normalizada
   entre o pior e o melhor dos treze. m.neu tira o podio da coluna -- volume nao
   e virtude (jogos) e levar dano nao e merito nem defeito (dano sofrido).
   A barra e preenchida por s(), a MESMA funcao que ordena: em mortes/10min o
   s() ja devolve o negativo, entao "mais barra = melhor" sai de graca em todas
   as colunas, sem uma segunda tabela dizendo onde a direcao inverte. */
const COLS=[
  {k:"rank",fam:"quem",t:"#",n:"Posição",l:1,
   f:p=>p.rank==null?`<span class="rnk">—</span>`
     :`<span class="rnk${p.rank<=3?" md md"+p.rank:""}">${p.rank}</span>`},
  {k:"gameName",fam:"quem",t:"Jogador",n:"Jogador",l:1,s:p=>p.gameName.toLowerCase(),
   f:(p,x)=>`<div class="pl"><img src="${iconImg(p.icon)}"${FB}><div><div class="a">${h(short(p.gameName))}${
     x&&x.oz?`<span class="oz">${x.oz}× 1º</span>`:""}</div>
     <div class="b">#${h(p.tagLine)} · nível ${p.level}</div></div></div>`},
  {k:"elo",fam:"quem",t:"Elo",n:"Elo",l:1,s:p=>p.ranks.solo?p.ranks.solo.weight:-1,f:p=>{const e=eloTxt(p.ranks.solo),r=p.ranks.solo;
    return `<div class="eloc" title="${r?`Ranqueada solo: ${r.wins}V ${r.losses}D`:""}"><img src="${crestImg(e.tier)}"${FB}>
      <div><div class="a">${h(e.name)}</div><div class="b">${r?`${r.lp} PDL`:"—"}</div></div></div>`;}},
  {k:"games",fam:"quem",t:"jogos",n:"Jogos",s:p=>p.stats.games,
   m:{neu:1,v:p=>ni(p.stats.games)}},
  {k:"winrate",fam:"quem",t:"vitórias",n:"Vitórias",s:p=>p.stats.winrate,
   m:{v:p=>nf(p.stats.winrate,1)+"%",sub:p=>`${p.stats.wins}V ${p.stats.losses}D`}},

  {k:"kda",fam:"combate",fs:1,t:"KDA",n:"KDA",s:p=>p.stats.kda,
   m:{v:p=>nf(p.stats.kda,2),
      sub:p=>`${nf(p.stats.kills,1)}/${nf(p.stats.deaths,1)}/${nf(p.stats.assists,1)}`}},
  {k:"kp",fam:"combate",t:"abates",n:"Participação em abates",s:p=>p.stats.kp,
   m:{v:p=>nf(p.stats.kp,0)+"%"}},
  {k:"dmg_min",fam:"combate",t:"dano",n:"Dano por minuto",s:p=>p.stats.dmg_min,
   m:{v:p=>ni(p.stats.dmg_min)}},
  {k:"dmg_share",fam:"combate",t:"% dano",n:"Fatia do dano do time",s:p=>p.stats.dmg_share,
   m:{v:p=>nf(p.stats.dmg_share,0)+"%"}},
  {k:"first_blood_rate",fam:"combate",t:"1º sangue",n:"First blood",s:p=>p.stats.first_blood_rate,
   m:{v:p=>nf(p.stats.first_blood_rate,0)+"%"}},
  {k:"multikills",fam:"combate",t:"multi",n:"Multikills",
   s:p=>{const m=p.stats.multikills;return m.double+m.triple*3+m.quadra*9+m.penta*27;},
   m:{v:p=>{const m=p.stats.multikills;return ni(m.double+m.triple+m.quadra+m.penta);},
      sub:p=>{const m=p.stats.multikills;
        return m.penta?`${m.penta} penta${m.penta>1?"s":""}`:m.quadra?`${m.quadra} quádruplo${m.quadra>1?"s":""}`:`${m.triple} triplo${m.triple===1?"":"s"}`;}}},

  {k:"cs_min",fam:"economia",fs:1,t:"CS/min",n:"CS por minuto",s:p=>p.stats.cs_min,
   m:{v:p=>nf(p.stats.cs_min,1)}},
  {k:"gold_min",fam:"economia",t:"ouro",n:"Ouro por minuto",s:p=>p.stats.gold_min,
   m:{v:p=>ni(p.stats.gold_min)}},

  {k:"deaths_10min",fam:"sobrev",fs:1,t:"mortes",n:"Mortes por 10 minutos",
   s:p=>-p.stats.deaths_10min,m:{v:p=>nf(p.stats.deaths_10min,2)}},
  {k:"dmg_taken_min",fam:"sobrev",t:"sofrido",n:"Dano sofrido por minuto",
   s:p=>p.stats.dmg_taken_min,m:{neu:1,v:p=>ni(p.stats.dmg_taken_min)}},
  {k:"heal_shield_game",fam:"sobrev",t:"cura",n:"Cura + escudo por partida",
   s:p=>p.stats.heal_shield_game,m:{v:p=>ni(p.stats.heal_shield_game)}},

  {k:"vision_min",fam:"mapa",fs:1,t:"visão",n:"Visão por minuto",s:p=>p.stats.vision_min,
   m:{v:p=>nf(p.stats.vision_min,2)}},
  {k:"turrets_game",fam:"mapa",t:"torres",n:"Torres por partida",s:p=>p.stats.turrets_game,
   m:{v:p=>nf(p.stats.turrets_game,1)}},

  {k:"score",fam:"veredito",fs:1,t:"UDA Score",n:"UDA Score",s:p=>p.score??-1,
   f:p=>p.score==null?`<span style="color:var(--dim)">—</span>`
    :`<span class="pill ${p.score>=60?"t":p.score>=45?"g":"r"}">${nf(p.score,1)}</span>`},
];
let sortKey="rank",sortDir=1;

/* FACE governa DUAS coisas ao mesmo tempo: o que aparece no rosto do cartao e o
   que NUNCA precisa ser promovido pela ordenacao. Quem mexer aqui mexe nas duas.
   Sao as sete perguntas do rosto: quem e, quanto vale, joga bem? */
const FACE=new Set(["rank","gameName","elo","games","winrate","kda","score"]);

/* data-k diz QUE metrica a celula e; data-l diz COMO ela se chama. Sao os dois
   atributos com que o CSS monta a grade do cartao e escreve o rotulo que o
   <thead> deixou de dar no celular. Custo total: dois atributos por celula. */
const cel=(k,l,extra)=>` data-k="${k}" data-l="${h(l)}"`+(extra||"");

/* AS COLUNAS DESTA FILA. Na fila das personalizadas duas saem: visão por minuto
   tem média 0,0 e sentinela zerada em 100% das linhas (o cliente do LoL não
   mede visão no Abismo), e CS/min existe mas é minion passivo de ARAM, não farm.
   As duas já estão fora do Score pelo perfil de peso; deixá-las na tabela seria
   desenhar uma régua inteira para uma coluna de zeros. */
const SEM_LCU=new Set(["cs_min","vision_min"]);
const colsDe=(g)=>(g&&g.lcu)?COLS.filter(c=>!SEM_LCU.has(c.k)):COLS;

function tabela(g){
  const CS=colsDe(g);
  /* a ordenação pode apontar para uma coluna que esta fila não tem (você ordenou
     por visão e trocou de fila): volta para o ranking em vez de quebrar. */
  const col=CS.find(c=>c.k===sortKey)||CS[0];
  if(col.k!==sortKey&&sortKey!=="rank") sortKey=col.k;
  const rows=[...g.players].sort((a,b)=>{
    if(sortKey==="rank") return ((a.rank??1e9)-(b.rank??1e9))*(sortDir>0?1:-1);
    const av=col.s?col.s(a):0,bv=col.s?col.s(b):0;
    return typeof av==="string"?av.localeCompare(bv)*(sortDir>0?1:-1):(bv-av)*(sortDir>0?1:-1);});
  const seta=k=>k===sortKey?(sortDir>0?" ↓":" ↑"):"";

  /* A REGUA DE CADA COLUNA. Normalizada por coluna e nao contra o zero:
     participacao em abates varia de 45% a 65%, e uma barra contra 0-100
     deixaria as treze identicas -- barra que nao distingue e pior que numero
     solto. Lider e lanterna so ganham cor quando NAO ha empate na ponta: com
     13 jogadores, empate no maximo costuma ser 0 torres ou 0 pentas, que e
     ruido e nao lideranca. */
  const R={};
  CS.filter(c=>c.m).forEach(c=>{
    const v=g.players.map(p=>c.s(p)).filter(x=>typeof x==="number"&&isFinite(x));
    const mn=Math.min(...v),mx=Math.max(...v);
    R[c.k]={min:mn,max:mx,amp:(mx-mn)||0,
      um:v.filter(x=>x===mx).length===1, un:v.filter(x=>x===mn).length===1};
  });
  /* quantas das colunas COM podio cada jogador lidera: e a manchete que a
     tabela nunca deu, e ela vem de graca da mesma conta das barras */
  const OZ={};
  CS.filter(c=>c.m&&!c.m.neu).forEach(c=>{const r=R[c.k]; if(!r||!r.um) return;
    g.players.forEach(p=>{if(c.s(p)===r.max) OZ[p.puuid]=(OZ[p.puuid]||0)+1;});});

  const gg=(c,p)=>{
    const r=R[c.k],sv=c.s(p);
    const w=r.amp?Math.max(4,Math.min(100,(sv-r.min)/r.amp*100)):100;
    const cls=c.m.neu?"neu":(r.um&&sv===r.max?"led":(r.un&&sv===r.min?"lan":""));
    return `<span class="gg ${cls}"><b class="n">${c.m.v(p)}</b>
      <span class="tk"><i style="width:${w.toFixed(1)}%"></i></span>${
      c.m.sub?`<span class="s">${c.m.sub(p)}</span>`:""}</span>`;};

  /* A regua e a 20a coluna: sem <thead> no celular nao ha como ordenar, e sem
     ordenacao um ranking morre. Ela nasce fora da .tbox porque nao e dado.
     A ficha usa o nome INTEIRO (c.n): "sofrido" so faz sentido debaixo da
     familia, e no celular nao existe familia nenhuma. */
  const regua=`<div class="tsort" role="group" aria-label="Ordenar o ranking">
    <span class="tsl">ordenar</span>
    <div class="tsf">${CS.map(c=>`<button type="button" class="tsc" data-sk="${c.k}"
      aria-pressed="${c.k===sortKey}">${h(c.n||c.t)}${seta(c.k)}</button>`).join("")}</div></div>`;

  /* o <th> de familia nasce SEM data-k de proposito: ligarTabela amarra clique
     em `#tbl thead th[data-k]`, entao cabecalho de grupo nao vira botao de
     ordenacao sozinho. */
  const chefes=FAM.map(f=>{const n=CS.filter(c=>c.fam===f.k).length;
    return n?`<th scope="colgroup" role="columnheader" colspan="${n}" data-fam="${f.k}"
      style="--fam:${f.c}"${f.k===FAM[0].k?"":' data-fs=""'}>${h(f.t)}</th>`:"";}).join("");

  /* role= explicito porque display:grid em table/tr/td apaga o papel nativo de
     tabela no Chrome e no Firefox. Cartao nao pode custar acessibilidade. */
  return `${regua}<div class="tbox cards spine"><table role="table"><thead role="rowgroup">
    <tr class="ghr" role="row">${chefes}<th${cel("_go","")}></th></tr>
    <tr class="chr" role="row">${CS.map(c=>
    `<th scope="col" role="columnheader" title="${h(c.n||c.t)}"
      class="${c.l?"l":""} ${c.k===sortKey?"on":""}"${
      cel(c.k,c.n||c.t,c.fs?' data-fs=""':"")}>${c.t}${seta(c.k)}</th>`).join("")}<th${cel("_go","")}></th></tr></thead>
    <tbody role="rowgroup">${rows.map(p=>{const s=p.stats,e=eloTxt(p.ranks.solo);
      const t=tip(h(p.gameName),[
        ["Elo",e.name+(e.sub?` · ${e.sub}`:"")],
        ["UDA Score",p.score==null?"sem ranking":`${nf(p.score,1)} · ${p.rank}º lugar`,
          p.score==null?null:(p.score>=60?"var(--teal)":p.score>=45?"var(--gold)":"var(--red)")],
        ["Partidas",`${s.games} · ${s.wins}V ${s.losses}D`],
        ["KDA",`${nf(s.kills,1)} / ${nf(s.deaths,1)} / ${nf(s.assists,1)} = ${nf(s.kda,2)}`],
        ["Colunas que lidera",OZ[p.puuid]?`${OZ[p.puuid]} de ${CS.filter(c=>c.m&&!c.m.neu).length}`:"nenhuma",
          OZ[p.puuid]?"var(--gold)":null],
        ["Rota mais jogada",p.roles&&p.roles[0]?`${ROTAS[p.roles[0].role]||p.roles[0].role} (${p.roles[0].games})`:"—"],
        ["Campeão mais jogado",p.champions&&p.champions[0]?`${p.champions[0].champion} (${p.champions[0].games})`:"—"],
      ],"clique para abrir o cartão completo");
      const ctx={oz:OZ[p.puuid]||0};
      /* data-on e decidido AQUI e nao no CSS: no CSS exigiria um :not() com as
         sete chaves do rosto. So promove quem nao esta no rosto. */
      return `<tr role="row" tabindex="0" data-p="${h(p.puuid)}"${
        p.rank&&p.rank<=3?` data-md="${p.rank}"`:""}${t}>${CS.map(c=>{
        const naGaveta=!FACE.has(c.k);
        return `<td role="cell" class="${c.l?"l":""}"${cel(c.k,c.n||c.t,
          (c.fs?' data-fs=""':"")+(naGaveta?' data-drawer=""':"")+(naGaveta&&c.k===sortKey?' data-on=""':""))}>${
          c.m?gg(c,p):c.f(p,ctx)}</td>`;}).join("")
      }<td role="cell"${cel("_go","")}>ver o cartão completo →</td></tr>`;}).join("")}</tbody></table></div>`;
}

const AWICON={carregador:I.bolt,assassino:I.sword,imortal:I.heart,farmador:I.grid,
  sentinela:I.eye,presenca:I.users,doador:I.skull,cego:I.eye,fantasma:I.user,
  turista:I.grid,azarado:I.target,figurante:I.bolt};

/* Os dois halls são UMA sala só, construída duas vezes: o mesmo componente
   .hall, o mesmo quadro .aw, trocando --acc pela classe e o texto do eyebrow.
   Cada prêmio é um quadro pendurado: a arte é o campeão mais jogado do
   premiado (vem pronta do kpi.py), o retrato dele é o disco de metal e o nome
   fica na placa gravada. Na sala da vergonha os ímpares estão tortos. */
function hall(g,bad){
  const l=bad?g.awardsBad:g.awardsGood;
  if(!l||!l.length) return "";
  return `<section class="hall${bad?" hall-shame":""}" data-sec="hall-${bad?"vergonha":"fama"}">
    <div class="hall-head">
      <span class="eyebrow">União dos Afundados · ${h(g.label||"")}</span>
      <h2 class="poster-title engraved">${bad?"Hall da Vergonha":"Hall da Fama"}</h2>
      <hr class="rule">
      <p class="poster-note">${bad
        ? "o pior de cada métrica — alguém tinha que ser, e a régua é o próprio grupo"
        : "o melhor de cada métrica, e quanto ele está à frente da média do grupo"}</p>
    </div>
    <div class="awards">${l.map(a=>{
      const edge=a.edge==null?null:Math.round(a.edge);
      const t=tip(h(a.title),[
        [bad?"Lanterna":"Campeão",h(a.player)],
        ["Marca",`${h(a.value)} ${h(a.unit)}`],
        ["Média do grupo",h(a.avg??"—")],
        edge!=null?["Distância da média",`${edge>0?"+":""}${edge}%`]:null,
      ].filter(Boolean),a.champion?`ilustração: ${h(a.champion)} — clique para o dossiê dele`:"");
      /* o quadro abre o dossie do campeao ilustrado: a arte deixa de ser enfeite */
      const dc=a.championId?` data-champ="${a.championId}" tabindex="0" role="button"
        aria-label="Abrir dossiê de ${h(a.champion||"")}"`:"";
      return `<article class="aw"${dc}${t}>
        <div class="aw-tag"><span class="ic">${svg(AWICON[a.key]||I.award)}</span>
          <span class="t">${h(a.title)}</span></div>
        <div class="aw-win artbox${a.championId?"":" noart"}">
          ${a.championId?`<img class="art" src="${artLoad(a.championId,a.champion)}"${FBART}>`:""}
          <div class="scrim"></div></div>
        <div class="aw-in">
          <div class="aw-disc"><img src="${iconImg(a.icon)}"${FB}></div>
          <div class="aw-plate"><div class="nm">${h(short(a.player))}</div>
            <div class="d">${h(a.desc)}</div></div>
          <div class="aw-sc"><b data-count="${a.raw??""}" data-dec="${decDe(a.value)}">${h(a.value)}</b><span>${h(a.unit)}</span></div>
          <div class="aw-m">
            <div class="track"><i style="width:${Math.max(6,Math.min(100,a.fill??100))}%"></i></div>
            <div class="cap"><span>média do grupo <b>${h(a.avg??"—")}</b></span>
              ${edge!=null?`<span><b>${edge>0?"+":""}${edge}%</b> ${edge>=0?"acima":"abaixo"}</span>`:""}</div>
          </div>
          ${a.runnersUp&&a.runnersUp.length?`<div class="aw-f"><span class="lbl">seguido por</span>
            ${a.runnersUp.map(r=>`<span class="ru"><img src="${iconImg(r.icon)}"${FB}>
              <span>${h(short(r.player))} ${h(r.value)}</span></span>`).join("")}</div>`:""}
        </div>
      </article>`;}).join("")}</div></section>`;
}

    <div class="form">${p.form.map(f=>`<i class="${f.win?"w":"l"}"${linkPartida(f.matchId)}${tip(h(f.champion),[

      ["KDA",`${f.k} / ${f.d} / ${f.a} = ${nf(f.kda,2)}`],
      ["Dano",ni(f.dmg)],["Farm",`${ni(f.cs)} CS`],
    ],`${h(f.queue)} · ${f.minutes} min`)}>${f.win?"V":"D"}</i>`).join("")}</div>
    ${(p.bestGame||p.worstGame)?`<div class="bw">

        <div><div class="l">Melhor partida${temPlacar(p.bestGame.matchId)?`<span class="lupa">ver placar</span>`:""}</div>
        <div class="v good">${p.bestGame.k}/${p.bestGame.d}/${p.bestGame.a} · ${h(p.bestGame.champion)}</div></div></div>`:""}
      ${p.worstGame?`<div class="bwc"${linkPartida(p.worstGame.matchId)}><img src="${champImg(p.worstGame.championId,p.worstGame.champion)}"${FB}>
        <div><div class="l">Pior partida${temPlacar(p.worstGame.matchId)?`<span class="lupa">ver placar</span>`:""}</div>
        <div class="v bad">${p.worstGame.k}/${p.worstGame.d}/${p.worstGame.a} · ${h(p.worstGame.champion)}</div></div></div>`:""}
    </div>`:""}
    <div class="champs">${p.champions.map(c=>`<div class="champ" data-champ="${c.championId}"
      tabindex="0" role="button" title="Dossiê de ${h(c.champion)}"><img src="${champImg(c.championId,c.champion)}"${FB}>
      <span class="cn">${h(c.champion)}</span><span class="cg">${c.games} jogo${c.games>1?"s":""}</span>
      <span class="cw ${cl(c.winrate,50)}">${nf(c.winrate,0)}%</span><span class="ck">${nf(c.kda,2)} KDA</span></div>`).join("")
      ||`<div style="color:var(--dim);font-size:12px">sem dados</div>`}</div></div>`;
}
const ROTAS={TOP:"Topo",JUNGLE:"Selva",MIDDLE:"Meio",BOTTOM:"Atirador",UTILITY:"Suporte"};

/* ===================================================== A ESTANTE
   Substitui championTable. O Arsenal responde "quais sao os doze"; a Estante
   responde o que sobra: a cauda longa, quem pilota o que, e onde o grupo ganha
   ou afunda. Cada campeao vira uma barra DIVERGENTE ancorada nos 50%, e a
   regua central repetida faixa a faixa vira um eixo vertical -- e o eixo que
   faz o bloco ser lido como grafico e nao como lista.
   A escala e travada em +-30 pontos: sem trava, um 100% de tres jogos
   esmagaria todo mundo contra a parede e as diferencas reais (52% x 44%)
   virariam um fio. */
const EST_CAP=30;   /* pontos percentuais em cada metade da regua */
const EST_MIN=5;    /* abaixo disso o aproveitamento e ruido: barra hachurada */
const EST_ORD=[
  ["jogos","Mais jogados",(a,b)=>b.games-a.games||b.winrate-a.winrate],
  ["cauda","A cauda longa",(a,b)=>a.games-b.games||b.winrate-a.winrate],
  ["alto","Onde a UDA vence",(a,b)=>b.winrate-a.winrate||b.games-a.games],
  ["baixo","Onde a UDA afunda",(a,b)=>a.winrate-b.winrate||b.games-a.games],
  ["kda","Melhor KDA",(a,b)=>b.kda-a.kda||b.games-a.games],
  ["pilotos","Mais pilotos",(a,b)=>b.pilots-a.pilots||b.games-a.games],
];
const EST_PAPEL=["Fighter","Mage","Assassin","Marksman","Support","Tank"];
const estTags=(id)=>((CDET[String(id)]||{}).tags)||[];
let EST_K="jogos", EST_P="";

/* 30 campeoes x 14 jogadores varridos uma vez so: montar o mapa de pilotos por
   campeao aqui evita um find() dentro do laco de render. */
function estPilotos(g){
  const m={};
  (g.players||[]).forEach(p=>(p.champions||[]).forEach(c=>{
    const k=String(c.championId);
    (m[k]||(m[k]=[])).push({icon:p.icon,nome:p.gameName,games:c.games});}));
  Object.keys(m).forEach(k=>m[k].sort((a,b)=>b.games-a.games));
  return m;
}

function estanteGrade(l,mapa){
  const ord=(EST_ORD.find(o=>o[0]===EST_K)||EST_ORD[0])[2];
  const vis=(EST_P?l.filter(c=>estTags(c.championId).indexOf(EST_P)>=0):l).slice().sort(ord);
  if(!vis.length) return `<div class="est-vazio">Nenhum campeão deste papel nesta fila.</div>`;
  return `<div class="estante">${vis.map((c,i)=>{
    const pl=mapa[String(c.championId)]||[];
    const acima=c.winrate>=50, dif=Math.min(EST_CAP,Math.abs(c.winrate-50));
    /* metade do trilho vale EST_CAP pontos: a barra nunca passa dos 50% de largura */
    const w=(dif/EST_CAP*50).toFixed(2);
    const pouco=c.games<EST_MIN;
    const t=tip(h(c.champion),[
      ["Partidas",ni(c.games)],
      ["Resultado",`${c.wins}V ${c.losses}D`],
      ["Aproveitamento",nf(c.winrate,1)+"%",acima?"var(--teal)":"var(--red)"],
      ["KDA médio",nf(c.kda,2)],
    ].concat(pl.slice(0,4).map((x,j)=>[j?"":"Pilotos",`${short(x.nome)} · ${x.games}`]))
     .concat(pouco?[["Amostra curta",`só ${c.games} partida${c.games>1?"s":""}`,"var(--red)"]]:[]),
      pouco?"menos de 5 partidas: o aproveitamento aqui é ruído, não tendência"
           :"clique para abrir o dossiê do campeão");
    return `<article class="est-l${pouco?" pouco":""}" data-champ="${c.championId}"
      tabindex="0" role="button" style="--i:${i}"
      aria-label="Abrir dossiê de ${h(c.champion)}"${t}>
      <span class="e-rk${i<3?" m"+(i+1):""}">${i+1}</span>
      <img class="e-ic" src="${champImg(c.championId,c.champion)}"${FB}>
      <span class="e-nm">${h(c.champion)}</span>
      <span class="e-wr ${cl(c.winrate,50)}">${nf(c.winrate,0)}%</span>
      <span class="e-mt">${pl.length?`<span class="e-ims">${pl.slice(0,3).map(x=>
        `<img src="${iconImg(x.icon)}"${FB}>`).join("")}</span>`:""}
        <span class="e-tx">${c.games} jogo${c.games>1?"s":""}${
          pl.length?` · ${h(short(pl[0].nome))} lidera`:""}</span></span>
      <span class="e-kd"><i>KDA</i>${nf(c.kda,2)}</span>
      <span class="e-br"><i class="${acima?"":"lo"}" style="${
        acima?`left:50%;width:${w}%;transform-origin:0 50%`
             :`right:50%;width:${w}%;transform-origin:100% 50%`}"></i></span>
    </article>`;}).join("")}</div>`;
}

function estante(g){
  const l=(g&&g.champions)||[];
  if(!l.length) return `<section class="hall hall-est"><div class="hall-head">
    <span class="eyebrow">União dos Afundados · ${h((g&&g.label)||"")}</span>
    <h2 class="poster-title engraved">A Estante</h2><hr class="rule"></div>
    ${noData("SEM CAMPEÕES","Nenhum campeão atingiu 3 partidas nesta fila.")}</section>`;
  const mapa=estPilotos(g);
  const papeis=EST_PAPEL.filter(t=>l.some(c=>estTags(c.championId).indexOf(t)>=0));
  const curta=l.filter(c=>c.games<EST_MIN).length;
  return `<section class="hall hall-est">
    <div class="hall-head">
      <span class="eyebrow">União dos Afundados · ${h(g.label||"")}</span>
      <h2 class="poster-title engraved">A Estante</h2>
      <hr class="rule">
      <p class="poster-note">os ${l.length} campeões do grupo, cada um numa barra que
        diverge dos 50% — à direita do eixo é o que vocês ganham, à esquerda é o que
        afunda${curta?`; ${curta} deles têm menos de ${EST_MIN} partidas e vêm hachurados`:""}</p>
    </div>
    <div class="est-fx" role="group" aria-label="Lente da estante">

      ${papeis.length?`<span class="sep"></span>

function ligarEstante(){
  const g=grupo(); if(!g) return;
  const l=g.champions||[]; if(!l.length) return;
  const mapa=estPilotos(g);
  const repintar=()=>{
    const alvo=document.querySelector(".estante,.est-vazio"); if(!alvo) return;
    alvo.outerHTML=estanteGrade(l,mapa);
    document.querySelectorAll(".est-fx .tsc").forEach(b=>{
      if(b.dataset.ek!=null) b.setAttribute("aria-pressed",String(b.dataset.ek===EST_K));

    if(b.dataset.ek!=null) EST_K=b.dataset.ek; else EST_P=b.dataset.ep||"";
    repintar();});
}

/* ================================================= A SALA DOS RECORDES
   O payload traz ~30 recordes por fila, cada um com dono, campeao e a partida
   exata em que aconteceu. Tres sao RELIQUIAS e ficam fora das abas: nao existe
   "quase pentakill". */
const RELIQUIAS=["penta","rouboSemSmite","semMorte"];
/* Nas personalizadas o "Roubo Sem Smite" ficaria eternamente vago: ele vem de
   challenges{}, que o cliente do LoL não tem, e no Abismo não existe objetivo
   épico para roubar. Uma relíquia que NUNCA pode ter dono não é uma relíquia
   vazia, é uma promessa falsa — sai, e a Sequência Imparável toma o lugar. */
const RELIQUIAS_LCU=["penta","semMorte","sequencia"];
const reliquiasDe=(g)=>(g&&g.lcu)?RELIQUIAS_LCU:RELIQUIAS;
const RGRUPO=[["gloria","Glória","var(--gold-2)"],
              ["vergonha","Vergonha","var(--red)"],
              ["curiosidade","Curiosidade","var(--blue)"]];
/* o valor ja vem arredondado do kpi.py -- inteiro quando a metrica e contagem,
   com casa decimal quando e taxa. O formatador segue o dado. */
const recVal=(v)=>v==null?"—":(Number.isInteger(v)?ni(v):nf(v,1));
const recCtx=(r)=>[r.champion,r.queue,r.minutes!=null?`${r.minutes} min`:null]
  .filter(Boolean).map(h).join(" · ");
const recTip=(r,cor)=>r.valor==null
  ? tip(h(r.titulo),[["Situação","ainda ninguém"]],h(r.legenda))
  : tip(h(r.titulo),[["Marca",`${recVal(r.valor)} ${h(r.unidade)}`,cor],
      ["Dono",h(r.player)],["Campeão",h(r.champion)],
      ["Partida",`${r.k}/${r.d}/${r.a} · ${r.minutes} min`],
      ["Fila",h(r.queue)],["Quando",ago(r.quando)]],h(r.legenda));

function reliquia(r){
  const vaga=r.valor==null;
  return `<article class="rel artbox${vaga?" vaga":""}"${recTip(r,"var(--gold)")}>
    ${vaga?"":`<img class="art" src="${artWide(r.championId,r.champion)}"${FBART}><div class="scrim"></div>`}
    <div class="tag">${h(r.titulo)}</div>
    <div class="big"><span data-count="${vaga?"":r.valor}" data-dec="${decDe(recVal(r.valor))}">${recVal(r.valor)}</span>
      <small>${h(r.unidade)}</small></div>
    ${vaga?`<div class="lg">Ainda ninguém. ${h(r.legenda)}</div>`
      :`<div class="who"><img src="${iconImg(r.icon)}"${FB}>
        <div style="min-width:0"><div class="n">${h(short(r.player))}</div>
        <div class="c">${recCtx(r)}</div></div></div>
      <div class="lg">${h(r.legenda)}</div>`}
  </article>`;
}

function cartaoRec(r,cor){
  const vaga=r.valor==null;
  /* o cartao com dono abre o dossie do campeao da jogada: a mesma porta que o
     hall e a tabela ja usam, pelo mesmo delegado de clique */
  const dc=vaga?"":` data-champ="${r.championId}" tabindex="0" role="button"`;
  return `<article class="rc${vaga?" vazio":""}" style="--tone:${cor}"${dc}${recTip(r,cor)}>
    <div class="tt">${h(r.titulo)}</div>
    <div class="vl"><b data-count="${vaga?"":r.valor}" data-dec="${decDe(recVal(r.valor))}">${recVal(r.valor)}</b>
      <span>${h(r.unidade)}</span></div>
    ${vaga?`<div class="pl2"><div class="n">ainda ninguém</div></div>`
      :`<div class="pl2"><img src="${iconImg(r.icon)}"${FB}>
        <div style="min-width:0"><div class="n">${h(short(r.player))}</div>
        <div class="c">${recCtx(r)}</div></div></div>`}
  </article>`;
}

function recordes(g){
  const l=g.records||[];
  if(!l.length) return "";
  const REL=reliquiasDe(g);
  const rel=REL.map(k=>l.find(r=>r.key===k)).filter(Boolean);
  const resto=l.filter(r=>REL.indexOf(r.key)<0);
  const abas=RGRUPO.map(([k,rot,cor])=>[k,rot,cor,resto.filter(r=>r.grupo===k)])
    .filter(a=>a[3].length);
  if(!rel.length&&!abas.length) return "";
  const ativo=abas.length?abas[0][0]:"";
  const feitos=l.filter(r=>r.valor!=null).length;
  return `<section class="hall" data-sec="recordes">
    <div class="hall-head">
      <span class="eyebrow">União dos Afundados · ${h(g.label||"")}</span>
      <h2 class="poster-title engraved">A Sala dos Recordes</h2>
      <hr class="rule">
      <p class="poster-note">${feitos===l.length
        ? `todas as ${ni(l.length)} marcas desta fila já têm dono — agora é só tentar quebrá-las`
        : `${ni(feitos)} das ${ni(l.length)} marcas têm dono nesta fila — as outras continuam
           penduradas na parede esperando alguém`}</p>
    </div>
    ${rel.length?`<div class="relics">${rel.map(reliquia).join("")}</div>`:""}
    ${abas.length?`<div class="rtabs">${abas.map(a=>
      `<button class="rtab" type="button" data-rec="${a[0]}" style="--tone:${a[2]}"
        aria-pressed="${a[0]===ativo}">${h(a[1])}<b>${a[3].length}</b></button>`).join("")}</div>
    ${abas.map(a=>`<div class="rgrid" data-recg="${a[0]}"${a[0]===ativo?"":" hidden"}>
      ${a[3].map(r=>cartaoRec(r,a[2])).join("")}</div>`).join("")}`:""}
  </section>`;
}

/* ===================================================== OS HALTERES
   Substitui a tabela de 10 colunas de "Junto ou sozinho?". Ponto de prata =
   sozinho, ponto de ouro = com a UDA no time, e o osso entre os dois E o delta:
   comprimento diz o tamanho, cor diz se melhorou. O eixo e COMPARTILHADO por
   todo mundo, entao da para ler o proprio jogador E comparar jogadores entre
   si -- coisa que a tabela nunca deixou fazer.
   dir=-1 nas mortes: menos e melhor, e a cor do osso tem de saber disso. */
const HL_MET=[
  {k:"winrate",   t:"Vitórias",   u:"%", d:1, dir: 1, s:"pp"},
  {k:"kda",       t:"KDA",        u:"",  d:2, dir: 1, s:""},
  {k:"kp",        t:"Particip.",  u:"%", d:1, dir: 1, s:"pp"},
  {k:"deaths",    t:"Mortes",     u:"",  d:2, dir:-1, s:""},
  {k:"dmg_min",   t:"Dano/min",   u:"",  d:0, dir: 1, s:""},
  {k:"vision_min",t:"Visão/min",  u:"",  d:2, dir: 1, s:""},
];
let HL_M="winrate", HL_D=[];
const hlv=(m,v)=>(m.d>0?nf(v,m.d):ni(v))+m.u;

function halteresCorpo(list){
  const ok=list.filter(p=>p.comparable),falta=list.filter(p=>!p.comparable);
  const m=HL_MET.find(x=>x.k===HL_M)||HL_MET[0];
  const fichas=`<div class="hl-ord" role="group" aria-label="Escolher a métrica">
    <span class="tsl">métrica</span>
    ${HL_MET.map(x=>`<button type="button" class="tsc" data-hm="${x.k}"
      aria-pressed="${x.k===HL_M}">${h(x.t)}</button>`).join("")}</div>`;
  if(!ok.length) return `<div class="hl">${fichas}${noData("AMOSTRA PEQUENA",
    "Cada jogador precisa de partidas suficientes nos dois cenários: com a UDA no time e sem ninguém da UDA.")}</div>`;
  /* a regua e a mesma para os nove: min e max de TODOS os pontos dos dois lados.
     O respiro de 8% impede o extremo de encostar na borda do trilho. */
  const vs=[];ok.forEach(p=>{vs.push(p.together[m.k],p.alone[m.k]);});
  const mn=Math.min(...vs),mx=Math.max(...vs);
  const folga=(mx-mn)*.08||Math.max(.5,Math.abs(mx)*.05)||1;
  const lo=mn-folga,hi=mx+folga,amp=(hi-lo)||1;
  const px=v=>((v-lo)/amp*100).toFixed(2)+"%";
  const linhas=[...ok].sort((a,b)=>
    ((b.together[m.k]-b.alone[m.k])*m.dir)-((a.together[m.k]-a.alone[m.k])*m.dir));
  const marcas=[0,1,2,3,4].map(i=>lo+amp*i/4);
  return `<div class="hl">${fichas}
    <div class="hl-lg"><span><i class="s"></i>sozinho</span>
      <span><i class="j"></i>com a <em>UDA</em> no time</span>
      <span>ordenado de quem mais melhora para quem mais piora</span></div>
    <div class="hl-r hl-hd"><span class="k">jogador</span>
      <span class="k c">${h(m.t)}</span><span class="k r">Δ</span></div>
    <div class="hl-rows">${linhas.map((p,i)=>{
      const j=p.together[m.k],s=p.alone[m.k],dl=(j-s),bom=dl*m.dir;
      const a=Math.min(j,s),b=Math.max(j,s);
      const t=tip(h(p.gameName),[
        [m.t+" com a UDA",hlv(m,j),"var(--gold)"],
        [m.t+" sozinho",hlv(m,s)],
        ["Diferença",sg(dl,m.d)+m.s,bom>0?"var(--teal)":bom<0?"var(--red)":null],
        ["Partidas",`${p.together.games} juntos · ${p.alone.games} sozinho`],
      ],"o eixo é o mesmo para todo mundo — dá para comparar as linhas entre si");
      return `<div class="hl-r" style="--i:${i}"${t}>
        <div class="hl-w"><img src="${iconImg(p.icon)}"${FB}>
          <div><div class="a">${h(short(p.gameName))}</div>
          <div class="b">${p.together.games} juntos · ${p.alone.games} sozinho</div></div></div>
        <div class="hl-t"><div class="hl-in">
          <div class="rail"></div>
          ${marcas.map(v=>`<div class="ref" style="left:${px(v)}"></div>`).join("")}
          <div class="bone ${bom>0?"up":bom<0?"dn":""}"
            style="left:${px(a)};width:calc(${px(b)} - ${px(a)})"></div>
          <div class="dot s" style="left:${px(s)}"></div>
          <div class="dot j" style="left:${px(j)}"></div>
          <span class="vl s" style="left:${px(s)}">${hlv(m,s)}</span>
          <span class="vl j" style="left:${px(j)}">${hlv(m,j)}</span>
        </div></div>
        <span class="pill ${bom>0?"t":bom<0?"r":"n"}">${sg(dl,m.d)}${m.s}</span>
      </div>`;}).join("")}</div>
    <div class="hl-r hl-ft"><span></span>
      <div class="hl-ax"><div class="hl-in">${marcas.map(v=>
        `<span class="tk" style="left:${px(v)}">${hlv(m,v)}</span>`).join("")}</div></div>
      <span></span></div>
    <p class="hl-note">o eixo não começa no zero: com todo mundo entre
      ${hlv(m,mn)} e ${hlv(m,mx)}, um eixo cheio esmagaria os nove halteres num
      canto do trilho. As cinco marcas estão escritas para que o corte fique declarado.</p>
    ${falta.length?`<p class="hl-falta">Sem amostra dos dois lados ainda:
      ${falta.map(p=>h(p.gameName)).join(" · ")}</p>`:""}</div>`;
}

function halteres(list){
  HL_D=list||[];
  return `<div class="card flush"><div style="padding:22px 24px 0">${chead(I.trend,"Junto ou sozinho?",
    "cada haltere é um jogador: prata é sozinho, ouro é com a UDA no time — o osso é a diferença")}</div>
    ${halteresCorpo(HL_D)}</div>`;
}

function ligarHalteres(){
  document.querySelectorAll(".hl-ord .tsc").forEach(b=>b.onclick=()=>{
    HL_M=b.dataset.hm;
    const alvo=document.querySelector(".hl"); if(!alvo) return;
    alvo.outerHTML=halteresCorpo(HL_D);
    ligarHalteres(); dobrar();
  });
}

/* ======================================================== A FITA
   Sequencia e contagem de partidas seguidas. Um tijolo, uma partida; o zero de
   metal no meio; derrota cresce para a esquerda, vitoria para a direita. A
   regua (--n) e a MESMA para os treze -- e o que permite comparar duas fitas.
   O segundo dado (a sequencia de agora) nao ganha faixa nova: sao os mesmos
   tijolos, acesos a partir do centro. */
const FITA_ORD=[
  ["maiorv","Maior de vitórias",(a,b)=>b.maiorVitorias-a.maiorVitorias||a.maiorDerrotas-b.maiorDerrotas],
  ["maiord","Maior de derrotas",(a,b)=>b.maiorDerrotas-a.maiorDerrotas||a.maiorVitorias-b.maiorVitorias],
  ["atual","Sequência de agora",(a,b)=>b.atual-a.atual||b.maiorVitorias-a.maiorVitorias],
];
let FITA_K="maiorv", FITA_D=[];

function fitaCorpo(seqs){
  /* --n e o maior recorde DO GRUPO, nao o da linha: regua unica ou nada compara */
  const n=Math.max(1,...seqs.map(s=>Math.max(s.maiorVitorias||0,s.maiorDerrotas||0)));
  /* o filete de ouro so sai quando o recorde tem DONO. Empate a quatro nao e
     manchete: seriam quatro filetes dizendo "todo mundo empatou". */
  const pico=(f)=>{const v=seqs.map(f),m=Math.max(0,...v);
    return v.filter(x=>x===m).length===1?m:-1;};
  const recV=pico(s=>s.maiorVitorias||0);
  const recD=pico(s=>s.maiorDerrotas||0);
  /* pos 0 e o tijolo colado no zero: e de la que a sequencia de agora acende */
  const tij=(k,ac,lado)=>{let o="";
    for(let i=0;i<n;i++){const pos=lado==="v"?i:n-1-i;
      o+=`<i class="${pos<ac?"on liv":pos<k?"on":""}"></i>`;}
    return o;};
  const ord=(FITA_ORD.find(o=>o[0]===FITA_K)||FITA_ORD[0])[2];
  const linhas=[...seqs].sort(ord);
  return `<div class="fita" style="--n:${n}">
    <div class="fita-ord" role="group" aria-label="Ordenar as sequências">
      <span class="tsl">ordenar</span>
      ${FITA_ORD.map(([k,t])=>`<button type="button" class="tsc" data-fk="${k}"
        aria-pressed="${k===FITA_K}">${h(t)}</button>`).join("")}</div>
    <div class="fita-r fita-hd"><span class="k">jogador</span>
      <div class="fita-x"><span></span>
        <div class="ex"><i>derrotas seguidas</i><b>0</b><i>vitórias seguidas</i></div>
        <span></span></div>
      <span class="k r">agora</span></div>
    <div class="fita-b">${linhas.map((s,i)=>{
      const av=s.atual>0?s.atual:0, ad=s.atual<0?-s.atual:0;
      const t=tip(h(s.gameName),[
        ["Maior sequência de vitórias",`${s.maiorVitorias} seguidas`,"var(--teal)"],
        ["Maior sequência de derrotas",`${s.maiorDerrotas} seguidas`,"var(--red)"],
        ["Agora",s.atual>0?`${s.atual} vitória${s.atual>1?"s":""} seguida${s.atual>1?"s":""}`
          :s.atual<0?`${-s.atual} derrota${s.atual<-1?"s":""} seguida${s.atual<-1?"s":""}`:"acabou de virar"],
      ],"o tijolo vazado é o recorde; o tijolo aceso é a sequência de agora");
      return `<div class="fita-r" style="--i:${i}"${t}>
        <div class="fita-w"><img src="${iconImg(s.icon)}"${FB}>
          <div><div class="a">${h(short(s.gameName))}</div>
          <div class="b">${s.maiorVitorias}V · ${s.maiorDerrotas}D de recorde</div></div></div>
        <div class="fita-x">
          <span class="fita-n d${s.maiorDerrotas===recD&&recD>0?" rec":""}">${s.maiorDerrotas}</span>
          <div class="fita-t">
            <div class="fita-s d">${tij(s.maiorDerrotas,ad,"d")}</div>
            <div class="z"></div>
            <div class="fita-s v">${tij(s.maiorVitorias,av,"v")}</div>
          </div>
          <span class="fita-n v${s.maiorVitorias===recV&&recV>0?" rec":""}">${s.maiorVitorias}</span>
        </div>
        <span class="pill ${s.atual>0?"t":s.atual<0?"r":"n"}">${
          s.atual>0?`${s.atual}V seguidas`:s.atual<0?`${-s.atual}D seguidas`:"—"}</span>
      </div>`;}).join("")}</div>
    <p class="fita-lg">um tijolo é uma partida · o contorno é o recorde de cada um,
      o tijolo aceso é a sequência que está correndo agora · o filete dourado marca
      quem tem o recorde do grupo</p></div>`;
}

function fita(seqs){
  FITA_D=seqs||[];
  return `<div class="card flush"><div style="padding:22px 24px 0">${chead(I.bolt,"Sequências",
    "a maior sequência de cada um, e como está agora — a régua é a mesma para todos")}</div>
    ${fitaCorpo(FITA_D)}</div>`;
}

function ligarFita(){
  document.querySelectorAll(".fita-ord .tsc").forEach(b=>b.onclick=()=>{
    FITA_K=b.dataset.fk;
    const alvo=document.querySelector(".fita"); if(!alvo) return;
    alvo.outerHTML=fitaCorpo(FITA_D);
    ligarFita(); dobrar();
  });
}

function matriz(m){
  if(!m.order.length) return noData("SEM DUPLAS","Ninguém jogou junto o suficiente.");
  const cor=w=>w>=50?`background:rgba(10,200,185,${.1+(w-50)/50*.6})`:`background:rgba(229,72,77,${.1+(50-w)/50*.6})`;
  const cur=n=>short(n).slice(0,10);

  /* ---- o RANKING DAS DUPLAS: a mesma matriz respondendo a pergunta que
     realmente se faz a ela. 41 duplas nao viram 41 cartoes nem uma lista de
     2300px: viram as melhores, as piores, e um "ver o meio" para o resto. */
  const duplas=[];
  for(let i=0;i<m.order.length;i++)for(let j=i+1;j<m.order.length;j++){
    const a=m.order[i],b=m.order[j],c=m.cells[a+"|"+b]||m.cells[b+"|"+a];
    if(c) duplas.push({a,b,winrate:c.winrate,games:c.games,wins:c.wins,losses:c.losses});}
  duplas.sort((x,y)=>(y.winrate-x.winrate)||(y.games-x.games));
  const N=Math.min(6,Math.floor(duplas.length/2));
  const top=duplas.slice(0,N), fim=N?duplas.slice(-N):[], meio=duplas.slice(N,duplas.length-N);
  /* piso de amostra marcado com opacidade em vez de escondido: a grade
     disfarcava o 100%-em-3-jogos porque ninguem lia celula por celula; a lista
     ordenada expoe, entao ela precisa admitir o ruido em vez de fingir. */
  const piso=Math.max(m.minPair+2,5);
  const duo=d=>{const w=d.winrate,larg=(Math.min(50,Math.abs(w-50))/50*50).toFixed(1);
    return `<div class="lrow duo${d.games<piso?" thin":""}"${tip(
      `${h(short(m.names[d.a]))} + ${h(short(m.names[d.b]))}`,[
      ["Aproveitamento",nf(w,1)+"%",w>=50?"var(--teal)":"var(--red)"],
      ["Partidas juntos",ni(d.games)],["Resultado",`${d.wins}V ${d.losses}D`]],
      d.games<piso?"amostra pequena — leia com desconfiança":(w>=50?"essa dupla funciona":"essa dupla afunda junto"))}>
      <span class="ims"><img src="${iconImg(m.icons[d.a])}"${FB}><img src="${iconImg(m.icons[d.b])}"${FB}></span>
      <span class="nm">${h(short(m.names[d.a]))} <span style="color:var(--dim)">+</span> ${h(short(m.names[d.b]))}</span>
      <span class="bar"><i class="${w>=50?"up":"dn"}" style="width:${larg}%"></i></span>
      <span class="st">${d.games}j</span>
      <span class="pill ${w>=50?"t":"r"}">${nf(w,0)}%</span></div>`;};
  const lista=!N?"":`<div class="mxlist">
    <div class="mxhd">as ${N} que mais vencem juntas</div>${top.map(duo).join("")}
    ${meio.length?`<details class="mxmid"><summary>ver as ${meio.length} duplas do meio</summary>
      ${meio.map(duo).join("")}</details>`:""}
    <div class="mxhd bad">as ${N} que mais afundam juntas</div>${fim.map(duo).join("")}</div>`;

  /* a grade continua existindo, so deixa de ser o padrao no celular. `open` no
     markup e a rede: se o JS morrer, o desktop continua mostrando a matriz. */
  return `${lista}<details class="mxfull" open><summary>ver a grade completa</summary>
    <div class="tbox" style="padding:16px"><table class="mx"><thead><tr><th class="mx-corner"></th>
    ${m.order.map(p=>`<th class="mx-h"><img src="${iconImg(m.icons[p])}"${FB}><span>${h(cur(m.names[p]))}</span></th>`).join("")}</tr></thead><tbody>
    ${m.order.map(a=>`<tr><th class="mx-r"><img src="${iconImg(m.icons[a])}"${FB}><span>${h(cur(m.names[a]))}</span></th>
      ${m.order.map(b=>{if(a===b) return `<td class="mx-c mx-self">—</td>`;
        const c=m.cells[a+"|"+b];
        if(!c) return `<td class="mx-c"${tip(`${h(short(m.names[a]))} + ${h(short(m.names[b]))}`,
          ["Menos de "+m.minPair+" partidas juntos"])}></td>`;
        return `<td class="mx-c" style="${cor(c.winrate)}"${tip(
          `${h(short(m.names[a]))} + ${h(short(m.names[b]))}`,[
          ["Aproveitamento",nf(c.winrate,1)+"%",c.winrate>=50?"var(--teal)":"var(--red)"],
          ["Partidas juntos",ni(c.games)],
          ["Resultado",`${c.wins}V ${c.losses}D`],
        ],c.winrate>=50?"essa dupla funciona":"essa dupla afunda junto")}>
          <b>${nf(c.winrate,0)}%</b><i>${c.games}</i></td>`;}).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="legend"><span><i style="background:rgba(10,200,185,.65)"></i>vencem juntos</span>
    <span><i style="background:rgba(229,72,77,.65)"></i>afundam juntos</span>
    <span><i style="background:var(--card2)"></i>menos de ${m.minPair} partidas</span>
    <span>número pequeno = partidas juntos</span></div></details>`;
}

/* ==================================================== O DOSSIÊ DO CAMPEÃO */
const PAPEL={Fighter:"Lutador",Mage:"Mago",Assassin:"Assassino",Marksman:"Atirador",
  Support:"Suporte",Tank:"Tanque"};

/* O recorte da UDA para um campeao. E ELE que separa o dossie de uma wiki: ao
   lado da arte e das habilidades vem quem pilota e com que resultado. */
function udaChamp(id){
  const g=grupo(); if(!g) return null;
  const k=String(id);
  const ag=(g.champions||[]).find(c=>String(c.championId)===k)||null;
  const pilotos=(g.players||[]).map(p=>{
    const c=(p.champions||[]).find(x=>String(x.championId)===k);
    return c?{p,c}:null;}).filter(Boolean).sort((a,b)=>b.c.games-a.c.games);
  /* as unicas partidas NOMINAIS do payload sao os destaques de cada jogador e o
     feed recente: a melhor sai da maior KDA entre elas, nao de um ranking que o
     payload nao carrega */
  let melhor=null;
  const ver=(o)=>{const kd=o.kda!=null?o.kda:(o.k+o.a)/Math.max(1,o.d);
    if(!melhor||kd>melhor.kda) melhor=Object.assign({},o,{kda:kd});};
  (g.players||[]).forEach(p=>[p.bestGame,p.worstGame].forEach(w=>{
    if(w&&String(w.championId)===k) ver(Object.assign({},w,{player:p.gameName}));}));
  (g.recent||[]).forEach(m=>(m.players||[]).forEach(r=>{
    if(String(r.championId)===k) ver(Object.assign({},r,
      {player:r.gameName,queue:m.queue,minutes:m.minutes}));}));
  return {ag,pilotos,melhor};
}

            <div class="v ${cl(ag.winrate,50)}">${nf(ag.winrate,1)}<small>%</small></div></div>

/* O <dialog> nativo ja entrega Esc, foco preso e backdrop -- refazer isso a mao
   seria trocar tres comportamentos corretos por tres bugs. Um so no documento,
   preenchido na hora: o painel e redesenhado a cada troca de pagina. */
const DLG=document.createElement("dialog");
DLG.className="dossie"; DLG.setAttribute("aria-label","Dossiê do campeão");
document.body.appendChild(DLG);
DLG.addEventListener("click",e=>{ if(e.target===DLG) DLG.close(); });  /* clique no fundo */
function abrirDossie(id){
  if(!id) return;
  DLG.innerHTML=dossieHTML(id);
  DLG.scrollTop=0;
  if(DLG.showModal) DLG.showModal(); else DLG.setAttribute("open","");
}
/* delegado: nada precisa ser religado quando desenhar() troca o #app inteiro */
document.addEventListener("click",e=>{
  if(!e.target.closest) return;
  if(e.target.closest(".ds-x")){ DLG.close(); return; }
  const alvo=e.target.closest("[data-champ]");
  if(alvo) abrirDossie(alvo.getAttribute("data-champ"));
});
/* quem nao e <button> (linha de tabela, quadro do hall) precisa da tecla no braco */
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const alvo=e.target.closest&&e.target.closest("[data-champ]");
  if(alvo&&alvo.tagName!=="BUTTON"){ e.preventDefault(); abrirDossie(alvo.getAttribute("data-champ")); }
});

/* --------------------------------------------------------- O ARSENAL
   A página Campeões era uma tabela de 5 colunas num campo vazio. O arsenal põe a
   arte na frente; a tabela vira o apêndice detalhado, no fim da página. 12
   cartões fecham fila exata em 6, 4, 3 e 2 colunas -- nunca sobra órfão.
   O ícone é <img class="cc-ic"> DIRETO: o <span class="cc-ic"> anterior era
   display:inline, engolia os 52px de largura e fazia o width:100% do filho
   resolver contra o cartão inteiro -- 64x64 esticado até 351x202. */
function arsenal(g){
  const l=(g.champions||[]).slice(0,12);
  if(!l.length) return "";
  const pilotosDe=(id)=>(g.players||[]).map(p=>{
      const c=(p.champions||[]).find(x=>x.championId===id);
      return c?{icon:p.icon,nome:p.gameName,games:c.games}:null;})
    .filter(Boolean).sort((a,b)=>b.games-a.games);
  return `<section class="hall">
    <div class="hall-head">
      <span class="eyebrow">União dos Afundados · ${h(g.label||"")}</span>
      <h2 class="poster-title engraved">O Arsenal</h2>
      <hr class="rule">
      <p class="poster-note">os doze campeões mais jogados do grupo — clique em qualquer um para
        abrir o dossiê, com as habilidades e o recorte da UDA</p>
    </div>
    <div class="cgrid">${l.map((c,i)=>{
      const d=CDET[String(c.championId)], pl=pilotosDe(c.championId);
      /* PAPÉIS antes do título: num cartão de 186px "a Caçadora de Recompensas"
         reticencia e "Atirador · Mago" cabe inteiro -- e diz mais. O título fica
         de reserva para campeão sem tags no payload. */
      const papeis=((d&&d.tags)||[]).map(x=>PAPEL[x]||x).join(" · ");
      const t=tip(h(c.champion),[
        ["Partidas",ni(c.games)],
        ["Resultado",`${c.wins}V ${c.losses}D`],
        ["Aproveitamento",nf(c.winrate,1)+"%",c.winrate>=50?"var(--teal)":"var(--red)"],
        ["KDA médio",nf(c.kda,2)],
        ["Pilotos",`${c.pilots} do grupo`],
      ],"clique para abrir o dossiê");
      return `<article class="ccard" data-champ="${c.championId}" tabindex="0" role="button"
        aria-label="Abrir dossiê de ${h(c.champion)}"${t}>
        <div class="cc-win artbox">
          <img class="art" src="${artWide(c.championId,c.champion)}"${FBART}>
          <div class="scrim"></div><span class="cc-rk">${i+1}</span></div>
        <div class="cc-in">
          <div class="cc-hd">
            <img class="cc-ic" src="${champImg(c.championId,c.champion)}"${FB}>
            <div class="cc-id">
              <div class="cc-nm">${h(c.champion)}</div>
              <div class="cc-tt">${h(papeis||(d&&d.title)||"")}</div>
            </div>
          </div>
          <div class="cc-st">
            <b class="cc-wr ${cl(c.winrate,50)}">${nf(c.winrate,0)}%</b>
            <span class="cc-mt">${c.games} jogo${c.games>1?"s":""} · KDA ${nf(c.kda,2)}</span>
          </div>
          <div class="cc-tr"><i class="${c.winrate<50?"lo":""}"
            style="width:${Math.max(3,Math.min(100,c.winrate))}%"></i></div>
          ${pl.length?`<div class="cc-pl"><span class="ims">${pl.slice(0,3).map(x=>
            `<img src="${iconImg(x.icon)}"${FB}>`).join("")}</span>
            <span class="cc-pt">${c.pilots} piloto${c.pilots>1?"s":""} · ${h(short(pl[0].nome))} lidera</span></div>`:""}
        </div>
      </article>`;}).join("")}</div></section>`;
}

/* ==================================== PERSONALIZADAS (AS PARTIDAS DA CASA)
   Tudo desta seção só existe porque os DOIS times são da UDA. É por isso que ela
   não cabe em nenhum componente das outras páginas: lá tudo é lista de jogador,
   aqui tudo é matricial — jogador contra jogador.
   E é por isso também que várias métricas do resto do painel morrem aqui: o
   "aproveitamento do grupo" é ~50% por construção (alguém da UDA sempre ganha e
   alguém sempre perde), e visão e farm vêm do cliente do LoL, que no Abismo não
   mede nem uma coisa nem outra. Ver o cartão "o que esta fila não mede". */

/* ------------------------------------------------------------ A TABELA
   Placar histórico de todos contra todos. A linha ganha da coluna.
   A opacidade sai da FOLGA (|V−D|) e não do total de duelos: senão 9–5 e 90–50
   pintariam igual, e é a folga que diz quem manda. Empate é ouro, nunca meio
   verde e meio vermelho. */
function ihTabela(t){
  const js=t.jogadores||[];
  if(js.length<2) return noData("SEM CONFRONTOS","Ninguém se enfrentou ainda.");
  const ord=js.map(p=>p.chave), nome={}, icone={}, conv={};
  js.forEach(p=>{nome[p.chave]=p.nome;icone[p.chave]=p.icon;conv[p.chave]=p.convidado;});
  const cur=n=>short(n).slice(0,10);
  const cel=(a,b)=>t.celulas[a+"|"+b];
  const fundo=(c)=>{const f=c.v-c.d;
    if(!f) return "background:rgba(200,170,110,.26)";
    const k=(.12+Math.min(1,Math.abs(f)/5)*.62).toFixed(3);
    return f>0?`background:rgba(10,200,185,${k})`:`background:rgba(229,72,77,${k})`;};
  const balao=(a,b,c)=>tip(`${h(short(nome[a]))} × ${h(short(nome[b]))}`,[
      ["Placar",`${c.v} – ${c.d}`,c.v>c.d?"var(--teal)":c.v<c.d?"var(--red)":"var(--gold)"],
      ["Duelos",ni(c.jogos)],
      ["Aproveitamento",nf(c.v/c.jogos*100,0)+"%"],
    ],c.jogos<t.minDuel?`só ${c.jogos} duelo${c.jogos>1?"s":""} — amostra fina`
      :(c.v>c.d?`${short(nome[a])} leva a melhor`:c.v<c.d?`${short(nome[b])} leva a melhor`:"empate"));

  /* no celular a grade de 16x16 implode: a pergunta vira uma LISTA de rivalidades */
  const riv=[];
  for(let i=0;i<ord.length;i++)for(let j=i+1;j<ord.length;j++){
    const c=cel(ord[i],ord[j]); if(!c) continue;
    riv.push({a:ord[i],b:ord[j],v:c.v,d:c.d,jogos:c.jogos,folga:Math.abs(c.v-c.d)});}
  riv.sort((x,y)=>(y.folga-x.folga)||(y.jogos-x.jogos));
  const fortes=riv.filter(r=>r.jogos>=t.minDuel).slice(0,8);
  const linha=r=>{const dono=r.v>=r.d?r.a:r.b, alvo=r.v>=r.d?r.b:r.a;
    const larg=(Math.min(1,r.folga/Math.max(1,r.jogos))*100).toFixed(1);
    return `<div class="lrow duo"${balao(r.a,r.b,{v:r.v,d:r.d,jogos:r.jogos})}>
      <span class="ims"><img src="${iconImg(icone[dono])}"${FB}><img src="${iconImg(icone[alvo])}"${FB}></span>
      <span class="nm">${h(short(nome[dono]))} <span style="color:var(--dim)">sobre</span> ${h(short(nome[alvo]))}</span>
      <span class="bar"><i class="up" style="width:${larg}%"></i></span>
      <span class="st">${r.jogos} duelos</span>
      <span class="pill ${r.v===r.d?"g":"t"}">${Math.max(r.v,r.d)}–${Math.min(r.v,r.d)}</span></div>`;};

  const lista=!fortes.length?"":`<div class="mxlist">
    <div class="mxhd">as rivalidades mais desequilibradas</div>${fortes.map(linha).join("")}</div>`;

  return `${lista}<details class="mxfull" open><summary>ver a tabela completa</summary>
    <div class="tbox" style="padding:16px"><table class="mx rr"><thead><tr><th class="mx-corner"></th>
    ${ord.map(p=>`<th class="mx-h"><img src="${iconImg(icone[p])}"${FB}>
      <span>${h(cur(nome[p]))}${conv[p]?" ·":""}</span></th>`).join("")}</tr></thead><tbody>
    ${ord.map(a=>`<tr><th class="mx-r"><img src="${iconImg(icone[a])}"${FB}>
      <span>${h(cur(nome[a]))}${conv[a]?`<i class="gst" title="convidado">·</i>`:""}</span></th>
      ${ord.map(b=>{if(a===b) return `<td class="mx-c mx-self">—</td>`;
        const c=cel(a,b);
        if(!c) return `<td class="mx-c"${tip(`${h(short(nome[a]))} × ${h(short(nome[b]))}`,
          ["Nunca se enfrentaram"])}></td>`;
        return `<td class="mx-c${c.jogos<t.minDuel?" thin":""}" style="${fundo(c)}"${balao(a,b,c)}>
          <b>${c.v}–${c.d}</b><i>${c.jogos}j</i></td>`;}).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="legend"><span><i style="background:rgba(10,200,185,.65)"></i>a linha ganha da coluna</span>
    <span><i style="background:rgba(229,72,77,.65)"></i>a linha perde para a coluna</span>
    <span><i style="background:rgba(200,170,110,.35)"></i>empate</span>
    <span>célula apagada = menos de ${t.minDuel} duelos</span>
    <span>· = convidado, fora do players.json</span></div></details>`;
}

/* --------------------------------------------------------- ALGOZ E FREGUÊS
   Um cartão por pessoa: quem mais te derrota à esquerda, quem você mais derrota
   à direita. Piso de duelos contra a MESMA pessoa — quem não chega lá mantém o
   cartão tracejado dizendo que faltou amostra, em vez de sumir da página. */
function ihNemesis(l,piso){
  if(!l||!l.length) return noData("SEM DUELOS","Ninguém se enfrentou ainda.");
  /* "4 – 1" nao dizia de quem era cada numero. Vira frase: perdeu/ganhou Nx,
     e o placar cru fica embaixo, pequeno, so como conferencia. */
  const lado=(p,mau)=>!p?`<div class="nem-s vazio"><span>—</span></div>`
    :`<div class="nem-s ${mau?"mau":"bom"}"${tip(h(short(p.nome)),[
        ["Derrotas para ele",String(p.d),"var(--red)"],
        ["Vitórias sobre ele",String(p.v),"var(--teal)"],
        ["Duelos",ni(p.jogos)]],mau?"o algoz: quem mais te derrota":"o freguês: quem você mais derrota")}>
      <span class="rot">${mau?"apanha de":"bate em"}</span>
      <img src="${iconImg(p.icon)}"${FB}>
      <div class="nm">${h(short(p.nome))}</div>
      <div class="frase">${mau?`perdeu ${p.d}x`:`ganhou ${p.v}x`}</div>
      <div class="sc">${p.v}V ${p.d}D em ${p.jogos}</div></div>`;
  const cheios=l.filter(p=>p.algoz||p.fregues);
  const vazios=l.filter(p=>!p.algoz&&!p.fregues);
  const cartao=(p)=>{
    const seco=!p.algoz&&!p.fregues;
    return `<article class="nem${seco?" thin":""}">
      ${lado(p.algoz,true)}
      <div class="nem-c"${tip(h(p.nome),[
        ["Nas personalizadas",`${p.vitorias}V ${p.derrotas}D`],
        ["Aproveitamento",nf(p.winrate,1)+"%",p.winrate>=50?"var(--teal)":"var(--red)"],
        ["Partidas",ni(p.jogos)],
      ],p.convidado?"convidado — não está no players.json":"")}>
        <span class="eu">o jogador</span>
        <img src="${iconImg(p.icon)}"${FB}>
        <div class="nm">${h(short(p.nome))}${p.convidado?`<i class="gst">·</i>`:""}</div>
        <div class="wl"><b class="${p.winrate>=50?"t":"r"}">${p.vitorias}V</b> ${p.derrotas}D</div></div>
      ${lado(p.fregues,false)}
      ${seco?`<div class="nem-f">nenhum adversário com ${piso}+ duelos ainda</div>`:""}
    </article>`;};
  /* 7 dos 16 cartoes vinham sem algoz nem fregues e ocupavam metade da secao
     dizendo "faltou amostra". Ficam atras de um botao. */
  return `<div class="nems">${cheios.map(cartao).join("")}</div>
    ${vazios.length?`<div class="nem-vazios">
      <button class="nem-toggle" data-nemv>ver ${vazios.length} sem duelo suficiente</button>
      <div class="nems" data-nemlista hidden style="margin-top:12px">${vazios.map(cartao).join("")}</div>
    </div>`:""}`;
}

/* ----------------------------------------------------- A DUPLA E O DIVÓRCIO
   A métrica que só a inhouse permite. À esquerda, o que a dupla faz no MESMO
   time. À direita, o placar de quando o sorteio SEPARA os dois. É o que separa
   sinergia de verdade de "o forte carregava o fraco": se a dupla vence junta e
   um domina o outro quando se enfrentam, nunca houve sinergia. */
function ihDivorcio(l,piso){
  if(!l||!l.length) return noData("SEM DUPLAS",
    `Ninguém caiu no mesmo time ${piso}+ vezes ainda.`);
  return `<div class="dvs">${l.map((d,i)=>{
    const j=d.juntos,s=d.separados,tot=Math.max(1,s.jogos);
    const ea=(s.aV/tot*50).toFixed(1), eb=(s.bV/tot*50).toFixed(1);
    const veredito=!s.jogos?"o sorteio nunca separou os dois"
      :(Math.abs(s.aV-s.bV)>=2
        ?`quando se enfrentam, ${short(s.aV>s.bV?d.a.nome:d.b.nome)} manda — a "sinergia" era carregamento`
        :"juntos ou separados, ficam no empate");
    return `<div class="dvr" style="--i:${i}">
      <div class="dv-j"${tip("No mesmo time",[
        ["Resultado",`${j.v}V ${j.d}D`],["Partidas juntos",ni(j.jogos)],
        ["Aproveitamento",nf(j.winrate,1)+"%",j.winrate>=50?"var(--teal)":"var(--red)"]],
        "os dois do mesmo lado do sorteio")}>
        <span class="pill ${j.winrate>=50?"t":"r"}">${nf(j.winrate,0)}%</span>
        <span class="s">${j.v}V ${j.d}D em ${j.jogos}</span></div>
      <div class="dv-n">
        <span class="ims"><img src="${iconImg(d.a.icon)}"${FB}><img src="${iconImg(d.b.icon)}"${FB}></span>
        <span class="nm">${h(short(d.a.nome))} <span style="color:var(--dim)">+</span> ${h(short(d.b.nome))}</span>
        <em>${h(veredito)}</em></div>
      <div class="dv-s"${tip("Quando o sorteio separa",[
        [h(short(d.a.nome)),String(s.aV),"var(--teal)"],
        [h(short(d.b.nome)),String(s.bV),"var(--gold)"],
        ["Duelos diretos",ni(s.jogos)]],
        "a barra cresce do meio para quem venceu mais")}>
        <span class="lb">${s.aV}</span>
        <span class="tr"><i class="a" style="width:${ea}%"></i><i class="b" style="width:${eb}%"></i></span>
        <span class="rb">${s.bV}</span></div>
    </div>`;}).join("")}</div>`;
}

/* -------------------------------------------------------------- A BALANÇA
   Uma régua por partida, zero no centro. O comprimento é a diferença de ouro
   entre os times; a barra cresce para a DIREITA quando quem venceu também tinha
   mais ouro, e para a ESQUERDA quando não tinha — que é o caso interessante.
   Substitui o medidor de "aproveitamento do grupo", que aqui é 50% por
   construção e não mede nada. */
function ihBalanca(b){
  const l=b.partidas||[];
  if(!l.length) return noData("SEM PARTIDAS","Nada para pesar nesta fila.");
  const ESC=20;   /* fundo de escala em % de diferença de ouro */
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const quando=(ms)=>{const d=new Date(ms);
    return `${d.getDate()} ${MES[d.getMonth()]}`;};
  return `<div class="bal">
    <div class="bal-lg"><span><i class="fx"></i>faixa dos ${b.faixa}% — jogo decidido no fio</span>
      <span><i class="dr"></i>quem venceu tinha mais ouro</span>
      <span><i class="es"></i>quem venceu tinha MENOS ouro</span></div>
    <div class="bal-rows">${l.map((p,i)=>{
      const larg=(Math.min(Math.abs(p.diff),ESC)/ESC*50).toFixed(2);
      const pos=p.diff>=0;
      return `<div class="bal-r" style="--i:${Math.min(i,12)}"${tip(h(p.modo),[
          ["Quando",quando(p.quando)],["Duração",`${p.minutos} min`],
          ["Diferença de ouro",nf(Math.abs(p.diff),1)+"%",
            p.apertada?"var(--gold)":pos?"var(--teal)":"var(--red)"],
          ["Abates",`${p.abates[0]} do vencedor · ${p.abates[1]} do perdedor`],
          ["Venceram",p.vencedores.map(short).join(", ")],
          ["Perderam",p.perdedores.map(short).join(", ")],
        ],p.virada?"virada: quem venceu terminou atrás no placar de abates"
          :p.apertada?"decidida no fio":"vitória confortável")}>
        <span class="bal-d">${quando(p.quando)}<em>${p.minutos}′</em></span>
        <span class="bal-t">
          <i class="faixa" style="width:${(b.faixa/ESC*100).toFixed(1)}%"></i>
          <i class="zero"></i>
          <i class="fill ${pos?"dr":"es"}" style="${pos?"left:50%":"right:50%"};width:${larg}%"></i>
        </span>
        <span class="bal-v ${p.apertada?"g":pos?"t":"r"}">${sg(p.diff,1)}%</span>
        ${p.virada?`<span class="bal-s">virada</span>`:`<span class="bal-s off"></span>`}
      </div>`;}).join("")}</div>
    <p class="bal-note">Mediana da diferença: <b>${nf(b.mediana,1)}%</b>.
      <b>${b.apertadas}</b> de ${l.length} partidas ficaram dentro dos ${b.faixa}%, e em
      <b>${b.placarMente}</b> delas quem venceu terminou atrás em abates, em dano ou em ouro.
      O sorteio faz times parelhos, e quem mata mais perde com frequência —
      é o fato mais contraintuitivo do conjunto.</p></div>`;
}

/* -------------------------------------------------------------- O ESPELHO
   Inhouse contra ARAM PÚBLICA (fila 450), o único controle justo que existe:
   mesmo mapa, mesmo modo, mesma duração. Comparar com a Fenda seria comparar
   CS/min de duas coisas diferentes. O desenho é o dos halteres da página
   Em equipe: ponto prata = ARAM pública, ponto ouro = personalizada, o osso
   entre eles É a diferença. */
let ESP_M="kda", ESP_D=null;
const espv=(m,v)=>(m.d>0?nf(v,m.d):ni(v))+m.u;

function ihEspelhoCorpo(e){
  const mets=e.metricas||[], ok=e.jogadores||[];
  const m=mets.find(x=>x.k===ESP_M)||mets[0];
  const fichas=`<div class="hl-ord esp-ord" role="group" aria-label="Escolher a métrica">
    <span class="tsl">métrica</span>
    ${mets.map(x=>`<button type="button" class="tsc" data-em="${x.k}"
      aria-pressed="${x.k===ESP_M}">${h(x.t)}</button>`).join("")}</div>`;
  if(!ok.length||!m) return `<div class="hl esp">${fichas}${noData("AMOSTRA PEQUENA",
    `É preciso ter ${e.minBase}+ ARAM pública e ${e.minIh}+ personalizada para a comparação valer.`)}</div>`;
  const vs=[];ok.forEach(p=>{vs.push(p.inhouse[m.k],p.base[m.k]);});
  const mn=Math.min(...vs),mx=Math.max(...vs);
  const folga=(mx-mn)*.08||Math.max(.5,Math.abs(mx)*.05)||1;
  const lo=mn-folga,hi=mx+folga,amp=(hi-lo)||1;
  const px=v=>((v-lo)/amp*100).toFixed(2)+"%";
  const linhas=[...ok].sort((a,b)=>
    ((b.inhouse[m.k]-b.base[m.k])*m.dir)-((a.inhouse[m.k]-a.base[m.k])*m.dir));
  const marcas=[0,1,2,3,4].map(i=>lo+amp*i/4);
  const sobe=linhas.filter(p=>(p.inhouse[m.k]-p.base[m.k])*m.dir>0).length;
  return `<div class="hl esp">${fichas}
    <div class="hl-lg"><span><i class="s"></i>ARAM pública</span>
      <span><i class="j"></i>personalizada</span>
      <span>ordenado de quem mais melhora para quem mais piora</span></div>
    <div class="hl-r hl-hd"><span class="k">jogador</span>
      <span class="k c">${h(m.t)}</span><span class="k r">Δ</span></div>
    <div class="hl-rows">${linhas.map((p,i)=>{
      const j=p.inhouse[m.k],s=p.base[m.k],dl=(j-s),bom=dl*m.dir;
      const a=Math.min(j,s),z=Math.max(j,s);
      const t=tip(h(p.nome),[
        [m.t+" na personalizada",espv(m,j),"var(--gold)"],
        [m.t+" na ARAM pública",espv(m,s)],
        ["Diferença",sg(dl,m.d)+m.u,bom>0?"var(--teal)":bom<0?"var(--red)":null],
        ["Partidas",`${p.inhouse.games} em casa · ${p.base.games} públicas`],
      ],"o eixo é o mesmo para todo mundo — dá para comparar as linhas entre si");
      return `<div class="hl-r" style="--i:${i}"${t}>
        <div class="hl-w"><img src="${iconImg(p.icon)}"${FB}>
          <div><div class="a">${h(short(p.nome))}</div>
          <div class="b">${p.inhouse.games} em casa · ${p.base.games} públicas</div></div></div>
        <div class="hl-t"><div class="hl-in">
          <div class="rail"></div>
          ${marcas.map(v=>`<div class="ref" style="left:${px(v)}"></div>`).join("")}
          <div class="bone ${bom>0?"up":bom<0?"dn":""}"
            style="left:${px(a)};width:calc(${px(z)} - ${px(a)})"></div>
          <div class="dot s" style="left:${px(s)}"></div>
          <div class="dot j" style="left:${px(j)}"></div>
          <span class="vl s" style="left:${px(s)}">${espv(m,s)}</span>
          <span class="vl j" style="left:${px(j)}">${espv(m,j)}</span>
        </div></div>
        <span class="pill ${bom>0?"t":bom<0?"r":"n"}">${sg(dl,m.d)}${m.u}</span>
      </div>`;}).join("")}</div>
    <div class="hl-r hl-ft"><span></span>
      <div class="hl-ax"><div class="hl-in">${marcas.map(v=>
        `<span class="tk" style="left:${px(v)}">${espv(m,v)}</span>`).join("")}</div></div>
      <span></span></div>
    <p class="hl-note">${sobe} de ${linhas.length} melhoram nesta métrica quando jogam entre si.
      O eixo não começa no zero: com todo mundo entre ${espv(m,mn)} e ${espv(m,mx)}, um eixo
      cheio esmagaria os halteres num canto do trilho. A base é <b>toda a ARAM pública do
      banco</b>, e não só a janela analisada — dentro de 90 dias só uma pessoa do grupo chega
      a ${e.minBase} ARAM, e o Espelho inteiro sumiria para manter uma coerência que aqui não
      significa nada.</p></div>`;
}

function ihEspelho(e){
  ESP_D=e;
  return `<div class="card flush"><div style="padding:22px 24px 0">${chead(I.eye,"O espelho",
    "como cada um joga contra o servidor, e como joga contra os amigos — mesmo mapa, mesmo modo")}</div>
    ${ihEspelhoCorpo(e)}</div>`;
}

function ligarInhouseExtra(){
  const bv=document.querySelector("[data-nemv]");
  if(bv) bv.onclick=()=>{
    const lista=document.querySelector("[data-nemlista]");
    if(!lista) return;
    lista.hidden=!lista.hidden;
    bv.textContent=lista.hidden
      ? `ver ${lista.children.length} sem duelo suficiente`
      : "esconder quem não tem duelo suficiente";
  };
  const bf=document.querySelector("[data-mfeed]");
  if(bf) bf.onclick=()=>{
    const dobradas=document.querySelectorAll(".mfeed .mc[data-dobrada]");
    const abrindo=dobradas.length>0;
    if(abrindo){dobradas.forEach(e=>e.removeAttribute("data-dobrada"));
      bf.textContent="mostrar só as 4 mais recentes";}
    else{document.querySelectorAll(".mfeed .mc").forEach((e,i)=>{
        if(i>=4) e.setAttribute("data-dobrada","");});
      bf.textContent=`ver as outras ${document.querySelectorAll(".mfeed .mc").length-4} partidas`;}
  };
}

function ligarInhouse(){
  document.querySelectorAll("[data-ih-go]").forEach(b=>b.onclick=()=>irPara("inhouse",fila));
  document.querySelectorAll(".esp-ord .tsc").forEach(b=>b.onclick=()=>{
    ESP_M=b.dataset.em;
    const alvo=document.querySelector(".hl.esp"); if(!alvo||!ESP_D) return;
    alvo.outerHTML=ihEspelhoCorpo(ESP_D);
    ligarInhouse(); dobrar();
  });
}

/* -------------------------------------------------------------- A CHAMADA
   Não dá para saber ORDEM DE ESCOLHA: é ARAM, o campeão é sorteado, e o
   participantId do cliente é slot de lobby, não pick order (duas partidas
   seguidas trazem o mesmo elenco na mesma ordem exata). A substituição honesta
   é a presença: quem apareceu em cada noite, e quem nunca foi chamado. */
function ihChamada(c){
  const n=(c.noites||[]).length;
  if(!n) return noData("SEM NOITES","Nenhuma personalizada registrada.");
  return `<div class="cham" style="--n:${n}">
    <div class="ch-hd"><span class="ch-w">quem</span>
      ${c.noites.map(x=>`<span class="ch-n"${tip("Noite de "+h(x.rotulo),
        [["Partidas",ni(x.partidas)]])}>${h(x.rotulo)}</span>`).join("")}
      <span class="ch-t">tot</span></div>
    ${c.pessoas.map(p=>`<div class="ch-r">
      <span class="ch-w"><img src="${iconImg(p.icon)}"${FB}>
        <b>${h(short(p.nome))}</b>${p.convidado?`<i class="gst">·</i>`:""}</span>
      ${p.porNoite.map((q,i)=>`<span class="ch-c ${q?"on":"off"}"${tip(
        h(short(p.nome)),[["Noite de "+h(c.noites[i].rotulo),
          q?`${q} partida${q>1?"s":""}`:"não jogou"]])}>${q||""}</span>`).join("")}
      <span class="ch-t">${p.total}</span></div>`).join("")}
    ${c.nunca.length?`<div class="ch-never">
      <span class="lbl">nunca chamados</span>
      ${c.nunca.map(p=>`<span class="ru"><img src="${iconImg(p.icon)}"${FB}>${h(short(p.nome))}</span>`).join("")}
    </div>`:""}
    <div class="legend"><span><i class="chon"></i>jogou (o número são as partidas)</span>
      <span><i class="choff"></i>a noite existiu sem essa pessoa</span>
      <span>· = convidado</span></div></div>`;
}

/* -------------------------------------------------- AS PLACAS DE DUELO
   A .mc do feed empilha os da UDA numa coluna só porque numa fila normal eles
   estão todos do MESMO lado. Aqui isso viraria uma lista de dez nomes com V e D
   alternados. A placa parte no eixo: um time de cada lado, com o placar de
   abates de cada um. */
function ihDuelos(l){
  if(!l||!l.length) return noData("SEM PARTIDAS","Nada recente nesta fila.");
  const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  const quando=(ms)=>{const d=new Date(ms), dd=Math.floor((Date.now()-ms)/86400000);
    const hh=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    return dd<=0?`hoje ${hh}`:dd===1?`ontem ${hh}`:dd<7?`há ${dd} dias`
      :`${d.getDate()} ${MES[d.getMonth()]}`;};
  const estrela=(ps)=>ps.reduce((a,b)=>((b.k-b.d)>(a.k-a.d)?b:a),ps[0]);
  return `<div class="mfeed">${l.map((m,i)=>{
    const todos=m.times.reduce((s,t)=>s.concat(t.jogadores),[]);
    const est=estrela(todos);
    const dmax=Math.max(1,...todos.map(p=>Number(p.dmg)||0));
    const t=tip(h(m.modo),[
      ["Quando",quando(m.quando)],["Duração",`${m.minutos} min`],
      ["Placar",m.times.map(x=>x.abates).join(" – ")],
      ["Em campo",`${todos.length} jogadores`],
    ],`arte de ${h(est.champion)} — quem mais rendeu na partida`);
    const ficha=(p,venceu)=>`<div class="mc-p ${venceu?"w":"l"}${p===est?" mvp":""}"
      style="--dw:${((p.dmg||0)/dmax*100).toFixed(1)}%"${p.championId
        ?` data-champ="${p.championId}" tabindex="0" role="button"`:""}${tip(
      `${h(p.nome)} · ${h(p.champion)}`,[
        ["Resultado",venceu?"Vitória":"Derrota",venceu?"var(--teal)":"var(--red)"],
        ["KDA",`${p.k} / ${p.d} / ${p.a}`],
        ["Dano em campeões",ni(p.dmg)],
        p.convidado?["Conta","convidado, fora do players.json"]:null,
      ].filter(Boolean),`${h(m.modo)} · ${m.minutos} min`)}>
      <img src="${champImg(p.championId,p.champion)}"${FB}>
      <div class="mc-n"><b>${h(short(p.nome))}${p.convidado?`<i class="gst">·</i>`:""}</b>
        <em>${h(p.champion)}</em></div>
      <div class="mc-k">${p.k}<i>/</i><b class="d">${p.d}</b><i>/</i>${p.a}</div></div>`;
    return `<article class="mc x duo2" data-n="5" ${i>=4?'data-dobrada':""} style="--i:${Math.min(i,12)}">
      <div class="mc-rail"${t}><span>Duelo</span></div>
      <div class="mc-body artbox">
        <img class="art" src="${artLoad(est.championId,est.champion)}"${FBART}>
        <div class="scrim"></div>
        <div class="mc-top"${t}>
          <span class="mc-q">${h(m.modo)}</span>
          <span class="mc-when">${quando(m.quando)}</span>
          <span class="mc-dur">${m.minutos}′</span></div>
        <div class="duo2-g">${m.times.map(x=>`<div class="duo2-t ${x.venceu?"w":"l"}">
          <div class="duo2-h"><span class="wl ${x.venceu?"w":"l"}">${x.venceu?"Vitória":"Derrota"}</span>
            <b>${x.abates}</b> abates<em>${ni(x.ouro)} de ouro</em></div>
          <div class="mc-ps">${x.jogadores.map(p=>ficha(p,x.venceu)).join("")}</div>
        </div>`).join("")}</div>
      </div></article>`;}).join("")}</div>`;
}

/* --------------------------------------------------------- MODOS DA CASA */
const ihModos=(l)=>!l||!l.length?noData("SEM MODOS","Nada registrado."):
  `<div>${l.map(m=>`<div class="hbar"${tip(h(m.modo),[["Partidas",ni(m.partidas)],
      ["Fatia do total",nf(m.share,1)+"%"]],"aproveitamento não entra: numa partida da casa alguém da UDA sempre vence")}>
    <div class="hn">${h(m.modo)}</div>
    <div class="ht" style="--bc:var(--gold-2)"><i style="width:${m.share.toFixed(1)}%"></i></div>
    <div class="hq">${ni(m.partidas)}</div>
    <div class="hs">${nf(m.share,0)}%</div></div>`).join("")}</div>`;

/* ------------------------------------------------------ O QUE NÃO SE MEDE */
const ihAviso=(x)=>`<div class="card evnote">${crestImgTag("wmcard")}
  <div class="eyebrow">Origem do dado</div>
  <h3>O que esta fila não mede — e por quê</h3>
  <p>A Riot não expõe personalizada em lugar nenhum da API pública: <code>queue=0</code> devolve
  lista vazia e <code>type=custom</code> devolve erro dizendo que só aceita ranked, normal, tourney
  e tutorial. Estas ${ni(x.partidas)} partidas foram lidas do <b>cliente do LoL</b>, por um script
  local, e vieram no formato antigo da Riot — que não tem o bloco de <i>challenges</i> do
  Match&#8209;V5.</p>
  <p>Some daqui, portanto: <b>visão por minuto</b> (pontuação média 0,0 e sentinela zerada em 100%
  das linhas — no Abismo não se coloca sentinela), <b>CS por minuto</b> (existe, mas é minion
  passivo e não farm de rota), <b>as rotas</b> (mapa de uma rota só) e <b>15 dos 28 recordes</b>,
  que dependem de challenges. O aproveitamento do grupo também sai: numa partida da casa alguém da
  UDA sempre ganha e alguém sempre perde, então ele é ~50% por construção. No lugar dele está
  <b>a balança</b>.</p>
  <p>O que sobra é o que só existe aqui: o placar de todos contra todos, quem é algoz de quem, e o
  que a dupla faz quando o sorteio a separa.</p></div>`;
