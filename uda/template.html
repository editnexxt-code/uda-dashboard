/* ================================================= PLACAR DA PARTIDA
   O cartao do jogador diz "pior partida: 2/20/11". A pergunta seguinte e sempre
   "contra quem?" -- entao qualquer lugar que cite uma partida vira clicavel e
   abre o placar dos dez, nos moldes da tela de fim de jogo do cliente. */
const PLACARES=(DATA&&DATA.placares)||{};
const itemImg=(id)=>(PACK.item||{})[String(id)]||null;
const feiticoImg=(id)=>(PACK.spell||{})[String(id)]||null;
const runeImg=(id)=>(PACK.rune||{})[String(id)]||null;
const temPlacar=(id)=>!!(id&&PLACARES[id]);

const ROTA_LB={TOP:"Topo",JUNGLE:"Selva",MIDDLE:"Meio",BOTTOM:"Atirador",UTILITY:"Suporte"};

function linhaJogador(j,maxDano,maxLevado,win){
  const itens=(j.itens||[]).slice(0,7);
  const slots=itens.map((id,i)=>{
    const src=itemImg(id);
    const cls=i===6?"tr3":"";
    return src?`<img class="${cls}" src="${src}" alt=""${tip(h(j.champion),[["Item "+(i===6?"(trinket)":(i+1)),String(id)]])}>`
              :`<span class="${cls}"></span>`;
  }).join("");
  const sp=(j.feiticos||[]).map(s=>{const u=feiticoImg(s);return u?`<img src="${u}" alt="">`:`<span></span>`;}).join("");
  const ru=runeImg(j.keystone);
  return `<div class="prow ${win?"win":"lose"} ${j.uda?"eu":""}">
    <div class="pwho">
      <span class="pchamp"><img src="${champImg(j.championId,j.champion)}"${FB}><span class="plvl">${j.nivel||"-"}</span></span>
      <span class="pmini">${sp}</span>
      <span class="pmini">${ru?`<img src="${ru}" alt="">`:`<span></span>`}</span>
      <span class="pname"><span class="n ${j.uda?"uda":""}">${h(j.nome)}${j.selo?` <span class="pselo ${j.selo}">${j.selo}</span>`:""}</span>
        <span class="t">${j.tag?"#"+h(j.tag):""}${j.rota?" · "+h(ROTA_LB[j.rota]||j.rota):""}</span></span>
    </div>
    <div class="pkda"><div class="a1">${j.k} / ${j.d} / ${j.a}</div>
      <div class="a2">${nf(j.kda,2)} KDA</div></div>
    <div class="pdmg">
      <div class="lbl"><span>${ni(j.dano)}</span><span>${ni(j.danoSofrido)}</span></div>
      <div class="tr2"><i class="dado" style="width:${Math.round(j.dano/maxDano*100)}%"></i></div>
      <div class="tr2"><i class="levado" style="width:${Math.round(j.danoSofrido/maxLevado*100)}%"></i></div>
    </div>
    <div class="pnum">${j.kp}%<small>particip.</small></div>
    <div class="pnum">${ni(j.wards)}/${ni(j.wardsMortas)}<small>${ni(j.sentinelasControle)} ctrl</small></div>
    <div class="pnum">${ni(j.cs)}<small>${nf(j.csMin,1)}/min</small></div>
    <div class="pitems">${slots}</div>
  </div>`;
}

function blocoTime(time_,maxDano,maxLevado){
  const lado=time_.id===100?"Equipe Azul":"Equipe Vermelha";
  const obj=[["torres","torres"],["dragoes","dragões"],["baroes","barões"],
    ["arautos","arautos"],["inibidores","inibidores"]]
    .filter(([k])=>time_[k]!=null).map(([k,l])=>`<span><b>${ni(time_[k])}</b> ${l}</span>`).join("");
  return `<div class="tside ${time_.win?"win":"lose"}">
      <span class="res">${time_.win?"Vitória":"Derrota"}</span><span>${lado}</span>
      <span class="obj">${obj}</span></div>
    <div class="tbl-head"><span>Jogador</span><span>KDA</span><span>Dano dado / sofrido</span>
      <span>Particip.</span><span>Sentinelas</span><span>CS</span><span>Itens</span></div>
    ${time_.jogadores.map(j=>linhaJogador(j,maxDano,maxLevado,time_.win)).join("")}`;
}

function montarPlacar(id){
  const m=PLACARES[id];
  if(!m) return `<div class="mhead"><h3>Partida não encontrada</h3>
    <button class="mclose" data-fechar>&times;</button></div>
    <div style="padding:34px">${noData("SEM PLACAR","Esta partida não está no banco local.")}</div>`;
  const todos=m.times.flatMap(t2=>t2.jogadores);
  const maxDano=Math.max(1,...todos.map(j=>j.dano));
  const maxLevado=Math.max(1,...todos.map(j=>j.danoSofrido));
  const A=m.times[0]||{},B=m.times[1]||{};
  const ouroT=Math.max(1,(A.ouroTime||0)+(B.ouroTime||0));
  const abT=Math.max(1,(A.abatesTime||0)+(B.abatesTime||0));
  const quando=m.criacao?new Date(m.criacao).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}):"";
  const udas=todos.filter(j=>j.uda).map(j=>short(j.nome));
  return `<div class="mhead">
      <div><h3>${h(m.queue)} · ${Math.round((m.duracao||0)/60)} min</h3>
        <div class="sub">${h(quando)}${udas.length?` · UDA em campo: ${h(udas.join(", "))}`:""}</div></div>
      <button class="mclose" data-fechar aria-label="Fechar">&times;</button></div>
    ${blocoTime(A,maxDano,maxLevado)}
    <div class="mband">
      <div class="lado"><span><b>${ni(A.torres||0)}</b> torres</span><span><b>${ni(A.dragoes||0)}</b> dragões</span><span><b>${ni(A.baroes||0)}</b> barões</span></div>
      <div class="meio">
        <div class="l">Abates</div>
        <div class="barra"><i style="width:${(A.abatesTime||0)/abT*100}%;background:var(--teal)"></i><i style="width:${(B.abatesTime||0)/abT*100}%;background:var(--red)"></i></div>
        <div class="v"><span>${ni(A.abatesTime||0)}</span><span>${ni(B.abatesTime||0)}</span></div>
        <div class="l" style="margin-top:9px">Ouro</div>
        <div class="barra"><i style="width:${(A.ouroTime||0)/ouroT*100}%;background:var(--teal)"></i><i style="width:${(B.ouroTime||0)/ouroT*100}%;background:var(--red)"></i></div>
        <div class="v"><span>${ni(A.ouroTime||0)}</span><span>${ni(B.ouroTime||0)}</span></div>
      </div>
      <div class="lado dir"><span><b>${ni(B.torres||0)}</b> torres</span><span><b>${ni(B.dragoes||0)}</b> dragões</span><span><b>${ni(B.baroes||0)}</b> barões</span></div>
    </div>
    ${blocoTime(B,maxDano,maxLevado)}`;
}

function abrirPlacar(id){
  const box=$("#mbox"); if(!box) return;
  box.innerHTML=montarPlacar(id);
  $("#modal").setAttribute("open","");
  document.body.style.overflow="hidden";
  box.scrollTop=0;
}
function fecharPlacar(){
  $("#modal").removeAttribute("open");
  document.body.style.overflow="";
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-fechar]")) return fecharPlacar();
  const alvo=e.target.closest("[data-match]");
  if(alvo&&temPlacar(alvo.dataset.match)) abrirPlacar(alvo.dataset.match);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharPlacar();});
/* Atalho de marcacao: so vira clicavel a partida que existe no banco. */
const linkPartida=(id)=>temPlacar(id)?` data-match="${h(id)}" `:" ";

              tip:tip(h(r.gameName),[[t2.unidade,nf(r.valor,t2.casas)],

                ["Média do grupo",nf(t2.media,t2.casas)]],

            style="border-radius:6px"><span>Campeão do mês: <b>${h(m.campeao.champion)}</b>

/* Pódio reutilizável. `itens` = [{nome, icon, valor}], já em ordem 1º→3º.
   tone: "ouro" (glória), "verg" (vergonha), "teal" (neutro/positivo). */
function podio3(itens,tone,fmt){
  const l=(itens||[]).slice(0,3);
  if(!l.length) return "";
  const f=fmt||((v)=>nf(v,0));
  const ordem=[1,0,2];   // 2º, 1º, 3º — o `order` do CSS recoloca
  return `<div class="p3 ${tone||"ouro"}">${ordem.map(i=>{
    const it=l[i]; if(!it) return "";
    return `<div class="p3s s${i+1}"${it.tip||""}${it.ev||""}>
      <img class="av" src="${it.img||iconImg(it.icon)}"${FB}>
      <div class="nm">${h(short(it.nome))}</div>
      <div class="vl">${f(it.valor)}</div>
      <div class="deg">${i+1}º</div></div>`;}).join("")}</div>`;
}


/* ------------------------------------------------------------- PERÍODO
   Filtro no cliente: cada vexame ja carrega a data da partida, entao recortar
   por janela nao custa nem um byte a mais no payload. Vale so onde existe data
   por partida -- trofeus sao agregados e nao dao para recortar aqui. */
const PERIODOS=[["tudo","Tudo",0],["90","90 dias",90],["30","30 dias",30],["7","7 dias",7]];
let periodo="tudo";
const dentroDoPeriodo=(ms)=>{
  const dias=(PERIODOS.find(p=>p[0]===periodo)||[])[2]||0;
  return !dias||(Date.now()-ms)/86400000<=dias;
};
function barraPeriodo(total,mostrando){
  return `<div class="perbar"><span class="lab">Período</span>
    <div class="seg">${PERIODOS.map(([k,n])=>
      `<button data-per="${k}" aria-pressed="${k===periodo}">${n}</button>`).join("")}</div>
    <span class="cnt">${mostrando===total?`${ni(total)} partidas`
      :`${ni(mostrando)} de ${ni(total)} partidas na janela`}</span></div>`;
}
function ligarPeriodo(){
  document.querySelectorAll("[data-per]").forEach(b=>b.onclick=()=>{
    periodo=b.dataset.per; desenhar();
  });
}

/* ============================================================= VEXAMES */
function pVexames(){
  const v=vexamesDaFila();
  if(!v||!v.jogadores||!v.jogadores.length) return noData("NINGUÉM VACILOU NESTA FILA",
    "É preciso pelo menos 5 partidas de mais de 10 minutos por pessoa para o paredão abrir.");

  const bruto=v.jogadores.flatMap(j=>j.piores.length);
  const totalBruto=v.jogadores.reduce((s,j)=>s+j.piores.length,0);
  /* recorta por janela ANTES de montar a tela; jogador que ficou sem vexame
     na janela sai da lista em vez de virar acordeao vazio */
  const jogadores=v.jogadores.map(j=>({...j,
      piores:j.piores.filter(p=>dentroDoPeriodo(p.date))}))
    .filter(j=>j.piores.length)
    .sort((a,b)=>b.piores[0].nota-a.piores[0].nota);
  const totalJanela=jogadores.reduce((s,j)=>s+j.piores.length,0);
  if(!jogadores.length) return barraPeriodo(totalBruto,0)
    +noData("NADA NESTA JANELA","Ninguém vacilou o suficiente no período escolhido. Suspeito.");

  /* as tres piores partidas do grupo inteiro, independente de quem foi */
  const todas=jogadores.flatMap(j=>j.piores.map(p=>({...p,dono:j})));
  todas.sort((a,b)=>b.nota-a.nota);
  const topo=todas.slice(0,3);

  const chips=(p)=>p.motivos.slice(0,4).map((m,i)=>
    `<span class="vx-chip ${m.peso>=3?"forte":""}"${tip("Por quê",[m.texto])}>${h(m.texto.split(".")[0])}</span>`).join("");

  return `<section>${barraPeriodo(totalBruto,totalJanela)}</section>
    <section>
      <div class="sh-plain">${chead(I.skull,"O paredão",
        "as três piores partidas já registradas no grupo — sem defesa possível","red")}</div>
      ${topo.length>1?`<div style="max-width:470px;margin:0 auto 18px">${podio3(
        topo.map(p=>({nome:p.dono.gameName,icon:p.dono.icon,valor:p.nota,
          tip:tip(h(p.dono.gameName),[["Nota de vergonha",nf(p.nota,0)],
            ["A partida",`${p.k}/${p.d}/${p.a} de ${p.champion}`],["Veredito",p.veredito]])})),
        "verg",(v)=>nf(v,0))}</div>`:""}
      <div class="vx-topo">${topo.map((p,i)=>`<div class="vx-big"${linkPartida(p.matchId)}>
        <div class="pos">${i+1}º</div>
        <div class="quem"><img src="${iconImg(p.dono.icon)}"${FB}>
          <div><div class="n">${h(p.dono.gameName)}</div>
            <div class="s">${h(p.queue)} · ${p.minutes} min · ${p.win?"e ainda ganhou":"derrota"}</div></div></div>
        <div class="linha"><img src="${champImg(p.championId,p.champion)}"${FB}>
          <div><div class="kda">${p.k} / ${p.d} / ${p.a}</div>
            <div class="ctx">${h(p.champion)} · nota de vergonha ${nf(p.nota,0)}</div></div></div>
        <div class="ver">“${h(p.veredito)}”</div></div>`).join("")}</div>
    </section>
    <section><div class="sh-plain">${chead(I.user,"Por jogador",
      `clique num nome para abrir os vexames · clique numa partida para ver o placar dos dez`,"red")}</div>
      ${jogadores.map((j,idx)=>`<div class="vx-jog" data-vx="${h(j.puuid)}" ${idx===0?"aberto":""}>
        <div class="vx-h" data-vxh="${h(j.puuid)}">
          <span class="seta">▶</span>
          <img src="${iconImg(j.icon)}"${FB}>
          <span class="n">${h(j.gameName)}</span>
          <span class="st">${j.piores.length} vexame${j.piores.length>1?"s":""} · média de ${nf(j.mediaMortes,1)} mortes em ${j.analisadas} partidas</span>
        </div>
        <div class="vx-corpo">${j.piores.map(p=>`<div class="vx-linha"${linkPartida(p.matchId)}>
          <img src="${champImg(p.championId,p.champion)}"${FB}>
          <div><div class="vx-kda">${p.k}/${p.d}/${p.a}</div>
            <div class="vx-meta">${h(p.queue)} · ${p.minutes}min${p.win?" · ganhou assim mesmo":""}</div></div>
          <div class="vx-mot"><div class="vx-ver">“${h(p.veredito)}”</div>
            <div class="vx-chips">${chips(p)}</div></div>
          <div class="vx-nota">${nf(p.nota,0)}<small>vergonha</small></div>
        </div>`).join("")}</div>
      </div>`).join("")}
    </section>`;

  {k:"inhouse",n:"Personalizadas",i:I.target,g:"Grupo",q:0,sub:"As partidas que vocês jogam entre si — UDA contra UDA"},
  {k:"jogadores",n:"Jogadores",i:I.user,g:"Grupo",q:1,sub:"Um cartão por pessoa, com radar comparativo"},

  {k:"arsenal",n:"Arsenal",i:I.bolt,g:"Grupo",q:1,sub:"Itens, runas e feitiços que vocês mais levam"},
  {k:"mural",n:"Mural do mês",i:I.award,g:"Zoeira",q:0,sub:"O UDA e o Afundado de cada mês"},
  {k:"vexames",n:"Paredão",i:I.skull,g:"Zoeira",q:1,sub:"As piores partidas de cada um, com o porquê"},
  {k:"zoeira",n:"Troféus",i:I.award,g:"Zoeira",q:1,sub:"As métricas que existem só para zoar"},
  {k:"regras",n:"Regras",i:I.book,g:"Ajuda",q:0,sub:"Como o UDA Score é calculado"},
];
let page="visao",fila="all";
/* PÁGINAS QUE EXISTEM AGORA. Duas somem sozinhas, e por motivos diferentes:
   - "Personalizadas" só aparece se houver personalizada no banco. É a mesma
     trava de "Em equipe", e é ela que impede o erro do "Outros modos": declarar
     uma aba cujo conteúdo é estruturalmente vazio.
   - "Evolução" some quando a fila é a das personalizadas: são 17 partidas em 4
     noites, e média móvel de dez partidas ou corrida MENSAL não têm o que dizer.
     Melhor não oferecer o link do que abrir uma página que se desculpa. */
const temInhouse=()=>!!(DATA.data.inhouse&&DATA.data.inhouse.team.uniqueMatches>0);
const temZoeira=()=>!!(DATA.zoeira&&Object.keys(DATA.zoeira).length);
const temVexames=()=>!!(DATA.vexames&&Object.keys(DATA.vexames).length);
const temMural=()=>!!(DATA.mural&&DATA.mural.length);
const temArsenal=()=>!!(DATA.arsenal&&Object.keys(DATA.arsenal).length);
const paginas=()=>PAGES.filter(p=>
  (p.k!=="inhouse"||temInhouse())&&(p.k!=="evolucao"||fila!=="inhouse")
  &&(p.k!=="zoeira"||temZoeira())&&(p.k!=="mural"||temMural())
  &&(p.k!=="vexames"||temVexames())
  &&(p.k!=="arsenal"||temArsenal()));
const filaDados=()=>page==="equipe"?"squad":page==="inhouse"?"inhouse":fila;
const zoeiraDaFila=()=>(DATA.zoeira||{})[filaDados()]||[];
const vexamesDaFila=()=>(DATA.vexames||{})[filaDados()]||null;
const arsenalDaFila=()=>(DATA.arsenal||{})[filaDados()]||null;
const grupo=()=>DATA.data[page==="equipe"?"squad":page==="inhouse"?"inhouse":fila];
/* Fila sem nenhuma partida so servia para levar a 6 paginas vazias seguidas --
   "Outros modos" vive assim porque Arena esta em BROKEN_MODES no kpi.py.
   "Todas" e a fila ATUAL ficam sempre, senao o seletor sumiria debaixo de quem
   chegou por link direto (#/pagina/fila). */
const filas=()=>DATA.groups.filter(g=>g.key!=="squad"&&(
  g.key==="all"||g.key===fila||(((DATA.data[g.key]||{}).team||{}).uniqueMatches>0)));

function pVisao(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  const t=g.team, acima=t.winrate>=50;
  /* Fama e Vergonha dividem UMA parede acima de 1080px de .content -- quem faz o
     par e o .halls2. PRECISA ser <section>: vida() so observa "#app > section", e
     num <div> os dois halls sairiam do IntersectionObserver e os 12 numeros dos
     premios nunca rodariam o odometro. */
  const salas=hall(g,false)+hall(g,true);
  /* o podio ja vem como <section> de palco: e ele que abre a pagina depois dos KPIs */
  /* as tres salas ficam juntas -- fama, vergonha e recordes sao o mesmo
     componente e ler uma depois da outra e o que faz elas parecerem um predio.
     O medidor desceu para junto das distribuicoes: o aproveitamento ja e o
     primeiro KPI heroi, aqui em cima ele apareceria duas vezes seguidas. */
  return `<section data-sec="kpis">${statRow(g)}</section>
    ${podio(g)}
    ${afundados(g)?`<section data-sec="afundados">${afundados(g)}</section>`:""}
    ${salas?`<section class="halls2" data-sec="halls">${salas}</section>`:""}
    ${recordes(g)}
    <section data-sec="dispersao"><div class="card">${chead(I.bolt,"Carrega ou alimenta?","dano por minuto contra mortes a cada 10 minutos")}

      <div class="legend"><span><i style="background:var(--teal)"></i>dano acima da média, morrendo pouco</span>
      <span><i style="background:var(--gold)"></i>meio-termo</span>
      <span><i style="background:var(--red)"></i>pouco dano, morrendo muito</span></div></div></section>
    ${g.lcu?medidorCasa(g):medidorPadrao(g,t,acima)}

      "uma placa por partida — clique num campeão para abrir o dossiê")}

}

/* As fábricas de gráfico ficam guardadas por chave e são chamadas depois, por
   ligarGraficos(), com a largura real da caixa. É o que faz a escala do viewBox
   ser sempre 1 -- sem isso a mesma série media 457px numa tela e 617px noutra. */
let GEV={},RO=null,RAF=0;
const GBOX=new WeakMap();
function pintarGrafico(box){
  const w=Math.round(box.clientWidth);
  if(!w) return;
  const ant=GBOX.get(box);
  /* 10px de folga: sem isso o simples aparecer da barra de rolagem (que a própria
     pintura provoca) devolveria o observador para dentro de si mesmo */
  if(ant!=null&&Math.abs(ant-w)<10) return;
  GBOX.set(box,w);
  const f=GEV[box.dataset.g];
  box.innerHTML=f?f(w):"";
}
function ligarGraficos(){
  crestDefs();
  document.querySelectorAll("[data-ev-go]").forEach(b=>b.onclick=()=>irPara("evolucao",b.dataset.evGo));
  if(RO) RO.disconnect();
  const cx=[...document.querySelectorAll(".plot[data-g]")];
  if(!cx.length) return;
  if(!RO&&"ResizeObserver" in window) RO=new ResizeObserver(()=>{
    cancelAnimationFrame(RAF);
    RAF=requestAnimationFrame(()=>document.querySelectorAll(".plot[data-g]").forEach(pintarGrafico));});
  cx.forEach(b=>{pintarGrafico(b); if(RO) RO.observe(b);});
}

function pEvolucao(){
  const g=grupo(); if(!g||!g.players.length) return vazio();
  const ev=DATA.evolution&&DATA.evolution[page==="equipe"?"squad":fila];
  GEV={};
  /* cada gráfico é uma CAIXA vazia + uma fábrica; o SVG nasce medido */
  const cx=(k,cls,fab)=>{GEV[k]=fab;return `<div class="plot ${cls||""}" data-g="${k}"></div>`;};
  const cartao=(head,corpo)=>`<div class="card">${head}${corpo}</div>`;
  /* meia[] e inteiro[] em vez de despejar tudo em sequência: é assim que a grade
     garante que nunca sobra um cartão de meia largura sozinho no fim de uma fila
     -- se meia[] fecha ímpar, o último vira wide. Nenhum auto-fit decide nada. */
  const meia=[],inteiro=[];
  const temSerie=!!(ev&&((ev.scoreMensal&&ev.scoreMensal.length)||(ev.mediaMovel&&ev.mediaMovel.length)));

  meia.push(cartao(chead(I.cal,"Aproveitamento por semana",

        "o Score recalculado dentro de cada mês · anel dourado = líder do mês","gold"),
        cx("corrida","leg",w=>corridaMensal(ev.scoreMensal,w))));
  else if(!temSerie) meia.push(evAviso());

  if(ev&&ev.mediaMovel&&ev.mediaMovel.length)
    meia.push(cartao(chead(I.heart,"Forma recente",
        "média móvel de KDA nas 10 últimas partidas de cada um"),
        cx("mm","leg",w=>serieChart(ev.mediaMovel,{W:w,campo:"kda",
          eixo:"partidas, da mais antiga à mais recente",yFmt:v=>nf(v,1)}))));

  if(ev&&ev.saldo&&ev.saldo.length)
    meia.push(cartao(chead(I.trend,"Saldo acumulado",
        "vitórias menos derrotas ao longo do tempo — acima de zero é lucro"),
        cx("saldo","leg",w=>serieChart(ev.saldo,{W:w,campo:"saldo",zero:0,
          eixo:"partidas, da mais antiga à mais recente",yFmt:v=>sg(v,0)}))));

    inteiro.push(cartao(chead(I.clock,"Quando vocês jogam",

        cx("hm","hm",w=>heatmap(ev.atividade,w))));

function pRegras(){
  const P=[["Vitórias",28],["KDA",18],["Dano por minuto",14],["Participação em abates",12],
           ["CS por minuto",10],["Sobrevivência",10],["Visão por minuto",8]];
  return `<section><div class="card"><div class="prose">
    <h3>O que o UDA Score mede</h3>
    <p>O Score compara <b>vocês com vocês</b>, não com o servidor. Um Score de <b>50 é exatamente a média
    da UDA</b>. Acima disso você está acima dos seus amigos; abaixo, o contrário.</p>
    <p>Isso não é preguiça: a Riot não publica estatísticas agregadas do BR. Não existe endpoint de
    "média do Esmeralda". Sites como o LeagueOfGraphs conseguem porque baixam milhões de partidas por
    conta própria. Comparar vocês com um número inventado seria pior do que não comparar.</p>

    <h3>As sete métricas e seus pesos</h3>
    <div class="wtable">${P.map(([m,v])=>`<div class="wrow"><span class="wn">${m}</span>
      <span class="wb"><i style="width:${v/28*100}%"></i></span><span class="wv">${v}%</span></div>`).join("")}</div>
    <p><b>Sobrevivência</b> é quantos minutos você vive por morte. <b>Participação</b> é a fatia dos
    abates do time em que você entrou, matando ou assistindo.</p>

    <h3>Como as métricas viram nota</h3>
    <p>Cada métrica vira um <b>z-score</b>: quantos desvios-padrão você está da média do grupo.
    Se a UDA ganha 50% em média e você ganha 58%, seu z de vitórias é positivo.</p>
    <p>É isso que torna a nota justa. Uma métrica em que todos são parecidos quase não separa ninguém;
    uma em que vocês se espalham muito pesa de verdade. O peso diz o quanto a métrica <i>importa</i>;
    o z-score diz o quanto ela <i>distingue</i>.</p>
    <p>O z é travado em <code>±2,6</code> desvios, para que um único jogo fora da curva não domine a nota.</p>
    <div class="formula">Score = 50 + 15,5 × Σ (peso × z-score)</div>
    <p>O resultado é limitado entre 1 e 99.</p>

    <h3>Quem entra no ranking</h3>
    <p>É preciso ter no mínimo <b>${DATA.minGames} partidas</b> na fila em questão. Sem isso, alguém com
    dois jogos de sorte lideraria. Quem não atinge aparece na tabela com <code>—</code> no lugar da nota.</p>

    <h3>Por fila, não no geral</h3>
    <p>O Score é recalculado dentro de cada fila, porque a média do grupo muda. Em <b>ARAM</b> e
    <b>Outros modos</b> os pesos são diferentes: CS e visão saem (não significam nada lá) e o dano sobe
    para 25%.</p>

    <h3>O que não entra na conta</h3>
    <ul>
      <li><b>Partidas contra bots</b>, tutorial e o modo Prática — inflariam vitórias e KDA artificialmente.</li>
      <li><b>Arena</b> (o 2v2v2v2, <code>gameMode=CHERRY</code>) — a API agrupa os jogadores de um jeito em que
      "abates do time" somaria 9 pessoas, destruindo participação e % de dano.</li>
      <li><b>Remakes</b> e qualquer partida com menos de 5 minutos.</li>
    </ul>
    <p>A classificação é por <code>gameMode</code>, que vem dentro da partida, e não por ID de fila —
    a Riot cria IDs novos sem avisar e a lista pública dela fica desatualizada.</p>

    <h3>O radar de cada jogador</h3>
    <p>Usa exatamente os mesmos z-scores, só que por métrica isolada, numa escala de 0 a 100. É por isso
    que ele mostra o <i>formato</i> do jogador: quem é dano puro tem uma ponta esticada, quem é equilibrado
    tem um polígono cheio.</p>
    <p style="border-top:1px solid var(--line);padding-top:16px;margin-top:24px">O Score não mede habilidade
    absoluta. Se a UDA inteira melhorasse 20% amanhã, as notas continuariam em torno de 50 — a régua é o
    próprio grupo. Para habilidade absoluta, a coluna <b>Elo</b> é a medida honesta.</p>
  </div></div></section>`;
}

/* ================================================================= VIDA
   O painel estava parado porque tudo nascia pronto e nada reagia a chegada do
   leitor. Aqui ha UM observador so, uma animacao de ENTRADA por elemento e
   nenhum laco infinito: o site precisa parecer vivo quando voce chega, nao ficar
   piscando enquanto voce le. */
const REDUZ=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* o numero grande e placar: ele roda ate o valor real e para. tabular-nums no CSS
   ja garante que a largura nao dance durante a contagem. */
function contar(el){
  const alvo=parseFloat(el.getAttribute("data-count"));
  if(isNaN(alvo)) return;
  const dec=parseInt(el.getAttribute("data-dec")||"0",10)||0;
  const fim=el.textContent;   /* o valor final ja veio formatado -- e ele que fica */
  /* a contagem tem de falar o mesmo idioma do valor final: se ele usa ponto
     decimal, o intermediario nao pode trocar de cara no ultimo quadro */
  const ponto=dec>0&&/\.\d{1,2}$/.test(fim);
  el.setAttribute("data-done","1");
  const dur=760, t0=performance.now();
  const passo=(t)=>{
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    if(k>=1){ el.textContent=fim; return; }
    const s=dec>0?nf(alvo*e,dec):ni(alvo*e);
    el.textContent=ponto?s.replace(/\./g,"").replace(",","."):s;
    requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

function revelar(s){
  s.classList.add("in");
  s.querySelectorAll("[data-count]").forEach(n=>{
    if(!n.getAttribute("data-done")) contar(n);});
}
let OBS=null, obsVivo=false;
function vida(){
  if(REDUZ||!("IntersectionObserver" in window)) return;  /* tudo ja esta no estado final */
  if(!OBS) OBS=new IntersectionObserver(es=>es.forEach(x=>{
    if(!x.isIntersecting) return;
    obsVivo=true; OBS.unobserve(x.target); revelar(x.target);
  }),{rootMargin:"0px 0px -6% 0px",threshold:.05});
  OBS.disconnect();   /* desenhar() destroi o #app inteiro: nada a observar do quadro anterior */
  const secs=[];
  document.querySelectorAll("#app > section").forEach(s=>{
    secs.push(s); s.classList.add("rv");
    /* stagger so em bloco REPETIDO. Podio e halls ja tem cascata propria no CSS
       e entrariam em conflito se ganhassem outra por cima. */
    s.querySelectorAll(".stats>*,.grid>*,.egrid>*,.sunk>*,.pcards>*,.cgrid>*")
      .forEach((c,i)=>{c.classList.add("stg"); c.style.setProperty("--i",i);});
    OBS.observe(s);
  });
  /* REDE DE SEGURANCA: nenhum conteudo pode depender de uma animacao para existir.
     Se o observador nao responder (aba que nao compoe quadros, motor antigo,
     zoom estranho), passado o prazo o painel inteiro aparece do mesmo jeito. */
  setTimeout(()=>{ if(!obsVivo) secs.forEach(revelar); },1200);
}

/* ==================================================== DOBRAS DE CELULAR
   O dash tem de continuar INTEIRO no celular: 31 recordes, 12 quadros de
   hall, 24 partidas, todos os jogadores. O que nao pode e a pagina nascer
   toda aberta -- eram 23 telas de rolagem ate o rodape. Entao cada bloco
   REPETIDO nasce cortado no N util, com um botao de 44px que devolve o
   resto e volta a fechar.
   No desktop a funcao apaga tudo o que criou e sai: nao existe botao, nao
   existe item escondido, o documento e o mesmo de hoje. */
const DOBRA=[
  [".mfeed",  8,"partidas"],   /* 24 placas            -> 8      */
  [".awards", 3,"prêmios"],    /* 6 quadros por hall   -> 3      */
  [".rgrid",  6,"recordes"],   /* 12/10/6 por aba      -> 6      */
  [".stats",  8,"números"],    /* 4 herois + 8 tickers -> 4 + 4  */
  [".pcards", 3,"jogadores"],  /* pagina Jogadores               */
  [".cgrid",  6,"campeões"],   /* arsenal da pagina Campeoes     */
  [".estante",10,"campeões"],  /* a estante da pagina Campeoes   */
  [".fita-b",  6,"jogadores"], /* 13 fitas    -> 6 no celular    */
  [".hl-rows", 6,"jogadores"], /* 9 halteres  -> 6 no celular    */
  [".zgrid",   4,"troféus"],   /* 31 trofeus por hall            */
  [".mugrid",  2,"meses"],     /* 11 meses do mural              */
  [".nems",    4,"jogadores"], /* algoz e fregues                */
  [".dvs",     4,"duplas"],    /* a dupla e o divorcio           */
];
/* o MESMO limiar do bloco de alvos de toque no CSS: se os dois discordarem,
   aparece um aparelho em que o botao existe mas nao cabe o dedo */
const MQ_DOBRA=matchMedia("(max-width:620px)");

/* O DESKTOP TAMBEM DOBRA. A dobra nasceu para o celular, mas a queixa de
   "scroll gigante" e do desktop: a Visao geral abria 12 quadros de hall, 12
   recordes e 24 partidas de uma vez. Os limites aqui sao mais generosos que os
   do celular -- a tela e larga e cada fila cabe mais item -- e quem nao aparece
   nesta lista continua abrindo inteiro no desktop, como antes. */
const DOBRA_DESKTOP={
  ".mfeed":12, ".awards":4, ".rgrid":8, ".pcards":6, ".cgrid":12, ".estante":20,
  ".zgrid":6, ".mugrid":4, ".nems":9, ".dvs":8,
};


/* Seções recolhíveis nas abas longas.
   ABERTAS = quantas nascem abertas; MIN_PARA_DOBRAR = a partir de quantas
   seções a página passa a valer o mecanismo. Numa aba de três blocos, recolher
   só esconderia conteúdo sem devolver rolagem nenhuma. */
const SEC_ABERTAS=4, SEC_MIN=6;
/* a preferência sobrevive à troca de aba: quem abriu "A balança" uma vez não
   quer reabrir toda vez que voltar */
const secAbertas=new Set();

function secoesDobraveis(){
  const app=$("#app");
  if(!app) return;
  /* `section > .card` era estrito demais: nas abas onde os cartoes vivem dentro
     de uma grade (.grid.g2, .g3) nenhum casava, e a Visao geral ficava sem
     nenhum recolhivel. O criterio certo e "tem cabecalho proprio", esteja onde
     estiver dentro da secao. */
  const cards=[...app.querySelectorAll("section .card")]
    .filter(c=>c.querySelector(":scope > .ch"));
  if(cards.length<SEC_MIN){
    cards.forEach(c=>c.removeAttribute("data-fechada"));
    return;
  }
  cards.forEach((card,i)=>{
    const ch=card.querySelector(":scope > .ch");
    const titulo=(ch.querySelector("h2")?.textContent||"").trim();
    if(!ch.classList.contains("clic")){
      ch.classList.add("clic");
      ch.setAttribute("role","button");
      ch.setAttribute("tabindex","0");
      const chev=document.createElement("span");
      chev.className="chev"; chev.textContent="▶";
      ch.appendChild(chev);
      const alterna=()=>{
        const fechando=!card.hasAttribute("data-fechada");
        card.toggleAttribute("data-fechada",fechando);
        ch.setAttribute("aria-expanded",String(!fechando));
        if(fechando) secAbertas.delete(titulo); else secAbertas.add(titulo);
      };
      ch.onclick=(e)=>{ if(!e.target.closest("[data-match],[data-ev],a,button")) alterna(); };
      ch.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();alterna();} };
    }
    const abrir=i<SEC_ABERTAS||secAbertas.has(titulo);
    card.toggleAttribute("data-fechada",!abrir);
    ch.setAttribute("aria-expanded",String(abrir));
  });
}

function dobrar(){
  /* idempotente de proposito: desenhar() chama a cada troca de pagina e o
     matchMedia chama a cada giro do aparelho */
  document.querySelectorAll(".maisbtn").forEach(b=>b.remove());
  document.querySelectorAll(".fold-off").forEach(e=>e.classList.remove("fold-off"));
  const celular=MQ_DOBRA.matches;
  DOBRA.forEach(([sel,nCel,rot])=>{
    const n=celular?nCel:DOBRA_DESKTOP[sel];
    if(!n) return;                       // sem limite de desktop: abre inteiro
    document.querySelectorAll("#app "+sel).forEach(cx=>{
    const itens=[...cx.children];
    /* esconder UM item so nao paga o botao que o esconde */
    if(itens.length<=n+1) return;
    const b=document.createElement("button");
    b.type="button"; b.className="maisbtn";
    const fechar=()=>{
      itens.slice(n).forEach(e=>e.classList.add("fold-off"));
      b.setAttribute("aria-expanded","false");
      b.textContent=`Ver mais ${itens.length-n} ${rot}`;};
    const abrir=()=>{
      /* tira o .stg junto: o item revelado depois da cascata ja terminada
         ficaria com uma animacao de entrada velha pendurada */
      itens.forEach(e=>e.classList.remove("fold-off","stg"));
      b.setAttribute("aria-expanded","true");
      b.textContent="Ver menos";};
    b.onclick=()=>b.getAttribute("aria-expanded")==="true"?fechar():abrir();
    cx.appendChild(b); fechar();
    });
  });
}
MQ_DOBRA.addEventListener("change",dobrar);

function ligarZoeira(){
  /* clicar no degrau abre as partidas daquela pessoa naquele trofeu */
  document.querySelectorAll("[data-ev]").forEach(s=>s.onclick=()=>{
    const chave=s.dataset.ev;
    const caixa=document.querySelector(`[data-evbox="${CSS.escape(chave)}"]`);
    if(!caixa) return;
    const cartao=s.closest(".ztrof");
    // so uma evidencia aberta por trofeu, senao o cartao cresce sem controle
    cartao.querySelectorAll("[data-evbox]").forEach(b=>{if(b!==caixa) b.hidden=true;});
    cartao.querySelectorAll("[data-ev]").forEach(o=>{if(o!==s) o.removeAttribute("aberto");});
    caixa.hidden=!caixa.hidden;
    s.toggleAttribute("aberto",!caixa.hidden);
  });
  document.querySelectorAll("[data-zmais]").forEach(b=>b.onclick=()=>{
    const lista=document.querySelector(`[data-trof="${CSS.escape(b.dataset.zmais)}"]`);
    if(!lista) return;
    const extras=lista.querySelectorAll("[data-extra]");
    const abrindo=extras[0]&&extras[0].hidden;
    extras.forEach(e=>e.hidden=!abrindo);
    b.textContent=abrindo?"mostrar só o pódio":`ver o resto do elenco (${extras.length})`;
  });
  document.querySelectorAll("[data-arsenal]").forEach(b=>b.onclick=()=>{
    arsenalAba=b.dataset.arsenal; desenhar();
  });
}

function ligarSeletor(){
  document.querySelectorAll("[data-sel]").forEach(b=>b.onclick=()=>{selJog.clear();desenhar();});
  document.querySelectorAll("[data-jog]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.jog;
    // Sem seleção ativa, o primeiro clique ISOLA aquele jogador.
    // Com seleção ativa, alterna; tirar o último volta a mostrar todos.
    if(!selJog.size) selJog=new Set([id]);
    else if(selJog.has(id)) selJog.delete(id);
    else selJog.add(id);
    desenhar();
  });
}

/* Trocar de aba e so mostrar outra grade. Os numeros ja contaram quando a sala
   entrou na tela: recontar do zero a cada clique viraria piscada. */
function ligarRecordes(){
  const abas=[...document.querySelectorAll("[data-rec]")];
  abas.forEach(b=>b.onclick=()=>{
    abas.forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
    document.querySelectorAll("[data-recg]").forEach(gr=>{
      gr.hidden=gr.dataset.recg!==b.dataset.rec;});
  });
}

/* O limiar mora no CSS e o JS PERGUNTA por ele. Um matchMedia aqui mediria o
   VIEWPORT enquanto o container query mede a CAIXA DE CONTEUDO, e erraria pela
   largura do padding (ate 88px). #app e a sonda porque existe sempre e nunca
   fica dentro de um <details> fechado. */
const emCartao=()=>{const a=$("#app");
  return !!a&&getComputedStyle(a).getPropertyValue("--modo").trim()==="cartao";};

/* Duas coisas que o CSS nao alcanca: aria-expanded (estado, nao aparencia) e a
   grade da matriz, que precisa nascer ABERTA no desktop e fechada no celular. */
function sincCartoes(){
  const c=emCartao();
  document.querySelectorAll(".tbox.cards tbody tr").forEach(tr=>{
    if(c){ if(!tr.hasAttribute("aria-expanded")) tr.setAttribute("aria-expanded","false"); }
    else { tr.removeAttribute("aria-expanded"); tr.classList.remove("open"); }});
  /* por ELEMENTO e nao por "mudou de modo": a matriz e repintada a cada troca de
     pagina, e um <details> recem-nascido nunca viu a virada do modo. O data-uso
     e marcado no clique do summary (nao no toggle, que tambem dispara quando
     somos NOS abrindo) para nao desfazer a escolha de quem abriu na mao. */
  document.querySelectorAll("details.mxfull").forEach(d=>{
    const s=d.querySelector("summary");
    if(s&&!s.onclick) s.onclick=()=>{d.dataset.uso="1";};
    if(!d.dataset.uso) d.open=!c;});
}

function abrirCartao(tr){
  const ab=tr.classList.toggle("open");
  tr.setAttribute("aria-expanded",String(ab));
}

/* Toda linha de mesa-que-vira-cartao responde ao toque. As do ranking tambem
   navegam, mas so pelo botao do pe da gaveta -- ver o resto da linha nao pode
   ser efeito colateral de querer ler a linha. */
function ligarCartoes(){
  document.querySelectorAll(".tbox.cards tbody tr:not([data-p])").forEach(tr=>{
    tr.onclick=()=>{ if(emCartao()) abrirCartao(tr); };
    tr.onkeydown=e=>{ if((e.key==="Enter"||e.key===" ")&&emCartao()){e.preventDefault();abrirCartao(tr);} };});
  sincCartoes();
}

function ligarTabela(){
  const ordenar=k=>{ if(!k||k==="_go") return;
    if(k===sortKey) sortDir*=-1; else {sortKey=k;sortDir=1;}
    $("#tbl").innerHTML=tabela(grupo()); ligarTabela();};
  document.querySelectorAll("#tbl thead th[data-k]").forEach(th=>th.onclick=()=>ordenar(th.dataset.k));
  document.querySelectorAll("#tbl .tsc").forEach(b=>b.onclick=()=>ordenar(b.dataset.sk));
  const irAoJogador=id=>{ irPara("jogadores",fila);
    setTimeout(()=>{const c=document.getElementById("pc-"+id);
      if(!c) return;
      /* com .pcards dobrado em 3 o cartao alvo pode estar em display:none, e o
         scrollIntoView nao iria a lugar nenhum: abre a dobra antes de pular */
      const b=c.closest(".pcards")&&c.closest(".pcards").querySelector(".maisbtn");
      if(b&&b.getAttribute("aria-expanded")!=="true") b.click();
      c.scrollIntoView({behavior:"smooth",block:"center"});
      c.style.borderColor="var(--teal)";setTimeout(()=>c.style.borderColor="",1800);},60);};
  document.querySelectorAll("#tbl tbody tr[data-p]").forEach(tr=>{
    tr.onclick=e=>{
      if(emCartao()&&!(e.target.closest&&e.target.closest('[data-k="_go"]'))) return abrirCartao(tr);
      irAoJogador(tr.dataset.p);};
    tr.onkeydown=e=>{ if(e.key!=="Enter"&&e.key!==" ") return; e.preventDefault();
      if(emCartao()) abrirCartao(tr); else irAoJogador(tr.dataset.p);};});
  sincCartoes();
}

/* o limiar e de CONTAINER, mas so o viewport muda sozinho: um resize e o unico
   momento em que o modo pode virar sem nova pintura */
let tmrCartoes=0;
addEventListener("resize",()=>{clearTimeout(tmrCartoes);tmrCartoes=setTimeout(sincCartoes,140);});

/* ============================================================== GAVETA
   Um limiar so, e ele mora aqui e no CSS. O CSS desenha; o JS decide QUANDO a
   gaveta e um dialogo modal e quando ela e sidebar de verdade. */
const MQ_GAVETA=matchMedia("(max-width:1080px)");
const elDrawer=$("#drawer"), elScrim=$("#navscrim"), elBurger=$("#burger"), elMain=$("#maincol");
let scrollPreso=0;

/* trava com position:fixed + top negativo, NAO overflow:hidden -- o iOS Safari
   ignora overflow:hidden no body e rola a pagina por baixo da gaveta. O
   padding-right compensa a barra de rolagem do desktop; no celular vale 0. */
function travarScroll(t){
  const b=document.body;
  if(t){
    scrollPreso=window.scrollY||document.documentElement.scrollTop||0;
    const barra=window.innerWidth-document.documentElement.clientWidth;
    b.style.position="fixed"; b.style.top=(-scrollPreso)+"px";
    b.style.left="0"; b.style.right="0"; b.style.width="100%";
    if(barra>0) b.style.paddingRight=barra+"px";
  }else{
    b.style.position=""; b.style.top=""; b.style.left=""; b.style.right="";
    b.style.width=""; b.style.paddingRight="";
    /* enquanto o body estava fixo a pagina media uma tela de altura. Sem forcar o
       recalculo AQUI, o scrollTo e cortado pelo limite antigo e a pagina volta
       para o meio do nada em vez do ponto exato onde a gaveta abriu. */
    void b.offsetHeight;
    window.scrollTo({top:scrollPreso,left:0,behavior:"instant"});
  }
}

const gavetaAberta=()=>elDrawer.getAttribute("data-open")==="true";

function abrirGaveta(){
  sincGaveta();   /* terceira rede: no pior caso o modo se acerta na hora do uso */
  if(!MQ_GAVETA.matches||gavetaAberta()) return;
  elDrawer.setAttribute("data-open","true");
  elBurger.setAttribute("aria-expanded","true");
  document.body.classList.add("navon");
  /* aria-modal sem inertar o fundo seria mentira para a tecnologia assistiva */
  elMain.setAttribute("inert","");
  travarScroll(true);
  /* preventScroll: dar foco a um elemento o traz para a tela, e isso desfaria a
     trava que acabou de guardar a posicao de leitura */
  elDrawer.focus({preventScroll:true});
}
function fecharGaveta(devolveFoco){
  if(!gavetaAberta()) return;
  elDrawer.setAttribute("data-open","false");
  elBurger.setAttribute("aria-expanded","false");
  document.body.classList.remove("navon");
  elMain.removeAttribute("inert");
  travarScroll(false);
  if(devolveFoco!==false&&MQ_GAVETA.matches) elBurger.focus({preventScroll:true});
}

/* acima do limiar o role sai: ali ela nao e dialogo, e sidebar de verdade */
let gavetaModo=null;
function sincGaveta(){
  const movel=MQ_GAVETA.matches;
  if(movel===gavetaModo) return;   /* resize dispara aos montes: so agir na virada */
  gavetaModo=movel;
  if(movel){
    elDrawer.setAttribute("role","dialog");
    elDrawer.setAttribute("aria-modal","true");
  }else{
    fecharGaveta(false);   /* nada de scrim ou inert pendurado ao girar a tela */
    elDrawer.removeAttribute("role");
    elDrawer.removeAttribute("aria-modal");
  }
}
/* os dois ouvintes de proposito: o `change` da media query e o certo, mas ha
   motor (e navegador com viewport forcado) que nao o dispara -- o resize e a rede */
if(MQ_GAVETA.addEventListener) MQ_GAVETA.addEventListener("change",sincGaveta);
else if(MQ_GAVETA.addListener) MQ_GAVETA.addListener(sincGaveta);
window.addEventListener("resize",sincGaveta);
sincGaveta();

elBurger.onclick=()=>gavetaAberta()?fecharGaveta():abrirGaveta();
elScrim.onclick=()=>fecharGaveta();
$("#drawerx").onclick=()=>fecharGaveta();
document.addEventListener("keydown",e=>{
  if(!gavetaAberta()) return;
  if(e.key==="Escape"){fecharGaveta();return;}
  if(e.key!=="Tab") return;
  /* o fundo esta inert, entao o ciclo do Tab tem de ser o da propria gaveta */
  const f=[...elDrawer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(x=>x.offsetParent!==null&&!x.disabled);
  if(!f.length) return;
  const a=f[0], z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===elDrawer)){z.focus();e.preventDefault();}
  else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault();}
});

}else{

    $("#ft-fonte").innerHTML="<b style='color:var(--red)'>Dados fictícios</b> — gerados por demo.py, sem chamada à Riot";}
  $("#brandsub").textContent=(DATA.platform||"br1").toUpperCase()+" · "+(DATA.data.all?DATA.data.all.players.length:0)+" jogadores";
  $("#ft-jan").textContent=`Janela: ${DATA.windowDays>0?DATA.windowDays+" dias":"histórico completo"}`;
  $("#ft-ger").textContent=`Gerado em ${new Date(DATA.generatedAt).toLocaleString("pt-BR")}`;
  const m=(location.hash||"").match(/^#\/([a-z]+)\/([a-z]+)/);
  if(m){if(RENDER[m[1]])page=m[1];if(DATA.data[m[2]])fila=m[2];}
  window.addEventListener("hashchange",()=>{const x=(location.hash||"").match(/^#\/([a-z]+)\/([a-z]+)/);
    if(x&&(x[1]!==page||x[2]!==fila)) irPara(x[1],x[2]);});
  pintarNav(); desenhar();
}
