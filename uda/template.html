<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>União dos Afundados</title>
<link rel="icon" href="__UDA_LOGO__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116;  --card:#161B22;  --card2:#1C222B;  --card3:#222933;
  --line:#232A33; --line2:#1C222A;
  /* --dim era #5D6673 e aparece quase sempre em 10-12px (rotulo de KPI, unidade,
     legenda). Nesse tamanho dava 2.98:1 sobre o fundo dos cards -- abaixo dos
     4.5:1 que texto pequeno exige. Clareado ate passar, sem virar --mut. */
  --txt:#E9EDF2;  --mut:#8A94A3;  --dim:#828C9C;
  --teal:#0AC8B9; --teal-s:rgba(10,200,185,.13);
  --gold:#C8AA6E; --gold-s:rgba(200,170,110,.13);
  --red:#EB565B;  --red-s:rgba(229,72,77,.13);
  --blue:#4C8DFF; --blue-s:rgba(76,141,255,.13);
  --barneutral:#2A323D;
  --r:16px; --rs:10px; --rp:999px;
  --disp:"Montserrat",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  /* rampa de ouro: o --gold acima e o degrau 2. Os outros tres existem para que
     bisel e gravacao sejam a MESMA cor em luminancias diferentes, nao cores novas. */
  --gold-1:#F0E6D2; --gold-2:#C8AA6E; --gold-3:#8B6D34; --gold-4:#463714;
  /* prata e bronze nomeados: filter:saturate() apagaria a arte junto do metal */
  --m2a:#F1F5FA; --m2b:#C9D2DE; --m2c:#6C7784;
  --m3a:#F0C39A; --m3b:#C88A5A; --m3c:#6E4526;
  --ink:#0A0D12; --ink2:#11151C;
  --cond:"Barlow Condensed",var(--disp);
  --stage:52px;
  --bevel:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -1px 0 rgba(0,0,0,.55);
  --lift:0 18px 34px -20px rgba(0,0,0,.9);
  --glass:repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 1px,transparent 1px 4px);
  --e:cubic-bezier(.22,1,.36,1); --e-pop:cubic-bezier(.2,.9,.3,1.08);
}
*{box-sizing:border-box}
/* escala fluida: sem isso um monitor de 2560px so dilui o mesmo texto de 14px */
body{margin:0;background:var(--bg);color:var(--txt);font:400 14px/1.5 var(--body);
  font-size:clamp(14px,.42vw + 12.6px,16px);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.up{text-transform:uppercase;letter-spacing:.12em}

/* =========================================================== LAYOUT
   O limiar da sidebar tem CONTA, nao gosto. Ela custa 252px e o .content ainda
   paga 2x --pad (clamp(20px,2.6vw,44px)), entao o container que as container
   queries medem vale  V - 252 - 2*pad:
     1080 -> 772px  (acima dos 760px que sao o degrau de CELULAR deste arquivo)
     1067 -> 759px  (ja caiu na faixa de celular: barrado)
   1080 e o ultimo numero redondo em que a sidebar convive com um container que
   NAO e de celular. Do outro lado do degrau: 1093px CSS (= 1366 a 125% de DPI, o
   notebook Windows mais comum) fica COM a sidebar e 784px de container -- com o
   antigo 1180 ele a perdia a toa. Em 1024 (iPad deitado) a sidebar deixaria
   719px; sem ela sobram 971px, que cruza os 900px e VOLTA para duas colunas. */
:root{--tb-h:62px; --fb-h:52px; --drw:min(300px,86vw)}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* minmax(0,1fr) e NUNCA `1fr`: `1fr` e `minmax(auto,1fr)` e a coluna se recusa a
   encolher abaixo do min-content do filho. Com a faixa de filas em uma linha so
   (593px de min-content) o `1fr` esticava a PAGINA num aparelho de 375. */
@media(max-width:1080px){.app{grid-template-columns:minmax(0,1fr)}}
/* duas barras grudadas no topo: ancora nenhuma pode nascer debaixo delas */
html{scroll-padding-top:calc(var(--tb-h) + var(--fb-h))}

/* ---------------------------------------------------------- sidebar */
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.brand img{width:38px;height:38px;flex:0 0 auto}
.brand .t{font:700 14px/1.15 var(--disp);letter-spacing:.02em}
.brand .s{font:500 10px/1 var(--body);color:var(--dim);margin-top:4px;letter-spacing:.1em;text-transform:uppercase}
.navgroup{padding:6px 12px}
.navgroup .lbl{font:600 9.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--dim);padding:12px 10px 8px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:1px solid transparent;background:none;
  color:var(--mut);cursor:pointer;padding:10px 11px;border-radius:var(--rs);font:500 13.5px/1 var(--body);
  text-align:left;transition:.13s;margin-bottom:2px}
.nav:hover{background:var(--card2);color:var(--txt)}
.nav[aria-current="page"]{background:var(--card3);border-color:var(--line);color:var(--txt);font-weight:600}
.nav svg{width:17px;height:17px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav[aria-current="page"] svg{stroke:var(--teal)}
.nav .badge{margin-left:auto;font:600 10.5px/1 var(--body);background:var(--gold-s);color:var(--gold);
  padding:4px 7px;border-radius:var(--rp);font-variant-numeric:tabular-nums}
.sidecard{margin:auto 12px 14px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sidecard .k{font:600 9.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.sidecard .v{font:700 26px/1 var(--disp);margin-top:9px;font-variant-numeric:tabular-nums}
.sidecard .s{font-size:11.5px;color:var(--mut);margin-top:5px}
.sidecard .track{height:5px;border-radius:var(--rp);background:var(--barneutral);margin-top:11px;overflow:hidden}
.sidecard .track i{display:block;height:100%;border-radius:var(--rp);background:var(--teal)}

/* --------------------------------------------------- GAVETA (off-canvas)
   position:fixed tira os 620px do fluxo -- so isso ja apaga o bloco empilhado
   que abria o celular. 100dvh depois de 100vh: no Chrome do Android 100vh e a
   altura COM a barra de endereco recolhida e o pe da gaveta ficava debaixo dela;
   o 100vh na frente e a rede para motor sem dvh. */
@media(max-width:1080px){
  aside{position:fixed;inset:0 auto auto 0;z-index:90;
    width:var(--drw);height:100vh;height:100dvh;
    transform:translateX(-100%);
    transition:transform .26s var(--e);
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
    box-shadow:none}
  /* estado no ATRIBUTO do proprio elemento, nao numa classe que mora no body */
  aside[data-open="true"]{transform:translateX(0);box-shadow:var(--lift)}
  .brand{padding-right:56px}          /* o X nao pode pisar no nome */
  /* alvo de toque: os itens de menu sao a razao da gaveta existir */
  .nav{padding:13px 11px;font-size:14.5px}
}
/* fechada ela vive em translateX(-100%): conteudo a ESQUERDA do zero nunca gera
   rolagem (so direita/baixo geram), entao a gaveta escondida custa 0px de pagina */
.drawerx{display:none;position:absolute;z-index:2;
  top:calc(12px + env(safe-area-inset-top));right:12px;
  width:36px;height:36px;place-items:center;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--rs);background:var(--card2);color:var(--mut)}
.drawerx:hover{color:var(--txt);background:var(--card3)}
.drawerx:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.drawerx svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.drawermeta{display:none;flex-wrap:wrap;gap:8px;padding:0 12px 16px}

/* -------------------------------------------------------------- backdrop */
.navscrim{position:fixed;inset:0;z-index:80;display:none;
  background:rgba(6,9,13,.62);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .26s var(--e)}
body.navon .navscrim{opacity:1;pointer-events:auto}

/* -------------------------------------------------------------- hamburguer */
.burger{display:none;place-items:center;flex:0 0 auto;
  width:44px;height:44px;margin-left:-9px;          /* 44px: alvo minimo de toque */
  border:1px solid var(--line);border-radius:var(--rs);background:var(--card);
  color:var(--txt);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .13s}
.burger:hover{background:var(--card2)}
.burger:active{background:var(--card3)}
.burger:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.burger svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
/* as tres barras viram X sem trocar de SVG: so transform. O estado ja esta dito
   em aria-expanded -- o desenho apenas repete o que a semantica ja diz. */
.burger svg path{transform-box:fill-box;transform-origin:center;
  transition:transform .22s var(--e),opacity .14s linear}
.burger[aria-expanded="true"] .l1{transform:translateY(5px) rotate(45deg)}
.burger[aria-expanded="true"] .l2{opacity:0}
.burger[aria-expanded="true"] .l3{transform:translateY(-5px) rotate(-45deg)}

/* os quatro nascem display:none e so acendem abaixo do limiar. Este bloco vem
   DEPOIS das declaracoes de base de proposito: mesma especificidade, quem vem
   por ultimo ganha -- inverter a ordem deixaria o hamburguer invisivel. */
@media(max-width:1080px){
  .burger{display:grid}
  .drawerx{display:grid}
  .drawermeta{display:flex}
  .navscrim{display:block}
}

/* ---------------------------------------------------------- topbar
   Tinha 207px no celular porque carregava titulo + subtitulo + 6 pilulas de fila
   quebradas em linhas + 2 chips. Agora carrega hamburguer, titulo e chips, e
   nada mais: altura FIXA, sem flex-wrap, sem surpresa. */
.topbar{position:sticky;top:0;z-index:40;background:rgba(14,17,22,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  height:var(--tb-h);padding:0 30px;display:flex;align-items:center;gap:14px;flex-wrap:nowrap}
.topbar h1{margin:0;font:700 20px/1.2 var(--disp);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbmeta{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}

/* o subtitulo da pagina nao e cromo: e a primeira linha do texto. Fora da topbar
   ele devolve altura de barra em TODA largura e ainda ganha medida de leitura --
   na topbar ele era uma linha espremida ao lado dos chips. */
.lede{margin:-4px 0 22px;font-size:14px;color:var(--mut);max-width:72ch}
.lede:empty{display:none}

/* ------------------------------------------------------ FAIXA DE FILAS
   Faixa rolavel e nao <select>, por tres motivos medidos: (1) cada pilula carrega
   a CONTAGEM da fila -- num <option> isso vira texto solto e some a comparacao de
   relance; (2) sao 6 itens somando ~590px, 1,6 tela em 375px: rolagem curta, e
   <select> so ganha la pelos 12/15 itens; (3) faixa = 1 toque, <select> = abrir,
   rolar a roda do iOS, confirmar. E continua sendo o mesmo .seg com aria-pressed:
   nenhum controle novo, nenhuma ponte de evento change->irPara.
   Barra propria em TODA largura porque mesmo no desktop, entre 1081 e ~1300px,
   h1 + seg + chips nao cabiam e a topbar ja quebrava em duas linhas. */
.filabar{position:sticky;top:var(--tb-h);z-index:39;
  background:rgba(14,17,22,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:8px 30px;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x proximity;scroll-padding-inline:14px;
  overscroll-behavior-x:contain;scrollbar-width:none}
.filabar::-webkit-scrollbar{display:none}
.filabar:empty{display:none}          /* paginas sem fila: Em equipe e Regras */
.filabar .seg{flex-wrap:nowrap;flex:0 0 auto}
.filabar .seg button{scroll-snap-align:center}

/* ------------------------------------------------- topbar/faixa no celular */
@media(max-width:1080px){
  :root{--tb-h:60px; --fb-h:46px}
  .topbar{gap:10px;
    padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right))}
  .topbar h1{font-size:17px;letter-spacing:.005em}
  /* display:none tira tambem da arvore de acessibilidade: o leitor de tela nunca
     ouve o par duplicado de chips (o gemeo vivo e o #drawermeta) */
  .tbmeta{display:none}
  .filabar{padding:7px max(12px,env(safe-area-inset-left))}
  /* na faixa a capsula da .seg vira ruido. Sem moldura, a pilula CORTADA na borda
     direita e o proprio aviso de "tem mais para o lado". */
  .filabar .seg{background:none;border:0;padding:0;gap:6px}
  .filabar .seg button{border:1px solid var(--line);background:var(--card);
    border-radius:var(--rp);padding:8px 13px}
  .filabar .seg button[aria-pressed="true"]{background:var(--card3);color:var(--txt)}
}
/* o curinga de linha ~1130 ja desliga isto, mas deixo explicito para o dia em que
   aquele seletor for reduzido de escopo */
@media(prefers-reduced-motion:reduce){
  aside,.navscrim,.burger svg path{transition:none}
}

/* a .seg fora da faixa (desktop) continua sendo a capsula de sempre */
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:3px}
.seg button{appearance:none;border:0;background:none;color:var(--mut);cursor:pointer;font:500 12.5px/1 var(--body);
  padding:7px 12px;border-radius:7px;white-space:nowrap;transition:.13s}
.seg button:hover{color:var(--txt);background:var(--card2)}
.seg button[aria-pressed="true"]{background:var(--card3);color:var(--txt);font-weight:600}
.seg button b{font-variant-numeric:tabular-nums;opacity:.55;margin-left:5px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--rp);padding:7px 13px;font-size:12px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--txt);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.dot.old{background:var(--red)}
/* O container de conteudo e a REFERENCIA de todo grid daqui pra baixo: os grids
   passam a responder a largura real disponivel, nao ao viewport. E isso que mata o
   bug de a sidebar colapsar em 1080px e os grids em 1180px (card ficava mais
   estreito quando a tela crescia). Nada de @media para grid de card. */
/* --pad e a MESMA medida do padding lateral, exposta como token: e por ela que a
   secao de palco (o podio) sai da coluna de leitura e vai de borda a borda. */
.content{container-type:inline-size;container-name:content;--pad:clamp(20px,2.6vw,44px);
  max-width:1760px;margin:0 auto;padding:34px var(--pad) 96px}

/* =========================================================== CARDS */
/* overflow:hidden e o que faz o card RECORTAR a tabela de cantos quadrados que
   mora dentro dele -- antes os cantos vazavam por cima do raio de 16px */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;overflow:hidden}
.card.flush{padding:0}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ch .ic{width:34px;height:34px;border-radius:var(--rs);display:grid;place-items:center;background:var(--teal-s);flex:0 0 auto}
.ch .ic svg{width:17px;height:17px;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ch .ic.gold{background:var(--gold-s)} .ch .ic.gold svg{stroke:var(--gold)}
.ch .ic.red{background:var(--red-s)}   .ch .ic.red svg{stroke:var(--red)}
.ch h2{margin:0;font:600 15.5px/1.25 var(--disp)}
.ch .hint{font-size:12px;color:var(--dim);margin-top:3px}
.ch .act{margin-left:auto;font-size:12px;color:var(--mut)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g32{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)}
@container content (max-width:900px){.g2,.g23,.g32{grid-template-columns:1fr}}
/* a fila de tres vai direto para uma coluna: em duas, o terceiro card fica
   sozinho embaixo ocupando meia largura -- o orfao que o resto da grade evita. */
@container content (max-width:1020px){.g3{grid-template-columns:1fr}}
section{margin-bottom:var(--stage)}

/* KPIs em duas castas. Antes os 12 tinham o mesmo peso, entao "Partidas analisadas"
   gritava tao alto quanto "Aproveitamento" e nada gritava de verdade. Agora:
   4 HEROIS (span largo, numero condensado gigante, cor semantica, sparkline) e
   8 TICKERS (span estreito, 22px, tudo em cinza). A cor volta a significar algo.
   Grade de 24 colunas = divisores exatos: heroi 6 (4/fila), ticker 3 (8/fila).
   auto-fit e PROIBIDO aqui -- era ele que produzia a fila orfa com 2 buracos. */
.stats{display:grid;gap:14px;grid-template-columns:repeat(24,minmax(0,1fr))}
.stats>*{grid-column:span 6}          /* tambem serve a fila de 4 da pagina Equipe */
.stats>.kpi-tick{grid-column:span 3}
@container content (max-width:1180px){
  .stats{grid-template-columns:repeat(16,minmax(0,1fr))}
  .stats>*{grid-column:span 8} .stats>.kpi-tick{grid-column:span 4}
}
@container content (max-width:760px){
  .stats{grid-template-columns:repeat(8,minmax(0,1fr))}
  .stats>*{grid-column:span 8} .stats>.kpi-tick{grid-column:span 4}
}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;gap:14px;align-items:center}
.stat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--card2)}
.stat .ic svg{width:20px;height:20px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat .k{font-size:12px;color:var(--mut)}
.stat .v{font:700 21px/1.15 var(--disp);margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font:500 12.5px/1 var(--body);color:var(--dim);margin-left:4px}
.teal .ic{background:var(--teal-s)} .teal .ic svg{stroke:var(--teal)}
.gold .ic{background:var(--gold-s)} .gold .ic svg{stroke:var(--gold)}
.red  .ic{background:var(--red-s)}  .red  .ic svg{stroke:var(--red)}
.blue .ic{background:var(--blue-s)} .blue .ic svg{stroke:var(--blue)}

/* ---- KPI HEROI: o numero e o objeto, o resto e legenda ---- */
.kpi-hero{position:relative;overflow:hidden;display:flex;flex-direction:column;
  background:linear-gradient(165deg,var(--card2),var(--card) 62%);
  border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;
  box-shadow:var(--bevel);transition:border-color .16s,transform .16s}
.kpi-hero:hover{border-color:#2C3540;transform:translateY(-2px)}
/* filete metalico no topo: liga o KPI ao mesmo vocabulario de material do podio */
.kpi-hero::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--acc,var(--gold-2)),transparent);opacity:.85}
.kpi-hero .top{display:flex;align-items:center;gap:9px;min-width:0}
.kpi-hero .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--card3);background:color-mix(in srgb,var(--acc,var(--gold-2)) 16%,transparent)}
.kpi-hero .ic svg{width:14px;height:14px;fill:none;stroke:var(--acc,var(--gold-2));
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi-hero .k{font:700 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;
  color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-hero .v{margin-top:8px;font:800 clamp(38px,4.2cqw,64px)/.9 var(--cond);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--acc,var(--gold-2))}
.kpi-hero .v small{font:600 15px/1 var(--cond);opacity:.72;margin-left:2px}
.kpi-hero .foot{margin-top:auto;padding-top:10px;display:flex;align-items:flex-end;
  justify-content:space-between;gap:10px}
.kpi-hero .sub{font-size:11.5px;color:var(--dim);min-width:0}
.kpi-hero .spark{flex:0 0 auto;display:block;opacity:.85}
.kpi-hero .spark .ln{fill:none;stroke:var(--acc,var(--gold-2));stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.kpi-hero .spark .ar{fill:var(--acc,var(--gold-2));opacity:.14;stroke:none}

/* ---- TICKER: dado de apoio. Sem cor, de proposito. ---- */
.kpi-tick{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);
  padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0;
  transition:border-color .16s}
.kpi-tick:hover{border-color:#2C3540}
/* rotulo pode quebrar em 2 linhas -- a altura minima e o que mantem os 8 valores
   alinhados na mesma base, com ou sem quebra */
.kpi-tick .k{display:flex;align-items:flex-start;gap:7px;font:600 10px/1.3 var(--body);
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);min-width:0;min-height:26px}
.kpi-tick .k svg{width:13px;height:13px;flex:0 0 auto;margin-top:1px;fill:none;stroke:var(--mut);
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi-tick .k span{min-width:0;overflow-wrap:anywhere}
.kpi-tick .v{margin-top:auto;font:700 22px/1 var(--cond);color:var(--mut);font-variant-numeric:tabular-nums}
.kpi-tick .v small{font:500 11px/1 var(--body);color:var(--dim);margin-left:4px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--rp);
  font:600 11.5px/1 var(--body);font-variant-numeric:tabular-nums}
.pill.t{background:var(--teal-s);color:var(--teal)}
.pill.r{background:var(--red-s);color:var(--red)}
.pill.g{background:var(--gold-s);color:var(--gold)}
.pill.n{background:var(--card3);color:var(--mut)}
.good{color:var(--teal)} .bad{color:var(--red)} .au{color:var(--gold)}

/* O PODIO agora mora junto do vocabulario "ARENA UDA", la embaixo: ele depende
   de .stage-layers, .artbox e da rampa de metal, entao nasce depois deles. */

.shame .row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line2)}
.shame .row:last-child{border-bottom:0}
.shame .p{font:700 13px/1 var(--body);color:var(--dim);width:26px;font-variant-numeric:tabular-nums}
.shame img{width:38px;height:38px;border-radius:50%;border:1px solid var(--line)}
.shame .nm{font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shame .nm em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);font-weight:400;margin-top:2px}

/* =========================================================== TABELA */
/* As duas sombras laterais so aparecem quando ha conteudo escondido: as camadas
   `local` rolam junto e cobrem a sombra `scroll` quando a tabela cabe inteira.
   Sem isso a tabela de 20 colunas rola sem nenhuma pista visual de que rola. */
.tbox{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);
  background-image:linear-gradient(to right,var(--card),var(--card)),
    linear-gradient(to left,var(--card),var(--card)),
    linear-gradient(to right,rgba(0,0,0,.42),rgba(0,0,0,0)),
    linear-gradient(to left,rgba(0,0,0,.42),rgba(0,0,0,0));
  background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;
  background-size:22px 100%,22px 100%,13px 100%,13px 100%;
  background-attachment:local,local,scroll,scroll}
table{border-collapse:collapse;width:100%}
thead th{position:sticky;top:0;z-index:3;background:var(--card2);font:600 11px/1.3 var(--body);color:var(--mut);
  padding:13px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
thead th.l{text-align:left}
thead th:hover,thead th.on{color:var(--teal)}
tbody td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody td.l{text-align:left}
tbody tr{cursor:pointer;transition:.1s}
tbody tr:hover{background:var(--card2)}
tbody tr:last-child td{border-bottom:0}
.rnk{font:700 14px/1 var(--disp);color:var(--dim);width:36px;font-variant-numeric:tabular-nums}
.rnk.r1{color:var(--gold)}
.pl{display:flex;align-items:center;gap:11px;min-width:180px}
.pl img{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
.pl .a{font-weight:600;font-size:13.5px}
.pl .b{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.eloc{display:flex;align-items:center;gap:9px;min-width:126px}
.eloc img{width:26px;height:26px}
.eloc .a{font-size:12.5px;font-weight:600}
.eloc .b{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.wr{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:92px}
.wr .t{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.wr .track{width:80px;height:5px;border-radius:var(--rp);background:var(--barneutral);overflow:hidden}
.wr .track i{display:block;height:100%;border-radius:var(--rp);background:var(--teal)}
.wr .track i.lo{background:var(--red)}

/* =========================================== CLASSIFICAÇÃO: A PISTA
   O que faz uma tabela PARECER planilha nao e a densidade -- densidade e o
   PONTO desta pagina. E todo numero ter o mesmo peso visual e a comparacao
   ficar por conta do leitor. Aqui cada celula deixa de ser numero solto e vira
   REGUA DA PROPRIA COLUNA: barra normalizada entre o pior e o melhor DOS
   TREZE. Ouro so no lider da coluna, vermelho so na lanterna, cinza no miolo.
   Sao 195 celulas de metrica e ~26 tem cor -- o olho acha o padrao antes de
   ler qualquer digito, e isso planilha nenhuma faz.
   A grade continua sendo <table> porque alinhamento de coluna E a
   comparabilidade: treze cartoes soltos jogariam fora o motivo de um ranking
   existir. */

/* -------------------------------------------------------- a celula-regua */
.gg{display:block;min-width:38px;text-align:left}
.gg .n{display:block;font:600 13.5px/1.05 var(--cond);font-variant-numeric:tabular-nums;color:var(--txt)}
.gg .tk{display:block;height:5px;margin-top:5px;border-radius:var(--rp);
  background:var(--barneutral);overflow:hidden}
.gg .tk i{display:block;height:100%;border-radius:var(--rp);background:#4E5866}
.gg .s{display:block;margin-top:4px;font:500 9.5px/1.2 var(--body);color:var(--dim);
  font-variant-numeric:tabular-nums}
/* cor e informacao, nao decoracao: so as duas pontas de cada coluna. O ouro usa
   --gold-3 (degrau escuro) como bisel do gradiente, nunca como texto. */
.gg.led .n{color:var(--gold-2)}
.gg.led .tk i{background-image:linear-gradient(90deg,var(--gold-3),var(--gold-2))}
.gg.lan .n{color:var(--red)}
.gg.lan .tk i{background:rgba(235,86,91,.6)}
/* colunas sem podio: volume nao e virtude (jogos) e levar dano nao e merito
   nem defeito (dano sofrido). Elas tem regua, nao tem primeiro lugar. */
.gg.neu .n{color:var(--mut)}
.gg.neu .tk i{background:#39424E}

/* ------------------------------------ o esqueleto perde a cara de planilha */
/* borda por linha some (vira zebra de 2%), 19 filetes verticais viram 5 --
   um em cada fronteira de familia. Divisores EXATOS: as familias sao
   conhecidas, entao o filete e marcado por data-fs, nunca por :nth-child. */
#tbl thead th,#tbl tbody td{text-align:left}
/* o entrelinhado do <th> e o que decide a largura da coluna quando o dado e
   curto: .14em em 10 caracteres custa 13px por coluna, 19 vezes. .07em
   continua legivel em caixa alta e devolve a tabela inteira para dentro da
   caixa de 1253px. */
#tbl thead th{padding:6px 6px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
#tbl tbody td{padding:8px 6px;border-bottom:0;vertical-align:top}
#tbl tbody tr:nth-child(even){background:color-mix(in srgb,#fff 2%,var(--card))}
/* o spine e opaco por obrigacao (sticky). Se a zebra nao for repintada nele,
   as duas colunas fixas ficam lisas enquanto o resto pisca. */
#tbl .tbox.spine tbody tr:nth-child(even) td[data-k="rank"],
#tbl .tbox.spine tbody tr:nth-child(even) td[data-k="gameName"]{
  background:color-mix(in srgb,#fff 2%,var(--card))}
#tbl tbody tr:hover{background:var(--card2)}
#tbl .tbox.spine tbody tr:hover td[data-k="rank"],
#tbl .tbox.spine tbody tr:hover td[data-k="gameName"]{background:var(--card2)}
#tbl [data-fs]{border-left:1px solid var(--line)}
/* o nome cabe em 176px porque short() ja tira o prefixo "UDA ". O rank fica em
   52px -- e ele que o left:52px do spine mede, entao NAO mexer nos dois. */
#tbl .tbox.spine th[data-k="gameName"],#tbl .tbox.spine td[data-k="gameName"]{
  width:176px;min-width:176px}
#tbl .pl{min-width:120px;gap:9px}
#tbl .pl img{width:30px;height:30px}
#tbl .eloc{min-width:88px;gap:7px}
#tbl .eloc img{width:22px;height:22px}
#tbl .eloc .b{font-size:10px}
#tbl td[data-k="score"] .pill{font-size:12.5px;padding:5px 9px}

/* ------------------------- cabecalho de familia: 19 colunas viram 6 blocos */
/* E o cabecalho de grupo que paga o <th> curto: sob SOBREVIVENCIA, "sofrido"
   basta. O nome inteiro nao se perde -- vai em data-l, que e o rotulo que a
   gaveta do celular ja escreve. Um dado, dois nomes. */
#tbl thead tr.ghr th{position:sticky;top:0;z-index:5;height:32px;
  background:var(--card2);padding:9px 7px 5px;border-bottom:0;cursor:default;
  font:700 9px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#tbl thead tr.ghr th[data-fam]{color:var(--fam,var(--mut))}
#tbl thead tr.ghr th[data-fam]::after{content:"";display:block;height:2px;
  margin:6px 10px 0 0;border-radius:2px;
  background-image:linear-gradient(90deg,var(--fam,var(--line)),transparent)}
/* sticky nao empilha sozinho: sem o top:32px as duas linhas do thead colidem
   na primeira rolagem vertical. O 32 e a altura travada da linha de familia. */
#tbl thead tr.chr th{top:32px}
#tbl .tbox.spine thead tr.chr th[data-k="rank"],
#tbl .tbox.spine thead tr.chr th[data-k="gameName"]{top:32px}

/* --------------------------------------------- o podio entra na tabela */
/* 1o, 2o e 3o param de ser "linha 1, 2 e 3". REGRA DE OURO: o degrade e
   background-IMAGE. O atalho `background:` resetaria o background-clip para
   border-box e o numeral viraria uma barra dourada solida. */
.rnk.md{font:700 20px/1 var(--cond);width:auto;color:transparent;
  -webkit-background-clip:text;background-clip:text}
.rnk.md1{background-image:linear-gradient(180deg,var(--gold-1),var(--gold-2) 54%,var(--gold-3))}
.rnk.md2{background-image:linear-gradient(180deg,var(--m2a),var(--m2b) 54%,var(--m2c))}
.rnk.md3{background-image:linear-gradient(180deg,var(--m3a),var(--m3b) 54%,var(--m3c))}
/* metal so no bisel do # e no anel do retrato: tres faixas douradas inteiras
   viram enfeite, e enfeite nao e hierarquia */
tr[data-md="1"]{--mdc:var(--gold-2)}
tr[data-md="2"]{--mdc:var(--m2b)}
tr[data-md="3"]{--mdc:var(--m3b)}
#tbl tbody tr[data-md] td[data-k="rank"]{box-shadow:inset 3px 0 0 0 var(--mdc)}
#tbl tbody tr[data-md] .pl img{border-color:var(--mdc)}
/* o selo do nome: a manchete que a tabela nunca deu -- de quantas das 13
   metricas com podio esse jogador e o primeiro. Quem nao lidera nenhuma nao
   ganha selo vazio: selo que todo mundo tem nao e manchete. */
.oz{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:var(--rp);
  font:700 9.5px/1.3 var(--body);letter-spacing:.05em;white-space:nowrap;
  color:var(--gold-1);background-color:rgba(200,170,110,.14);
  box-shadow:inset 0 0 0 1px rgba(200,170,110,.42)}

/* ============================================ A TABELA QUE VIRA CARTÃO
   Uma mesa de 19 colunas mede 1756px. Num celular de 375px sobram 335px de
   caixa: 1421px de dado atras de uma rolagem que nao avisa que existe e que
   perde o nome do jogador no primeiro centimetro. Rolagem cega nao e
   responsividade -- e a tabela de desktop com uma janelinha.

   A saida NAO e gerar outro HTML (dois geradores desincronizam em uma semana).
   O <table> continua sendo UM so: ordena, clica, e lido. O que muda e COMO as
   celulas se arrumam. Cada <td> passa a carregar data-k (que metrica e) e
   data-l (como ela se chama), e o CSS usa esses dois atributos para montar a
   grade do cartao e escrever o rotulo que o <thead> deixou de dar.

   E um cartao com 19 campos e tao ruim quanto a rolagem. Por isso o cartao tem
   ROSTO (quem e, quanto vale, joga bem?) e GAVETA (as metricas finas, atras de
   um toque). A 20a coluna e a regua de ordenacao: ordenar por uma metrica da
   gaveta PROMOVE aquele numero para o rosto. */

/* --modo e o limiar COMPARTILHADO com o JS. Mora no #app -- que existe sempre e
   nunca fica escondido -- porque o JS precisa perguntar "estou em cartao?"
   mesmo quando a tabela em questao esta dentro de um <details> fechado. Um
   matchMedia no JS mediria o VIEWPORT enquanto o CSS mede o CONTAINER, e
   erraria pela largura do padding. Um numero, um lugar. */
#app{--modo:mesa}
[data-k="_go"]{display:none}
.tsort{display:none}
.nshort,.cpsub{display:none}

/* ------------------------------------------- spine fixo (acima de 700px) */
/* Entre 700 e 1180 a mesa de 1756px ainda esconde ~900px. As colunas de
   identidade param de rolar. As larguras sao TRAVADAS de proposito: sticky com
   left calculado a partir de coluna elastica desalinha em silencio. ATENCAO: se
   COLS ganhar uma coluna antes de gameName, o left:52px daqui sai do lugar. */
.tbox.spine th[data-k="rank"],.tbox.spine td[data-k="rank"]{
  position:sticky;left:0;z-index:4;width:52px;min-width:52px;background:var(--card)}
.tbox.spine th[data-k="gameName"],.tbox.spine td[data-k="gameName"],
.tbox.spine th[data-k="jogador"],.tbox.spine td[data-k="jogador"]{
  position:sticky;left:52px;z-index:4;width:208px;min-width:208px;background:var(--card);
  box-shadow:14px 0 14px -14px rgba(0,0,0,.9)}
.tbox.spine thead th[data-k="rank"],.tbox.spine thead th[data-k="gameName"],
.tbox.spine thead th[data-k="jogador"]{z-index:6;background:var(--card2)}
.tbox.spine tbody tr:hover td[data-k="rank"],
.tbox.spine tbody tr:hover td[data-k="gameName"],
.tbox.spine tbody tr:hover td[data-k="jogador"]{background:var(--card2)}

/* -------------------------------------------- a regua de ordenacao (.tsort) */
/* Sem <thead> no celular nao ha como ordenar, e sem ordenacao um ranking morre.
   Isto e rolagem, sim -- mas rolagem de CONTROLE: rotulada, curta e feita de
   fichas que parecem botao. O rotulo fixo a esquerda e a mascara de fade a
   direita existem para ela nao ser lida como mais uma tabela fugindo da tela. */
.tsort{align-items:center;gap:10px;margin:0 0 12px;min-width:0}
.tsl{flex:0 0 auto;font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tsf{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;padding:2px 24px 2px 0;
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
.tsf::-webkit-scrollbar{display:none}
.tsc{flex:0 0 auto;appearance:none;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:var(--card2);color:var(--mut);
  border-radius:var(--rp);padding:7px 12px;font:600 11.5px/1 var(--body)}
.tsc:hover{color:var(--txt)}
.tsc[aria-pressed="true"]{background:var(--teal-s);border-color:rgba(10,200,185,.42);color:var(--teal)}

/* ---------------------------------------------------- a matriz vira lista */
/* A matriz 13x13 nao estoura: ela IMPLODE. Com table-layout:fixed cada celula
   fica com 6,1px de largura e 42px de altura -- o "62%" e o numero de partidas
   somem, e ninguem reclamou porque o navegador espreme em silencio. No celular
   a unica pergunta que se faz a uma matriz de sinergia e "quem funciona junto,
   quem afunda junto", e isso e uma LISTA ORDENADA, nao uma grade. */
.mxlist{display:none}
.mxhd{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
  color:var(--teal);margin:4px 0 2px}
.mxhd.bad{color:var(--red);margin-top:18px}
/* em uma linha unica sobram ~80px para dois nomes e eles quebram em tres
   linhas. A dupla passa a ocupar duas faixas: quem e em cima, quanto rende
   embaixo -- os avatares seguram a coluna da esquerda nas duas. */
.duo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"im nm pi" "im bar st";column-gap:11px;row-gap:7px;padding:10px 8px}
.duo .ims{grid-area:im;align-self:center}
.duo .nm{grid-area:nm;font-size:12px;line-height:1.3;align-self:center}
.duo .bar{grid-area:bar;align-self:center}
.duo .st{grid-area:st;align-self:center}
.duo .pill{grid-area:pi;align-self:center;justify-self:end}
/* barra DIVERGENTE ancorada em 50%: para a direita quem vence junto, para a
   esquerda quem afunda junto. Um trilho comum nao distingue 51% de 92%. */
.duo .bar{position:relative;height:9px;border-radius:3px;background:var(--card3)}
.duo .bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line);z-index:2}
.duo .bar i{position:absolute;top:0;bottom:0;border-radius:2px}
.duo .bar i.up{left:50%;background:var(--teal)}
.duo .bar i.dn{right:50%;background:var(--red)}
/* amostra pequena: a lista ordenada expoe o 100%-em-3-jogos que a grade
   escondia. Em vez de esconder de novo, a linha admite que e ruido. */
.duo.thin{opacity:.6}
.mxmid>summary,.mxfull>summary{display:none}

/* ================================================ MODO CARTÃO (<=700px) */
@container content (max-width:700px){
  #app{--modo:cartao}
  .tsort{display:flex}

  .tbox.cards{overflow:visible;border:0;border-radius:0;background:none;background-image:none}
  /* o spine nao existe em modo cartao: nao ha para onde rolar */
  .tbox.cards th[data-k],.tbox.cards td[data-k]{position:static!important;
    width:auto!important;min-width:0!important;box-shadow:none!important}

  .tbox.cards table{display:block;width:100%;border-collapse:separate;border-spacing:0}
  .tbox.cards thead{display:none}
  .tbox.cards tbody{display:grid;gap:8px}
  .tbox.cards tbody tr{position:relative;display:grid;column-gap:8px;align-items:start;
    padding:10px 12px 18px;background:var(--card2);border:1px solid var(--line);
    border-radius:var(--rs);box-shadow:var(--bevel);cursor:pointer;transition:border-color .16s}
  .tbox.cards tbody tr:hover{background:var(--card2);border-color:#2C3540}
  .tbox.cards tbody td{display:block;padding:0;border:0;text-align:left;min-width:0;white-space:normal}

  /* o puxador. Absoluto de proposito para NAO virar item da grade e nao gastar
     uma faixa inteira de altura em treze cartoes; o padding-bottom da linha e
     que reserva a fatia dele. */
  .tbox.cards tbody tr::after{content:"";position:absolute;right:14px;bottom:10px;
    width:7px;height:7px;border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);
    transform:rotate(45deg);transition:transform .16s var(--e);opacity:.7}
  .tbox.cards tbody tr.open::after{transform:rotate(-135deg)}

  /* a gaveta: rotulo a esquerda, valor a direita. Sem grid-area de proposito --
     o auto-placement enfileira os pares depois das faixas nomeadas e ocupa a
     faixa kv quando ela esta vazia (ordenacao por coluna do rosto). */
  /* a regra base [data-k="_go"]{display:none} perde para o display:block que o
     modo cartao da a toda celula -- aqui ela volta com a especificidade certa */
  .tbox.cards tbody td[data-drawer],.tbox.cards tbody td[data-k="_go"]{display:none}
  .tbox.cards tr.open>td[data-drawer]{display:flex;align-items:baseline;justify-content:space-between;
    gap:8px;grid-column:span 3;padding:7px 0 6px;border-bottom:1px solid var(--line2);
    font-size:12.5px;white-space:nowrap}
  .tbox.cards tr.open>td[data-drawer]::before{content:attr(data-l);color:var(--dim);
    font:500 11px/1.2 var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* a metrica ORDENADA sobe para o rosto mesmo com a gaveta fechada: e assim
     que um cartao de 7 campos responde por uma tabela de 19 */
  .tbox.cards td[data-on]{display:flex!important;align-items:baseline;justify-content:space-between;
    gap:8px;grid-area:kv;margin-top:10px;padding:7px 10px!important;border:0!important;
    border-radius:8px;background:var(--teal-s);font-size:12.5px;white-space:nowrap}
  .tbox.cards td[data-on]::before{content:attr(data-l);color:var(--teal);
    font:600 10px/1 var(--body);letter-spacing:.12em;text-transform:uppercase}

  /* o destino explicito, no pe da gaveta: tocar na linha ABRE; ir para outra
     pagina passa a ser escolha, nao efeito colateral do dedo */
  .tbox.cards tr.open>td[data-k="_go"]{display:block;grid-column:1/-1;margin-top:12px;
    padding:10px;text-align:center;border:1px solid var(--line);border-radius:8px;
    font:600 11.5px/1 var(--body);color:var(--teal)}

  /* ---------------------------------------- ROSTO do cartão de RANKING */
  #tbl .tbox.cards tbody tr{
    grid-template-columns:repeat(6,minmax(0,1fr));
    grid-template-areas:
      "rk who who who sc sc"
      "rk el  el  el  sc sc"
      "jg jg  vi  vi  kd kd"
      "kv kv  kv  kv  kv kv"}
  #tbl .tbox.cards td[data-k="rank"]{grid-area:rk}
  #tbl .tbox.cards td[data-k="gameName"]{grid-area:who}
  #tbl .tbox.cards td[data-k="elo"]{grid-area:el;margin-top:5px}
  #tbl .tbox.cards td[data-k="games"]{grid-area:jg}
  #tbl .tbox.cards td[data-k="winrate"]{grid-area:vi}
  #tbl .tbox.cards td[data-k="kda"]{grid-area:kd}
  #tbl .tbox.cards td[data-k="score"]{grid-area:sc;justify-self:end;text-align:right}
  #tbl .tbox.cards td[data-k="games"],#tbl .tbox.cards td[data-k="winrate"],
  #tbl .tbox.cards td[data-k="kda"]{margin-top:8px;padding-top:8px;border-top:1px solid var(--line2)}
  #tbl .tbox.cards td[data-k="games"]::before,#tbl .tbox.cards td[data-k="winrate"]::before,
  #tbl .tbox.cards td[data-k="kda"]::before{content:attr(data-l);display:block;
    font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #tbl .tbox.cards .rnk{font-size:17px;width:auto}
  #tbl .tbox.cards .pl>div,#tbl .tbox.cards .eloc>div{min-width:0}
  #tbl .tbox.cards .pl .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* o retrato encolhe porque no cartao ele nao esta competindo com dezoito
     colunas por atencao -- quem e ja esta escrito ao lado, em corpo maior */
  #tbl .tbox.cards .pl img{width:30px;height:30px}
  #tbl .tbox.cards .eloc img{width:22px;height:22px}
  /* ---- MODO CARTÃO: a PISTA no celular ----
     as regras de #tbl la em cima tem peso de ID e ganhariam do modo cartao por
     especificidade, nao por ordem. Entao o cartao repete o seletor com o mesmo
     #tbl: mesma forca, e vence por vir depois. */
  #tbl .tbox.cards thead{display:none}
  #tbl .tbox.cards tbody td{padding:0;border-bottom:0}
  #tbl .tbox.cards tbody tr:nth-child(even){background:var(--card2)}
  #tbl .tbox.cards [data-fs]{border-left:0}
  #tbl .tbox.cards tbody tr[data-md] td[data-k="rank"]{box-shadow:none}
  /* #tbl deixou de emitir .wr: toda metrica virou .gg (numero + regua). No
     rosto do cartao a regua continua; dentro da gaveta ela sai, porque a
     gaveta e uma lista de pares rotulo-valor e barra ali seria ruido. */
  #tbl .tbox.cards .gg{min-width:0}
  #tbl .tbox.cards .gg .n{font-size:15px}
  #tbl .tbox.cards .gg .tk{max-width:96px}
  #tbl .tbox.cards tr.open>td[data-drawer] .gg,
  #tbl .tbox.cards td[data-on] .gg{display:flex;align-items:baseline;gap:8px;text-align:right}
  #tbl .tbox.cards tr.open>td[data-drawer] .gg .tk,
  #tbl .tbox.cards td[data-on] .gg .tk{display:none}
  #tbl .tbox.cards tr.open>td[data-drawer] .gg .n,
  #tbl .tbox.cards td[data-on] .gg .n{font-size:13px}
  #tbl .tbox.cards tr.open>td[data-drawer] .gg .s,
  #tbl .tbox.cards td[data-on] .gg .s{margin-top:0}
  /* o selo cai para baixo do nome: ao lado, num cartao de 375px, ele empurrava
     o nome para a reticencia */
  #tbl .tbox.cards .oz{display:inline-block;margin:5px 0 0}

  /* tablet: duas colunas de cartao. Corta pela metade a altura que o modo
     cartao custa exatamente na faixa em que ele e mais caro. */
  @container content (min-width:520px){
    .tbox.cards tbody{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  }

  /* --------------------------------------------- a matriz em modo lista */
  .mxlist{display:block}
  .mxmid>summary,.mxfull>summary{display:block;cursor:pointer;list-style:none;
    margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rs);
    background:var(--card2);font:600 11.5px/1 var(--body);color:var(--teal);text-align:center}
  .mxmid>summary::-webkit-details-marker,.mxfull>summary::-webkit-details-marker{display:none}
  /* a grade nao se perde: so deixa de ser o padrao. Aqui ela volta a ter
     largura honesta (table-layout:auto + celula de 46px) e uma ancora fixa. */
  .mxfull .tbox{padding:12px!important}
  .mxfull table.mx{table-layout:auto}
  .mxfull .mx-c{min-width:46px}
  .mxfull .mx-corner,.mxfull .mx-r{width:96px;min-width:96px}
  .mxfull .mx-r span{font-size:10.5px;margin-left:6px}
  .mxfull .mx-r img{width:22px;height:22px}
}

/* =============================================== A FITA (SEQUÊNCIAS)
   Sequencia e CONTAGEM de partidas seguidas: inteiro, pequeno, comparavel.
   Barra continua mentiria (nao existe 4,5 vitorias seguidas) e quatro colunas
   de digito nao deixam comparar ninguem com ninguem. Cada jogador vira uma
   FITA de tijolos -- um tijolo, uma partida -- ancorada no zero: derrota para a
   esquerda, vitoria para a direita. A regua e UMA SO para o grupo inteiro
   (--n = o maior recorde de todos), senao cada linha teria a sua e a
   comparacao evaporava.
   O segundo dado -- a sequencia de AGORA -- entra sem custar altura nenhuma:
   sao os MESMOS tijolos, acesos a partir do centro. Recorde = tijolo vazado,
   agora = tijolo solido. Duas leituras, uma linha. */
.fita,.hl{--who:200px}
.fita{padding:0 24px 20px}
.fita-ord,.hl-ord{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 14px}

.fita-r{display:grid;grid-template-columns:var(--who) minmax(0,1fr) 96px;
  align-items:center;column-gap:14px;padding:5px 0;min-height:40px}
/* o conjunto numero-trilha-numero tem TETO: com os 821px livres de um card
   inteiro cada tijolo virava uma laje de 43px e a fita deixava de parecer
   contagem de partidas. Teto pelo numero de casas (--n) e nao por pixel fixo:
   se o recorde do grupo crescer, a regua cresce e o tijolo nao muda. */
.fita-x{display:grid;grid-template-columns:22px minmax(0,1fr) 22px;column-gap:9px;
  align-items:center;width:100%;max-width:calc(var(--n)*56px + 60px);margin:0 auto}
.fita-b .fita-r+.fita-r{border-top:1px solid var(--line2)}
.fita-hd{padding:0 0 8px;min-height:0;border-bottom:1px solid var(--line)}
.fita-hd .k{font:600 9.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.fita-hd .k.r{text-align:right}
/* 1fr auto 1fr e nao space-between: os dois rotulos tem larguras diferentes e o
   "0" tem de cair EM CIMA do trilho de metal, nao no meio do texto */
.fita-hd .ex{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  font:600 9.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.fita-hd .ex i{font-style:normal}
.fita-hd .ex i:last-of-type{text-align:right}
.fita-hd .ex b{font:700 12px/1 var(--cond);color:var(--gold-2);padding:0 8px}

.fita-w{display:flex;align-items:center;gap:10px;min-width:0}
.fita-w>div{min-width:0}
.fita-w img{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
.fita-w .a{font:600 13px/1.15 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fita-w .b{font:500 10.5px/1 var(--body);color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}

.fita-n{position:relative;font:700 15px/1 var(--cond);font-variant-numeric:tabular-nums}
.fita-n.d{color:var(--red)}
.fita-n.v{color:var(--teal);text-align:right}
/* dono do recorde do grupo: um filete GRAVADO, nao mais uma cor. background-image
   e nao o atalho `background` -- este arquivo ja pagou esse bug uma vez. */
.fita-n.rec::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;border-radius:2px;
  background-image:linear-gradient(90deg,var(--gold-3),var(--gold-1),var(--gold-3))}

.fita-t{display:grid;grid-template-columns:minmax(0,1fr) 3px minmax(0,1fr);align-items:center}
/* o zero e uma PECA de metal e nao um risco: e a ancora de leitura das 13 fitas */
.fita-t .z{height:22px;border-radius:2px;
  background-image:linear-gradient(180deg,var(--gold-3),var(--gold-2) 45%,var(--gold-3))}
/* repeat(var(--n),...) com --n conhecido. auto-fit aqui desalinharia os tijolos
   de uma linha para a outra, que e a unica coisa que faz a fita funcionar. */
.fita-s{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px}
.fita-s.d{padding-right:5px}
.fita-s.v{padding-left:5px}
.fita-s i{display:block;height:15px;border-radius:2px;background-color:rgba(255,255,255,.05)}
.fita-s.v i.on{background-image:linear-gradient(180deg,rgba(10,200,185,.30),rgba(10,200,185,.12));
  box-shadow:inset 0 0 0 1px rgba(10,200,185,.42)}
.fita-s.d i.on{background-image:linear-gradient(180deg,rgba(235,86,91,.30),rgba(235,86,91,.12));
  box-shadow:inset 0 0 0 1px rgba(235,86,91,.42)}
.fita-s.v i.liv{background-color:var(--teal);
  background-image:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 60%);
  box-shadow:0 0 9px rgba(10,200,185,.45),var(--bevel)}
.fita-s.d i.liv{background-color:var(--red);
  background-image:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0) 60%);
  box-shadow:0 0 9px rgba(235,86,91,.45),var(--bevel)}
.fita-r>.pill{justify-self:end;font-size:11px;padding:4px 9px;white-space:nowrap}
.fita-lg,.hl-note{margin:14px 0 0;font:500 11px/1.45 var(--body);color:var(--dim)}
/* entrada: as duas metades crescem A PARTIR DO ZERO, cada linha um pouco depois
   da anterior. E a mesma leitura do desenho, so que em movimento. */
.fita-s{transform-origin:100% 50%}
.fita-s.v{transform-origin:0 50%}
.rv .fita-b .fita-s{transform:scaleX(.04);opacity:0}
.rv.in .fita-b .fita-s{transform:none;opacity:1;
  transition:transform .5s var(--e),opacity .28s linear;transition-delay:calc(var(--i,0)*28ms)}

/* ====================================== HALTERES (JUNTO x SOZINHO)
   Dez colunas de numero para dizer "ele muda quando joga com a UDA" e o pior
   jeito possivel: o leitor subtrai de cabeca, uma linha por vez, e nao consegue
   comparar dois jogadores porque cada par vive na sua celula.
   HALTERE e nao SLOPE CHART: o slope precisa de UMA unidade e UMA escala para
   as duas colunas -- aqui sao seis metricas de unidades diferentes (%, razao,
   mortes, dano/min), e empilhar seis slopes ou normalizar tudo seria parede de
   grafico ou mentira. O haltere resolve com um eixo horizontal COMPARTILHADO:
   prata = sozinho, ouro = com a UDA, e o osso entre os dois E o delta
   (comprimento = tamanho, cor = se melhorou). Como todo mundo esta na mesma
   regua, da para ler o proprio jogador E comparar jogadores entre si -- coisa
   que a tabela nunca deixou fazer. */
.hl{padding:0 24px 20px}
.hl-lg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;
  font:500 11px/1 var(--body);color:var(--dim);margin:0 0 6px}
.hl-lg em{font-style:normal;color:var(--gold-2)}
.hl-lg i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.hl-lg i.s{background-color:var(--ink2);box-shadow:inset 0 0 0 2px var(--m2b)}
.hl-lg i.j{background-image:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 0 7px rgba(200,170,110,.5)}

.hl-r{display:grid;grid-template-columns:var(--who) minmax(0,1fr) 96px;
  align-items:center;column-gap:14px;padding:5px 0;min-height:44px}
.hl-rows .hl-r+.hl-r{border-top:1px solid var(--line2)}
.hl-hd{min-height:0;padding:0 0 6px;border-bottom:1px solid var(--line)}
.hl-hd .k{font:600 9.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.hl-hd .k.c{text-align:center}
.hl-hd .k.r{text-align:right}
.hl-w{display:flex;align-items:center;gap:10px;min-width:0}
.hl-w>div{min-width:0}
.hl-w img{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
.hl-w .a{font:600 13px/1.15 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl-w .b{font:500 10.5px/1 var(--body);color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}

.hl-t{position:relative;height:34px}
.hl-ax{position:relative;height:22px}
/* 24px de folga de cada lado: 0% e 100% do DADO caem dentro de .hl-in e nunca
   na borda da caixa -- senao o rotulo do ponto extremo sai cortado */
.hl-in{position:absolute;left:24px;right:24px;top:0;bottom:0}
.hl-t .rail{position:absolute;left:0;right:0;top:16px;height:2px;border-radius:2px;background-color:var(--barneutral)}
.hl-t .ref{position:absolute;top:10px;height:14px;width:1px;background-color:var(--line)}
.hl-t .bone{position:absolute;top:14px;height:6px;border-radius:3px;background-color:var(--mut)}
.hl-t .bone.up{background-color:var(--teal)}
.hl-t .bone.dn{background-color:var(--red)}
.hl-t .dot{position:absolute;top:11px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);z-index:2}
.hl-t .dot.s{background-color:var(--ink2);box-shadow:inset 0 0 0 2px var(--m2b)}
.hl-t .dot.j{background-image:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  box-shadow:0 0 8px rgba(200,170,110,.55),var(--bevel)}
/* os dois rotulos ficam em ALTURAS diferentes: com delta pequeno os pontos quase
   se tocam e dois numeros na mesma linha viravam borrao */
.hl-t .vl{position:absolute;transform:translateX(-50%);white-space:nowrap;
  font:600 10px/1 var(--body);font-variant-numeric:tabular-nums}
.hl-t .vl.s{top:-1px;color:var(--m2b)}
.hl-t .vl.j{top:25px;color:var(--gold-2)}
/* o eixo NAO comeca no zero de proposito (com tudo entre 40% e 70% um eixo
   0-100 esmagaria os halteres num terco do trilho). Em troca as cinco marcas
   vem ESCRITAS: eixo cortado que se declara nao engana ninguem. */
.hl-ft{min-height:0;padding:2px 0 0}
.hl-ax .tk{position:absolute;top:7px;transform:translateX(-50%);
  font:500 9.5px/1 var(--body);color:var(--dim);font-variant-numeric:tabular-nums}
.hl-ax .tk::before{content:"";position:absolute;left:50%;top:-7px;width:1px;height:4px;background-color:var(--line)}
.hl-r>.pill{justify-self:end;font-size:11px;padding:4px 9px;white-space:nowrap}
.hl-falta{margin:14px 0 0;font-size:12px;color:var(--dim);
  padding-top:12px;border-top:1px solid var(--line2)}
.rv .hl-rows .hl-t .bone,.rv .hl-rows .hl-t .dot{opacity:0}
.rv.in .hl-rows .hl-t .bone,.rv.in .hl-rows .hl-t .dot{opacity:1;
  transition:opacity .34s linear;transition-delay:calc(var(--i,0)*26ms + 90ms)}

/* no container estreito a coluna do nome deixa de valer 200px, e abaixo de
   560px o haltere e a fita passam a ter DUAS linhas: quem joga em cima, a
   regua embaixo. Nenhum dos dois rola de lado em 375px. */
@container content (max-width:820px){
  .fita,.hl{--who:150px}
  .fita{padding:0 14px 16px}
  .hl{padding:0 14px 16px}
  .fita-r,.hl-r{column-gap:9px;grid-template-columns:var(--who) minmax(0,1fr) 74px}
}
@container content (max-width:560px){
  /* colocacao EXPLICITA e nao auto-placement: com um filho de grid-column:1/-1
     no meio, o auto-placement empurraria a pilula para uma terceira fila sozinha */
  .fita-r,.hl-r{grid-template-columns:minmax(0,1fr) auto;row-gap:8px;padding:9px 0}
  .fita-r>.fita-w,.hl-r>.hl-w{grid-column:1;grid-row:1}
  .fita-r>.pill,.hl-r>.pill{grid-column:2;grid-row:1}
  .fita-r>.fita-x,.hl-r>.hl-t{grid-column:1/-1;grid-row:2}
  .hl-ft{grid-template-columns:minmax(0,1fr)}
  .hl-ft>span{display:none}
  .hl-ft>.hl-ax{grid-column:1/-1;grid-row:1}
  .fita-hd,.hl-hd{display:none}
  .fita-w img,.hl-w img{width:26px;height:26px}
  .fita-w .a,.hl-w .a{font-size:12.5px}
  .fita-x{max-width:none}
  .fita-n{font-size:13px}
  .hl-in{left:20px;right:20px}
  .hl-ax .tk{font-size:9px}
  .fita-ord,.hl-ord{flex-wrap:nowrap;overflow-x:auto;padding:2px 26px 2px 0;scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent);
    mask-image:linear-gradient(to right,#000 calc(100% - 26px),transparent)}
  .fita-ord::-webkit-scrollbar,.hl-ord::-webkit-scrollbar{display:none}
  .fita-ord .tsc,.hl-ord .tsc{flex:0 0 auto}
}

/* =========================================================== GRÁFICOS */
.chart{display:block;width:100%}
/* medidor e radar escalam com o card em vez de travar em 260px/196px. O teto de
   ALTURA (e nao de largura) e o que impede um card largo de virar poster: o SVG
   letterboxa sozinho dentro da caixa e continua centrado. */
.gauge{display:block;width:100%;height:auto;max-height:clamp(200px,23vw,320px);margin:2px auto 0}
/* o arco nunca vai encher um card de 620px sem virar poster: em vez de esticar o
   desenho, o rodape de tres leituras ocupa a largura que sobra dos lados. */
.gmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line2)}
.gmeta>div{text-align:center;min-width:0}
.gmeta .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.18em}
.gmeta .v{font:700 20px/1 var(--cond);margin-top:6px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdr{display:block;width:100%;height:auto;max-height:270px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:middle}
svg text{font-family:var(--body)}
/* entrada dos graficos: barra cresce da base, traco se desenha, area aparece.
   transform-box:fill-box porque em SVG a origem padrao e a do viewBox, nao a do
   proprio elemento -- sem isso a barra cresce a partir do canto da tela. */
.gbar{transform-box:fill-box;transform-origin:50% 100%;animation:barGrow .5s var(--e) both}
.gfade{animation:fadeIn .8s var(--e) both}
.gdraw{animation:arcDraw .9s var(--e) both}
.gpop{transform-box:fill-box;transform-origin:50% 50%;animation:pop .45s var(--e-pop) both}

/* ===================================================== EVOLUÇÃO: A GRADE
   Cinco cartões de largura inteira, um gráfico solitário em cada, davam 3993px
   de página a 1600 e 4540px a 1920 -- e como o SVG escala com a largura do
   cartão, o mesmo gráfico media 457px numa tela e 577px na outra. A grade de 12
   tem divisores exatos (6+6 e 12), responde ao .content e nunca usa auto-fit: o
   número de cartões é conhecido em tempo de render, então a fila órfã não pode
   existir (quem garante isso é o meia[]/inteiro[] do pEvolucao). */
.egrid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.egrid>*{grid-column:span 6}
.egrid>.wide{grid-column:span 12}
/* 1040px é onde meia coluna cai abaixo de ~470px reais: daí para baixo um
   gráfico de linha com 11 séries deixa de ser gráfico e vira tinta. */
@container content (max-width:1040px){.egrid>*{grid-column:span 12}}

/* A CAIXA DE PLOTAGEM. O SVG dela nasce DEPOIS do innerHTML, com a largura real
   medida (ligarGraficos): é isso que faz a escala do viewBox ser sempre 1 --
   11px é 11px e a altura que eu peço é a altura em pixels que aparece.
   O min-height é o que impede o salto de layout entre o primeiro quadro
   (caixa vazia) e a pintura. */
.plot{position:relative;min-height:226px}
.plot.leg{min-height:284px}
.plot>svg{display:block;width:100%;height:auto}
/* o mapa de horários tem 24 colunas: no celular ele ROLA na horizontal em vez de
   encolher para tiras de 21px. É o único gráfico da página que não cabe em 375px. */
.plot.hm{min-height:250px;overflow-x:auto;overflow-y:hidden}
.plot.hm>svg{min-width:620px}

/* MARCA D'ÁGUA. O brasão entra UMA vez no documento (crestDefs, a partir da const
   CREST) e cada gráfico só aponta <use href="#uda-crest">: o data URI tem 103 KB
   e a página repinta a cada clique num chip de jogador. Dessaturado, clareado e
   com o contraste comprimido, o brasão inteiro colapsa numa faixa de 26..31 sobre
   o card #161B22 (22) -- sempre mais claro que o card e sempre mais escuro que a
   própria gridline var(--line) #232A33 (35). Fica ABAIXO do grid na hierarquia:
   não existe leitura em que ele dispute com a série. */
.wm{pointer-events:none;filter:grayscale(1) brightness(1.55) contrast(.5)}

/* LEGENDA FORA DO SVG. Ela morava dentro, numa coluna de 142 unidades reservada
   à direita: comia 13% da largura útil e, com 11 jogadores empilhados a 20u de
   distância, exigia ~240u de altura mínima de plotagem só para caber -- era ela
   que segurava o H:410, não o dado. Em HTML ela quebra em linhas, some quando há
   um jogador só e devolve a largura inteira ao desenho. */
.glegend{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--line2);font-size:11.5px;color:var(--dim)}
.glegend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.glegend i{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.glegend b{color:var(--ink2);font-weight:600}
.glegend b.up{color:var(--teal)} .glegend b.dn{color:var(--red)}

/* O AVISO DE FILA SEM SÉRIE. Em 'normal' e 'aram' o payload não traz evolution:
   a página desenhava 1 dos 5 gráficos e ficava calada sobre os outros 4. Ele é um
   cartão IRMÃO, de meia largura, e não um .empty centralizado no vazio -- assim a
   linha 6+6 fecha e a página continua sendo uma grade. */
.evnote{position:relative;overflow:hidden;display:flex;flex-direction:column;
  justify-content:center;gap:11px}
.evnote>*{position:relative;z-index:1}
.evnote .eyebrow{color:var(--gold-3)}
.evnote h3{margin:0;font:600 15.5px/1.25 var(--disp);color:var(--txt)}
.evnote p{margin:0;font-size:13px;line-height:1.62;color:var(--mut);max-width:54ch}
.evnote p b{color:var(--gold-1);font-weight:600}
.evnote .qgo{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
/* o mesmo brasão do fundo dos gráficos, no mesmo tom e pela mesma referência: o
   cartão de aviso é feito do mesmo material dos cartões que ele está explicando. */
.evnote>.wmcard{position:absolute;z-index:0;inset:auto -34px -46px auto;
  width:210px;height:210px;opacity:.06;pointer-events:none;
  filter:grayscale(1) brightness(1.55) contrast(.5)}

/* =========================================================== PRÊMIOS
   Os dois halls moram no bloco "AS DUAS SALAS", depois do pódio: eles são
   feitos do mesmo material (.metal, .engraved, .artbox) e precisam nascer
   DEPOIS dele -- .noart::before tem que continuar vencendo o quadro vazio. */

/* ------------------------------------------------------- os afundados */
.sunk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@container content (max-width:820px){.sunk{grid-template-columns:1fr}}
.sk{background:var(--card2);border:1px solid rgba(229,72,77,.28);border-radius:var(--r);
  padding:18px;position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--red);opacity:.5}
.sk-h{display:flex;align-items:center;gap:12px}
.sk-h .pos{font:700 30px/1 var(--disp);color:rgba(229,72,77,.35);font-variant-numeric:tabular-nums;flex:0 0 auto}
.sk-h img{width:48px;height:48px;border-radius:50%;border:2px solid rgba(229,72,77,.45);flex:0 0 auto}
.sk-h .who{min-width:0;flex:1}
.sk-h .nm{font:600 15px/1.2 var(--disp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-h .el{font-size:11.5px;color:var(--dim);margin-top:3px}
.sk-h .sc{font:700 26px/1 var(--disp);color:var(--red);font-variant-numeric:tabular-nums;flex:0 0 auto}
.sk-why{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.sk-gap{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.sk-gap .lbl{font-size:10.5px;color:var(--dim);display:flex;justify-content:space-between}
.sk-gap .track{height:6px;border-radius:var(--rp);background:var(--barneutral);margin-top:7px;overflow:hidden;position:relative}
.sk-gap .track i{display:block;height:100%;border-radius:var(--rp);background:var(--red)}
.sk-gap .track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--gold);text-decoration:none}
.sk-worst{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.sk-worst img{width:32px;height:32px;border-radius:8px;flex:0 0 auto}
.sk-worst .l{font-size:10.5px;color:var(--dim)}
.sk-worst .v{font-size:12.5px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}

/* =========================================================== JOGADORES */
/* min() no minmax: sem ele a faixa de 452px vira um PISO e o grid transborda em
   qualquer container mais estreito, em vez de encolher */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(452px,100%),1fr));gap:16px}
/* o cartao e o proprio container do seu miolo -- ele nao sabe o tamanho da tela,
   sabe o tamanho que a grade lhe deu */
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  container-type:inline-size;container-name:pcard}
.pc-h{display:flex;gap:13px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.pc-h img{width:50px;height:50px;border-radius:50%;border:2px solid var(--line)}
.pc-h .nm{font:600 16px/1.2 var(--disp)}
.pc-h .tg{font-size:11.5px;color:var(--dim);margin-top:3px}
.pc-h .rt{margin-left:auto;text-align:right}
.pc-h .rt .s{font:700 26px/1 var(--disp);font-variant-numeric:tabular-nums}
.pc-h .rt .l{font-size:10.5px;color:var(--dim);margin-top:4px}
.avgl{padding:13px 20px;background:var(--card2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.avgl b{color:var(--txt);font-variant-numeric:tabular-nums}
/* o radar e o elemento mais informativo do cartao e era o menor: coluna travada em
   196px. Agora ele cresce junto com o cartao (o max-width inline do SVG e liberado). */
.pc-b{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,1.2fr);gap:20px;padding:20px}
.pc-b>div>svg{max-width:none!important}
@container pcard (max-width:430px){.pc-b{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;align-content:start}
.mini div{display:flex;justify-content:space-between;font-size:12.5px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
.mini span{color:var(--dim)}
.mini b{font-variant-numeric:tabular-nums}
.form{display:flex;gap:4px;padding:0 20px 16px;flex-wrap:wrap}
.form i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:600 10px/1 var(--body);font-style:normal}
.form i.w{background:var(--teal-s);color:var(--teal)}
.form i.l{background:var(--red-s);color:var(--red)}
.champs{padding:14px 20px 18px;border-top:1px solid var(--line)}
.champ{display:flex;align-items:center;gap:11px;padding:6px 0;font-size:12.5px}
.champ img{width:30px;height:30px;border-radius:8px;border:1px solid var(--line)}
.champ .cn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.champ .cg,.champ .ck{font-size:11.5px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.champ .cg{width:56px} .champ .ck{width:56px}
.champ .cw{font-weight:600;width:44px;text-align:right;font-variant-numeric:tabular-nums}

/* =========================================================== MATRIZ */
/* width:auto deixava ~660px de fundo morto a direita da matriz. Com fixed as 14
   colunas dividem o espaco real do card e a celula ganha area util. */
table.mx{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
.mx th,.mx td{border:0}
.mx-corner{background:transparent!important;position:sticky;left:0;z-index:5;width:126px;min-width:126px;cursor:default}
.mx-h{padding:0 0 8px!important;text-align:center!important;vertical-align:bottom;background:transparent!important;border:0!important;cursor:default;min-width:0}
.mx-h span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font:500 10.5px/1 var(--body);color:var(--dim);max-height:80px}
/* o avatar no topo da coluna e o que amarra a coluna a linha: sem ele voce le o
   nome deitado de um lado e a foto do outro, e perde o cruzamento. */
.mx-h img{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);margin:0 auto 6px}
.mx-r{position:sticky;left:0;z-index:4;background:var(--card)!important;text-align:left!important;padding:0 10px 0 2px!important;border:0!important;cursor:default;width:126px;min-width:126px}
.mx-r img{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:inline-block;vertical-align:middle}
.mx-r span{font:500 11.5px/1 var(--body);margin-left:9px;vertical-align:middle}
.mx-c{text-align:center!important;padding:0!important;height:42px;min-width:0;background:var(--card2);
  border-radius:9px;vertical-align:middle;cursor:default}
.mx-c b{display:block;font:600 12px/1 var(--body);font-variant-numeric:tabular-nums}
.mx-c i{display:block;font:400 9.5px/1 var(--body);font-style:normal;opacity:.5;margin-top:2px}
.mx-self{background:var(--bg);color:var(--dim)}

/* barras horizontais (rotas, filas) */
.hbar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.hbar:last-child{border-bottom:0}
/* rotulo elastico: "Ranqueada Solo/Duo" nao cabia em 88px e vazava sobre a barra */
.hbar .hn{width:clamp(88px,18%,168px);flex:0 0 auto;font-size:12.5px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a trilha ganhou regua: tracinhos a cada 25% do maximo, para a barra parar de ser
   decoracao e virar escala. O 50% e mais forte porque e o limiar do card. */
.hbar .ht{flex:1;height:10px;border-radius:var(--rp);background:var(--barneutral);overflow:hidden;
  min-width:40px;position:relative;box-shadow:var(--bevel);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),rgba(255,255,255,.10) calc(25% - 1px) 25%)}
.hbar .ht i{display:block;height:100%;border-radius:var(--rp);position:relative;
  background:linear-gradient(90deg,color-mix(in srgb,var(--bc,var(--teal)) 55%,transparent),var(--bc,var(--teal)));
  animation:barW .6s var(--e) both}
/* so o `from`: sem `to` o navegador usa a largura inline como valor final,
   entao a animacao nao precisa saber o numero de cada barra */
@keyframes barW{from{width:0}}
.hbar .hq{width:46px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hbar .hs{width:40px;text-align:right;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* o feed das ultimas partidas (.mfeed/.mc) mora la embaixo, depois de
   .artbox/.art/.noart/.scrim -- a placa e feita desses componentes. */

/* melhor / pior partida no cartão do jogador */
.bw{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 16px}
@container pcard (max-width:430px){.bw{grid-template-columns:1fr}}
.bwc{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px;display:flex;gap:10px;align-items:center}
.bwc img{width:32px;height:32px;border-radius:8px;flex:0 0 auto}
.bwc .l{font-size:10.5px;color:var(--dim)}
.bwc .v{font-size:12.5px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.roles{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 16px}

/* =========================================================== LISTAS */
.lrow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lrow:last-child{border-bottom:0}
.lrow .ims{display:flex;flex:0 0 auto}
.lrow .ims img{width:30px;height:30px;border-radius:50%;border:2px solid var(--card)}
.lrow .ims img+img{margin-left:-11px}
/* o nowrap aqui cortava a lista de membros do quinteto com reticencias mesmo com
   1200px de card sobrando -- conteudo perdido por CSS, nao por falta de espaco */
.lrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.lrow .st{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}

/* =========================================================== REGRAS */
/* 78ch travado num card de 1600px deixava ~900px de card vazio a direita. O min()
   tira o transbordo; as colunas e que de fato ocupam a largura. */
.prose{max-width:min(78ch,100%)}
.prose-cols{columns:2 340px;column-gap:52px}
/* a Regras e o unico bloco longo o suficiente para colunas; o paragrafo solto da
   Ranking traz max-width inline e fica de fora por isso.
   columns por LARGURA (nao por contagem): o navegador decide quantas cabem e cada
   uma mantem a medida legivel, em vez de duas colunas gordas de 60ch+. */
@container content (min-width:1000px){
  .card>.prose:not([style]){max-width:none;columns:46ch;column-gap:52px;column-rule:1px solid var(--line2)}
}
.prose h3{font:600 16px/1.3 var(--disp);margin:30px 0 10px;color:var(--txt);break-after:avoid}
.prose h3:first-child{margin-top:0}
.prose ul,.prose .formula,.prose .wtable{break-inside:avoid}
.prose p{margin:0 0 12px;color:var(--mut)}
.prose li{margin-bottom:6px;color:var(--mut)}
.prose b{color:var(--txt)}
.prose code{background:var(--card2);border:1px solid var(--line);padding:2px 7px;border-radius:6px;font-size:12.5px;color:var(--teal)}
.formula{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--rs);
  padding:16px 20px;margin:18px 0;font:600 15px/1.4 var(--body);color:var(--txt);font-variant-numeric:tabular-nums}
.wtable{width:100%;max-width:420px;margin:16px 0}
.wtable .wrow{display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.wtable .wrow:last-child{border-bottom:0}
.wtable .wn{flex:1;font-size:13px}
.wtable .wb{width:120px;height:6px;border-radius:var(--rp);background:var(--barneutral);overflow:hidden}
.wtable .wb i{display:block;height:100%;border-radius:var(--rp);background:var(--gold)}
.wtable .wv{width:42px;text-align:right;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* ====================================================== TOOLTIP GLOBAL */
#tip{position:fixed;z-index:300;pointer-events:none;opacity:0;transform:translateY(4px);
  transition:opacity .12s,transform .12s;background:#0B0E13;border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.45;color:var(--txt);
  box-shadow:0 12px 34px rgba(0,0,0,.6);max-width:300px}
#tip.on{opacity:1;transform:translateY(0)}
#tip .tt{font-weight:600;font-size:12.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--mut);padding:2px 0}
#tip .tr b{color:var(--txt);font-variant-numeric:tabular-nums}
#tip .tk{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
#tip .ts{color:var(--dim);font-size:11px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}

/* faixas de hover nos gráficos de série: linha vertical só no que está sob o cursor */
.band rect{fill:transparent}
.band line{stroke:var(--gold);stroke-width:1;opacity:0;transition:opacity .1s}
.band:hover line{opacity:.55}
.band:hover rect{fill:rgba(255,255,255,.03)}
[data-tip]{cursor:default}

/* seletor de jogadores da aba Evolução */
.psel{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);
  border-radius:var(--rp);padding:5px 12px 5px 5px;font-size:12.5px;color:var(--mut);cursor:pointer;
  transition:.13s;user-select:none}
.pchip img{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.pchip:hover{border-color:var(--teal);color:var(--txt)}
.pchip[aria-pressed="true"]{background:var(--card3);color:var(--txt);font-weight:600}
.pchip .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.pchip[aria-pressed="false"]{opacity:.42}
.pbtn{appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--mut);
  border-radius:var(--rp);padding:6px 13px;font:500 12px/1 var(--body);cursor:pointer;transition:.13s}
.pbtn:hover{border-color:var(--teal);color:var(--txt)}

/* ------------------------------------------------ estados de hover gerais */
.card{transition:border-color .16s}
.card:hover{border-color:#2C3540}
.stat{transition:border-color .16s,transform .16s}
.stat:hover{border-color:#2C3540;transform:translateY(-2px)}
.sk{transition:border-color .16s,transform .16s}
.sk:hover{border-color:rgba(229,72,77,.55);transform:translateY(-2px)}
.aw{transition:border-color .16s,transform .16s}
.aw:hover{transform:translateY(-2px)}
.pc{transition:border-color .16s}
.pc:hover{border-color:#2C3540}
.hbar{transition:background .13s;border-radius:8px;padding-left:8px;padding-right:8px;margin:0 -8px}
.hbar:hover{background:var(--card2)}
.lrow{transition:background .13s;border-radius:8px;padding-left:8px;padding-right:8px;margin:0 -8px}
.lrow:hover{background:var(--card2)}
.champ{transition:background .13s;border-radius:7px;padding-left:7px;padding-right:7px;margin:0 -7px}
.champ:hover{background:var(--card2)}
.form i{transition:transform .12s}
.form i:hover{transform:scale(1.22)}
.form i[data-match]:hover{outline:1px solid var(--teal);outline-offset:1px}
.mx-c{transition:transform .12s,outline .12s}
.mx-c:hover{outline:2px solid var(--teal);outline-offset:1px;transform:scale(1.06)}
.aw-f .ru{transition:color .13s}
.aw-f .ru:hover{color:var(--txt)}
svg circle[data-tip],svg rect[data-tip]{transition:opacity .12s}
svg circle[data-tip]:hover{opacity:.75}

/* ================================================== VOCABULARIO "ARENA UDA"
   Base da linguagem visual, ainda sem uso no HTML: podio, halls e reliquias das
   fases seguintes montam em cima daqui. Ter um vocabulario unico e o que impede
   quatro secoes ilustradas de virarem quatro dialetos diferentes. */

/* esqueleto editorial de todo bloco-poster: eyebrow > titulo > nota > regua */
.eyebrow{font:700 10px/1 var(--body);letter-spacing:.28em;text-transform:uppercase;
  /* --gold-3 e o degrau ESCURO da rampa, existe para bisel e gradiente.
     Como texto de 10px dava 3.57:1 -- abaixo do minimo. O degrau 2 passa. */
  color:var(--gold-2)}
.poster-title{margin:0;font:800 clamp(28px,4.2cqi,62px)/.92 var(--cond);text-transform:uppercase;letter-spacing:.005em}
.poster-note{margin:10px auto 0;max-width:62ch;font-size:12.5px;color:var(--mut);text-align:center}
.rule{height:1px;border:0;margin:18px 0;
  background:linear-gradient(90deg,transparent,var(--gold-4) 18%,var(--gold-3) 50%,var(--gold-4) 82%,transparent)}

/* material: a mesma cor em degraus de luminancia e o que faz existir bisel.
   Prata e bronze sao TOKENS proprios -- filter:saturate() apagaria a arte junto. */
.metal{box-shadow:var(--bevel),var(--lift);
  background:linear-gradient(160deg,var(--gold-3) 0%,var(--gold-2) 26%,var(--gold-1) 44%,var(--gold-2) 62%,var(--gold-4) 100%)}
.metal.silver{background:linear-gradient(160deg,var(--m2c) 0%,var(--m2b) 30%,var(--m2a) 48%,var(--m2b) 66%,var(--m2c) 100%)}
.metal.bronze{background:linear-gradient(160deg,var(--m3c) 0%,var(--m3b) 30%,var(--m3a) 48%,var(--m3b) 66%,var(--m3c) 100%)}
.engraved{background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55))}

/* CONTRATO DE 4 CAMADAS -- sempre nesta ordem, em toda secao ilustrada:
   -3 arte / -2 luz / -1 vinheta / 0 conteudo. A ordem fixa e o que impede a
   atmosfera de virar bagunca quando ela se repete em quatro lugares. */
.stage-layers{position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r);background:var(--ink2)}
.stage-layers>.sl-art{position:absolute;inset:0;z-index:-3;width:100%;height:100%;
  object-fit:cover;filter:blur(28px) brightness(.38)}
.stage-layers>.sl-light{position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(120% 78% at 50% 0%,rgba(200,170,110,.16),transparent 62%)}
.stage-layers>.sl-vig{position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 96% at 50% 42%,transparent 42%,rgba(10,13,18,.72) 100%)}
