.pod .ft{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:12px}
/* o chip e dado, nao enfeite: diz o main do jogador e abre o dossie do campeao */
.pod .cchip{appearance:none;display:inline-flex;align-items:center;gap:8px;max-width:100%;
  margin-top:11px;padding:4px 12px 4px 4px;cursor:pointer;border-radius:var(--rp);
  background:rgba(10,13,18,.55);border:1px solid var(--line);color:var(--mut);
  font:500 11.5px/1 var(--body);transition:.13s}
.pod .cchip img{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
.pod .cchip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .cchip b{color:var(--txt);font-weight:600}
.pod .cchip:hover{border-color:var(--gold-2);color:var(--txt)}

/* ---- o degrau ---- */
.pod .step{position:relative;margin-top:15px;border-radius:7px 7px 0 0;display:grid;place-items:center;
  height:clamp(52px,5.6cqi,74px);box-shadow:var(--bevel),var(--lift);
  background:linear-gradient(180deg,#1D232C,#12171F)}
.pod.p2 .step{height:clamp(70px,7.4cqi,100px)}
.pod.p1 .step{height:clamp(96px,10cqi,140px);
  background:linear-gradient(180deg,#3A2E16,#1A1408 76%)}
/* filete de metal no topo do degrau: mesmo filete do KPI heroi, mesmo material */
.pod .step::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:inherit;
  background:linear-gradient(90deg,transparent,var(--step-m,var(--m2b)),transparent)}
.pod.p1 .step{--step-m:var(--gold-1)}
.pod.p3 .step{--step-m:var(--m3b)}
.pod .step::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:var(--glass);pointer-events:none}
/* numeral entalhado: baixa opacidade de proposito -- e relevo, nao rotulo */
.pod .step .rn{font:800 clamp(30px,4.4cqi,78px)/1 var(--cond);letter-spacing:.05em;
  color:rgba(233,237,242,.09);text-shadow:0 1px 0 rgba(255,255,255,.05)}
.pod.p1 .step .rn{color:rgba(200,170,110,.30)}
/* entrada unica, do 3o degrau para o 1o -- o campeao chega por ultimo */
.podium3 .pod{animation:fadeUp .5s var(--e) both}
.pod.p3{animation-delay:.04s} .pod.p2{animation-delay:.12s} .pod.p1{animation-delay:.22s}

/* ====================================================== AS DUAS SALAS
   Fama e Vergonha sao O MESMO componente. O que muda entre as duas salas e
   --acc (e o eyebrow, que e texto). Duplicar o componente seria assinar o
   compromisso de manter dois; aqui o modificador troca a cor da luz, da
   moldura, da gravacao e da barra de uma vez so.
   Cada sala tem 6 premios: 3 colunas = 2 filas fechadas, sem orfao embaixo. */
.hall{--acc:var(--gold-2); --acc-1:var(--gold-1); --acc-3:var(--gold-3);
  position:relative;isolation:isolate;overflow:hidden;border-radius:var(--r);
  background:linear-gradient(180deg,var(--ink2),var(--ink));
  border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));
  padding:clamp(22px,2.8vw,34px) clamp(16px,2.2vw,32px) clamp(26px,3vw,36px)}
.hall-shame{--acc:var(--red); --acc-1:#F8CBCD; --acc-3:#7E2226}
/* a luz da sala entra pelo alto, na cor da sala -- e o que faz o teto existir */
.hall::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(118% 74% at 50% 0%,color-mix(in srgb,var(--acc) 14%,transparent),transparent 64%)}
/* vinheta + textura: sem elas o fundo fica chapado e a moldura nao tem em que pousar */
.hall::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:var(--glass),radial-gradient(120% 100% at 50% 40%,transparent 46%,rgba(10,13,18,.66) 100%)}
.hall-head{text-align:center;max-width:74ch;margin:0 auto clamp(20px,2.4vw,32px)}
.hall-head .eyebrow{display:block;margin-bottom:11px;color:color-mix(in srgb,var(--acc) 68%,var(--dim))}
.hall .poster-title{font-size:clamp(26px,3.4cqi,50px)}
/* a gravacao usa a rampa da propria sala: ouro na fama, cobre queimado na vergonha.
   background-IMAGE, nunca o atalho background: o atalho reseta background-clip para
   border-box, e como esta regra tem especificidade maior que .engraved ela ganhava --
   o gradiente pintava a caixa inteira e a letra transparente sumia. Era uma barra
   dourada solida no lugar de "Hall da Fama", "Hall da Vergonha", "A Sala dos
   Recordes" e "O Arsenal". */
.hall .poster-title.engraved{
  background-image:linear-gradient(180deg,var(--acc-1),var(--acc) 55%,var(--acc-3))}
.hall .rule{max-width:340px;margin:14px auto 0;
  background:linear-gradient(90deg,transparent,var(--acc-3) 18%,var(--acc) 50%,var(--acc-3) 82%,transparent)}
.hall .poster-note{margin-top:11px}

/* ================================================ AS DUAS SALAS, LADO A LADO
   Na home, Fama e Vergonha dividem UMA parede em vez de ocupar duas. Cada .hall
   vira seu proprio container de query: sem isso o clamp de 3.4cqi do titulo
   continuaria medindo o .content (1255px em 1600) e um poster de 43px cairia
   num painel de 564px -- caricatura. O container se chama `hall` e NAO `content`:
   as regras `@container content (...)` que ja existem continuam achando o
   .content la em cima, intactas.
   Todo seletor daqui tem especificidade MAIOR que a regra original que
   sobrescreve (.halls2 .awards 0,2,0 vence .awards 0,1,0), entao o bloco pode
   entrar em QUALQUER ponto da folha -- nao depende de ordem de cascata. */
.halls2{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--stage);align-items:start}
/* margin:0 porque cada hall e <section> e traz margin-bottom:--stage: dentro da
   grade quem espaca e o gap, senao sobra um degrau morto embaixo de cada painel.
   Empilhado o gap E --stage: a tela estreita fica identica a de hoje. */
.halls2>.hall{margin:0;container-type:inline-size;container-name:hall}

/* O par so existe enquanto cada metade ainda for uma PAREDE: ~494px internos,
   dois premios de 238px. Abaixo disso o painel vira miniatura e o bloco volta a
   empilhar -- e volta se comportando exatamente como hoje, porque TODO o
   reescalonamento mora dentro desta consulta. content 1080 ~= 1415px de tela. */
@container content (min-width:1080px){
  .halls2{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,1.7vw,26px)}
  /* 32px de folga lateral eram 2,5% de uma parede de 1255px e viram 5,2% de uma
     de 614px: o mesmo respiro, medido de novo. */
  .halls2>.hall{padding-inline:clamp(14px,1.5vw,26px)}
  .halls2 .hall-head{max-width:none;margin-bottom:clamp(16px,3.4cqi,26px)}
  /* poster nao escala por regra de tres, tem piso de presenca: 6,2cqi da metade
     pesa o mesmo que 3,4cqi da parede inteira. 35px em 1600, teto de 42px.
     SO font-size: a gravacao (background-image) nao e tocada aqui. */
  .halls2 .hall .poster-title{font-size:clamp(28px,6.2cqi,42px)}
  .halls2 .hall .rule{max-width:min(300px,58%);margin-top:12px}
  .halls2 .hall .poster-note{max-width:44ch;margin-top:9px;font-size:12px}
  /* 6 premios = 2 colunas x 3 filas, sem orfao. 3x2 aqui daria cartao de 168px:
     a janela da arte viraria selo de 166x104 e a etiqueta ja cortava o nome. */
  .halls2 .awards{grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.2vw,18px);max-width:none}
  .halls2 .aw-plate .nm{font-size:clamp(17px,3.4cqi,21px)}
  .halls2 .aw-sc b{font-size:clamp(28px,6.4cqi,38px)}
}

/* 1220px e o teto da parede: em 3 colunas de 1700px cada quadro passaria de
   550px e a loading art (308px de largura) viraria borrao ampliado. */
.awards{display:grid;gap:clamp(14px,1.6vw,22px);grid-template-columns:1fr;
  max-width:1220px;margin-inline:auto}
@container content (min-width:620px){.awards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container content (min-width:960px){.awards{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---- o quadro: janela com a arte em cima, placa gravada embaixo ----
   A janela tem aspect-ratio proprio em vez de "o que sobrar da altura": assim a
   pintura nao vira uma tira fina quando o texto do premio cresce. O flex:1 deixa
   a janela absorver a folga quando a fila iguala as alturas. */
.aw{--rot:0deg;position:relative;display:flex;flex-direction:column;overflow:hidden;
  border-radius:12px;transform:rotate(var(--rot));
  background:linear-gradient(180deg,#10141B,var(--ink));
  border:1px solid color-mix(in srgb,var(--acc) 38%,var(--line));
  box-shadow:var(--bevel),var(--lift);transition:box-shadow .22s var(--e),border-color .22s var(--e)}
/* a segunda linha da moldura (o passe-partout). Vive no ::after porque o ::before
   ja e do fallback .noart -- disputar com ele apagaria um dos dois. */
.aw::after{content:"";position:absolute;inset:5px;z-index:3;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--acc) 22%,transparent);border-radius:8px}
.aw:hover{border-color:var(--acc);box-shadow:0 0 44px -18px var(--acc),var(--bevel),var(--lift)}
.aw:hover .art{transform:scale(1.05)}
.aw .art{transition:transform .32s var(--e)}
/* .artbox da a janela o contrato de camadas e o fallback: se o ddragon nao
   responder, o FBART marca ESTA janela com .noart e ela vira gradiente solido. */
.aw-win{flex:1 1 auto;aspect-ratio:16/10}
/* a arte e retrato e a janela e larga: o corte alto pega o rosto, nao o joelho */
.aw-win .art{object-position:center 14%;background-position:center 14%}
/* etiqueta de metal com o nome do premio, no alto. Texto NUNCA encosta em arte
   crua: a etiqueta traz o proprio fundo. */
.aw-tag{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:2;
  padding:10px 12px;background:linear-gradient(180deg,rgba(8,11,16,.96),rgba(8,11,16,.72));
  border-bottom:1px solid color-mix(in srgb,var(--acc) 34%,transparent)}
.aw-tag .ic svg{width:14px;height:14px;stroke:var(--acc);fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.aw-tag .t{font:800 13px/1 var(--cond);letter-spacing:.2em;text-transform:uppercase;
  color:var(--acc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* z-index:2 porque o disco sobe por cima da janela; o -30px e essa sobreposicao */
.aw-in{position:relative;z-index:2;text-align:center;padding:0 clamp(12px,1.6vw,18px) 15px}

/* o retrato da PESSOA em disco de metal -- a arte e do campeao, a medalha e dela */
.aw-disc{width:58px;height:58px;margin:-30px auto 0;border-radius:50%;padding:2px;
  background:linear-gradient(160deg,var(--acc-1),var(--acc) 46%,var(--acc-3));
  box-shadow:0 10px 22px rgba(0,0,0,.7),var(--bevel)}
.aw-disc img{width:100%;height:100%;border-radius:50%;background:var(--ink2)}
/* a placa gravada: nome em relevo, metrica em letra miuda */
.aw-plate{margin-top:12px;padding:9px 12px;border-radius:7px;
  background:linear-gradient(180deg,#161B23,#0C1015);
  border:1px solid color-mix(in srgb,var(--acc) 20%,var(--line));box-shadow:var(--bevel)}
.aw-plate .nm{font:800 clamp(17px,1.6cqi,23px)/1 var(--cond);text-transform:uppercase;
  letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:linear-gradient(180deg,var(--acc-1),var(--acc) 58%,var(--acc-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.aw-plate .d{font-size:11px;color:var(--mut);margin-top:5px}
/* o numero e placar: condensado, tabular, e a unidade nao rouba o olho */
.aw-sc{margin-top:12px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.aw-sc b{font:800 clamp(30px,3.4cqi,44px)/.9 var(--cond);font-variant-numeric:tabular-nums;
  color:var(--txt)}
.aw-sc span{font:600 10.5px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.aw-m{margin-top:12px}
.aw-m .track{height:6px;border-radius:var(--rp);background:rgba(255,255,255,.09);overflow:hidden}
.aw-m .track i{display:block;height:100%;border-radius:var(--rp);
  background:linear-gradient(90deg,var(--acc-3),var(--acc))}
.aw-m .cap{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--dim);margin-top:7px}
.aw-m .cap b{color:var(--mut);font-variant-numeric:tabular-nums}
.aw-f{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.07)}
.aw-f .lbl{font-size:10px;color:var(--dim)}
.aw-f .ru{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);min-width:0}
.aw-f .ru img{width:20px;height:20px;border-radius:50%;flex:0 0 auto}
.aw-f .ru span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ZOEIRA MEDIDA: na sala da vergonha os quadros impares estao tortos na parede.
   1.2deg e o suficiente para o olho notar e pouco para nao virar piada de festa. */
.hall-shame .aw:nth-child(odd){--rot:-1.2deg}
/* entrada unica, quadro a quadro. O keyframe carrega o --rot porque `transform:none`
   no fim da animacao endireitaria os quadros tortos. */
.hall .aw{animation:fadeUpRot .5s var(--e) both}
.hall .aw:nth-child(2){animation-delay:.05s} .hall .aw:nth-child(3){animation-delay:.1s}
.hall .aw:nth-child(4){animation-delay:.15s} .hall .aw:nth-child(5){animation-delay:.2s}
.hall .aw:nth-child(6){animation-delay:.25s}

/* ================================================= A SALA DOS RECORDES
   Terceira sala, mesmo componente .hall: a parede, a luz e a gravacao ja
   existem, aqui so entra o mobiliario. Duas escalas de peca, porque os
   recordes NAO sao todos do mesmo tipo -- pentakill, roubo sem smite e jogo
   sem morrer nao tem "segundo lugar", ou aconteceu ou nao aconteceu, e por
   isso viram vitrine larga com a arte do campeao. O resto e ranking de uma
   coluna so e cabe num cartao pequeno. Trinta cartoes de uma vez nao seriam
   uma sala, seriam um deposito: dai as abas por grupo. */
.relics{display:grid;gap:clamp(12px,1.5vw,20px);grid-template-columns:1fr;
  max-width:1220px;margin:0 auto clamp(22px,2.6vw,32px)}
@container content (min-width:760px){.relics{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* justify-content:flex-end empurra o texto para a base: a arte respira em cima
   e o scrim so precisa escurecer a metade de baixo. */
.rel{display:flex;flex-direction:column;justify-content:flex-end;min-height:230px;
  padding:16px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--gold-2) 34%,var(--line));
  box-shadow:var(--bevel),var(--lift);transition:border-color .2s var(--e)}
.rel:hover{border-color:var(--gold-2)}
.rel .art{background-position:center 24%;object-position:center 24%}
.rel .tag{font:800 11.5px/1.2 var(--cond);letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold-2)}
.rel .big{margin-top:9px;font:800 clamp(38px,4.2cqi,58px)/.86 var(--cond);
  font-variant-numeric:tabular-nums;color:var(--gold-1)}
.rel .big small{display:block;margin-top:9px;font:600 10.5px/1.3 var(--body);
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.rel .who{display:flex;align-items:center;gap:9px;margin-top:13px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12)}
.rel .who img{width:30px;height:30px;border-radius:50%;flex:0 0 auto;border:1px solid var(--line)}
.rel .who .n{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .who .c{font-size:10.5px;color:var(--mut);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .lg{font-size:11.5px;color:var(--mut);margin-top:10px}
/* VITRINE VAGA: o recorde sem dono continua pendurado dizendo que ninguem
   conseguiu. Sumir com ele esconderia metade da historia da fila. */
.rel.vaga{border-style:dashed;border-color:var(--line2);background:var(--card2)}
.rel.vaga .tag{color:var(--mut)}
.rel.vaga .big{color:var(--dim)}

.rtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;
  margin-bottom:clamp(16px,2vw,24px)}
.rtab{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;
  border-radius:var(--rp);background:var(--card2);border:1px solid var(--line);
  color:var(--mut);font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
  transition:color .16s,background .16s,border-color .16s}
.rtab b{font-variant-numeric:tabular-nums;color:var(--dim)}
.rtab:hover{color:var(--txt);border-color:#2C3540}
.rtab[aria-pressed="true"]{color:var(--ink);background:var(--tone);border-color:var(--tone)}
.rtab[aria-pressed="true"] b{color:rgba(10,13,18,.6)}

/* 4 colunas fecham fila exata nos tres grupos; 2 e 1 nos degraus de baixo. */
.rgrid{display:grid;gap:clamp(10px,1.2vw,16px);grid-template-columns:1fr;
  max-width:1220px;margin-inline:auto}
/* display:grid venceria o [hidden] do HTML -- sem esta linha as tres abas
   apareceriam empilhadas de uma vez. */
.rgrid[hidden]{display:none}
@container content (min-width:560px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container content (min-width:1040px){.rgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rc{display:flex;flex-direction:column;padding:14px;border-radius:11px;
  background:linear-gradient(180deg,#10141B,var(--ink));border:1px solid var(--line);
  transition:border-color .16s,transform .16s}
.rc[data-champ]{cursor:pointer}
.rc:hover{border-color:color-mix(in srgb,var(--tone) 55%,var(--line));transform:translateY(-2px)}
.rc .tt{font:800 11px/1.3 var(--cond);letter-spacing:.15em;text-transform:uppercase;color:var(--tone)}
.rc .vl{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.rc .vl b{font:800 clamp(26px,2.4cqi,34px)/.88 var(--cond);font-variant-numeric:tabular-nums;
  color:var(--txt)}
.rc .vl span{min-width:0;font-size:10.5px;color:var(--dim);overflow-wrap:anywhere}
.rc .pl2{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:11px;
  border-top:1px solid var(--line2)}
.rc .pl2 img{width:26px;height:26px;border-radius:50%;flex:0 0 auto}
.rc .pl2 .n{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .pl2 .c{font-size:10.5px;color:var(--dim);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc.vazio{border-style:dashed;background:var(--card2)}
.rc.vazio .vl b,.rc.vazio .pl2 .n{color:var(--dim)}

/* Toda animacao do site e de ENTRADA, disparada uma vez. Nada pisca enquanto se le. */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUpRot{from{opacity:0;transform:translateY(14px) rotate(var(--rot))}
  to{opacity:1;transform:rotate(var(--rot))}}
@keyframes sweep{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
@keyframes arcDraw{from{stroke-dashoffset:var(--dash,1000)}to{stroke-dashoffset:0}}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ====================================================== VIDA (ENTRADA)
   A secao nasce visivel no HTML: quem liga o movimento e o JS, marcando .rv.
   Se o script falhar ou o IntersectionObserver nao existir, o painel continua
   legivel -- nada de conteudo dependendo de animacao para aparecer.
   So opacity e transform: nenhuma propriedade que force layout. */
.rv{opacity:0;transform:translateY(18px);
  transition:opacity .5s var(--e),transform .5s var(--e)}
.rv.in{opacity:1;transform:none}
/* enquanto a secao nao entrou, as animacoes dos filhos ficam no primeiro quadro:
   e isso que faz a barra crescer QUANDO voce chega nela, e nao antes. */
.rv:not(.in) *{animation-play-state:paused}
/* cascata de 40ms nos blocos repetidos -- o --i vem do JS, na ordem do DOM.
   `backwards` e nao `both`: com `both` o transform:none do ultimo quadro ficaria
   grudado no elemento e mataria a elevacao do :hover, que tambem e transform. */
.rv .stg{animation:fadeUp .46s var(--e) backwards;animation-delay:calc(var(--i,0)*40ms + 70ms)}
/* um unico brilho atravessa a moldura do campeao, na entrada. Nunca em laco. */
.rv .pod.p1 .artbox::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  transform:translateX(-130%);
  background:linear-gradient(105deg,transparent 38%,rgba(240,230,210,.28) 50%,transparent 62%)}
.rv.in .pod.p1 .artbox::after{animation:sweep 1.1s var(--e) .55s both}
@media(prefers-reduced-motion:reduce){
  /* com o transition desligado la em cima, opacity:0 congelaria a pagina inteira */
  .rv,.rv .stg{opacity:1!important;transform:none!important}
}

/* ============================================== PÁGINA CAMPEÕES: O ARSENAL
   O cartão anterior tinha DOIS defeitos de caixa, e o pior não era o splash.

   1) .cc-ic era um <span> — portanto display:inline. width/height NÃO se aplicam
      a inline não-substituído, então os 52x52 eram silenciosamente ignorados; com
      o pai colapsado, a regra .cc-ic img{width:100%;height:100%} resolvia o 100%
      contra o .cc-in inteiro. O ícone de campeão, que o assets.py embute em 64x64
      (CHAMPION_PX), acabava esticado até 351x202 — upscale de 5,5x na horizontal
      e 3,2x na vertical, com object-fit no default `fill`. ERA ESSE o rosto
      borrado e deformado, não a arte do ddragon (essa é uma REDUÇÃO e está nítida).
      A cura não é object-fit nem image-rendering: é o ícone deixar de ser filho de
      um inline. Agora ele é o próprio <img class="cc-ic"> — sem embrulho — e 40px
      é redução de 64, nítido por construção.

   2) 16/8.4 dava ~200px de arte por cartão e a grade travava em 3 colunas: a
      .cgrid sozinha ocupava 1737px. A faixa cai para 16/7 (~80px, redução de 7x
      sobre o centered 1280x720) e a grade abre até 6 colunas.

   12 cartões fecham fila EXATA em 6, 4, 3 e 2 — 12 é divisível por todas, então
   nenhum breakpoint deixa órfão, que era a regra do desenho original. */
.cgrid{display:grid;gap:clamp(10px,1.1vw,14px);grid-template-columns:repeat(2,minmax(0,1fr));
  max-width:1320px;margin-inline:auto}
@container content (min-width:560px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container content (min-width:780px){.cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container content (min-width:1120px){.cgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}

.ccard{position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
  border-radius:10px;background:linear-gradient(180deg,#10141B,var(--ink));
  border:1px solid var(--line);box-shadow:var(--bevel),var(--lift);
  transition:border-color .2s var(--e),box-shadow .2s var(--e),transform .2s var(--e)}
.ccard:hover,.ccard:focus-visible{border-color:var(--gold-2);transform:translateY(-3px);
  box-shadow:0 0 34px -18px var(--gold-2),var(--bevel),var(--lift);outline:0}
.ccard:hover .art{transform:scale(1.06)}

/* a faixa continua sendo o centered de 1280x720 — em ~186px de largura isso é
   redução de 7x, ou seja, nítida por construção. Nunca use aqui o ícone do PACK. */
.cc-win{aspect-ratio:16/7}
.cc-win .art{transition:transform .32s var(--e);object-position:center 20%;background-position:center 20%}
/* o véu padrão começa transparente aos 30%; numa faixa de 80px isso deixaria o
   número de posição sobre arte crua. Um degrau a mais no topo resolve. */
.cc-win .scrim{background:linear-gradient(180deg,rgba(11,15,21,.12),rgba(11,15,21,.62) 62%,#10141B 100%)}
.cc-rk{position:absolute;top:6px;right:8px;z-index:2;font:800 15px/1 var(--cond);
  color:rgba(240,230,210,.6);text-shadow:0 2px 6px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}

.cc-in{position:relative;z-index:2;padding:0 10px 10px}
/* -18px faz o brasão quebrar a moldura da arte, que é a assinatura do Arena UDA.
   align-items:flex-end apoia o nome na base do ícone; se o CDN cair e o .cc-tt
   vier vazio, a linha continua com 40px de altura e o cartão não muda de tamanho. */
.cc-hd{display:flex;align-items:flex-end;gap:8px;min-width:0;margin-top:-18px}
/* IMG COM CLASSE PRÓPRIA. Nada de <span> no meio: era dali que vinha o upscale.
   40 < 64 (CHAMPION_PX no assets.py) — se um dia precisar de ícone maior, suba lá,
   não aqui. object-fit:cover só como cinto de segurança: a fonte já é quadrada. */
img.cc-ic{flex:0 0 auto;width:40px;height:40px;border-radius:10px;object-fit:cover;
  background:var(--ink2);border:1px solid var(--gold-3);
  box-shadow:0 6px 16px rgba(0,0,0,.75)}
.cc-id{flex:1;min-width:0}
.cc-nm{font:800 16px/1.02 var(--cond);text-transform:uppercase;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-tt{margin-top:2px;font:500 9.5px/1.1 var(--body);color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* três colunas de rótulo em 186px viravam três colunas de 51px com "VITÓRIAS"
   espremido. Aqui há hierarquia: o aproveitamento é o número, o resto é legenda. */
.cc-st{display:flex;align-items:baseline;justify-content:space-between;gap:6px;
  margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)}
.cc-wr{font:800 20px/1 var(--cond);font-variant-numeric:tabular-nums}
.cc-mt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font:500 9.5px/1 var(--body);color:var(--mut);font-variant-numeric:tabular-nums}
.cc-tr{height:4px;border-radius:var(--rp);background:var(--barneutral);overflow:hidden;margin-top:7px}
.cc-tr i{display:block;height:100%;border-radius:var(--rp);background:var(--teal)}
.cc-tr i.lo{background:var(--red)}
.cc-pl{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}
.cc-pl .ims{display:flex;flex:0 0 auto}
/* PROFILE_PX é 72 no assets.py: 17px continua sendo redução. */
.cc-pl .ims img{width:17px;height:17px;border-radius:50%;border:1.5px solid #10141B;object-fit:cover}
.cc-pl .ims img+img{margin-left:-6px}
.cc-pt{min-width:0;font:500 9.5px/1 var(--body);color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* tudo que abre o dossie se comporta como botao, inclusive pelo teclado */
.champ[data-champ],.aw[data-champ],tr[data-champ]{cursor:pointer}
[data-champ]:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}

/* ================================================== O DOSSIÊ DO CAMPEÃO
   O <dialog> nativo ja traz Esc, foco preso e backdrop -- reimplementar isso a
   mao seria trocar tres comportamentos corretos por tres bugs. */
/* o dialogo vive no top layer, FORA de .content: sem container proprio nenhuma
   @container e nenhum cqi daqui pra baixo resolveria */
.dossie{border:0;padding:0;background:none;color:var(--txt);width:min(1060px,94vw);
  max-height:min(92vh,940px);overflow:auto;border-radius:var(--r);overscroll-behavior:contain;
  container-type:inline-size;container-name:ds}
.dossie::backdrop{background:rgba(6,8,12,.8)}
.dossie[open]{animation:fadeUp .3s var(--e) both}
.ds{background:linear-gradient(180deg,var(--ink2),var(--ink));overflow:hidden;
  border:1px solid color-mix(in srgb,var(--gold-2) 28%,var(--line));border-radius:var(--r)}
/* o hero e mais baixo que 16/9: aqui a arte e cabecalho, nao o assunto */
.ds-hero{aspect-ratio:16/6}
@container ds (max-width:700px){.ds-hero{aspect-ratio:16/9}}
.ds-hero .art{object-position:center 20%;background-position:center 20%}
.ds-x{position:absolute;top:10px;right:10px;z-index:4;width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;border:1px solid var(--line);
  background:rgba(10,13,18,.72);color:var(--mut);font:400 20px/1 var(--body);transition:.13s}
.ds-x:hover{border-color:var(--gold-2);color:var(--txt)}
.ds-ttl{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;align-items:flex-end;gap:14px;
  padding:clamp(14px,2vw,24px)}
.ds-ttl .ic{width:clamp(54px,7cqi,76px);height:clamp(54px,7cqi,76px);flex:0 0 auto;border-radius:16px;
  padding:2px;background:linear-gradient(160deg,var(--gold-1),var(--gold-3));box-shadow:var(--lift)}
.ds-ttl .ic img{width:100%;height:100%;border-radius:14px;background:var(--ink2)}
.ds-ttl .tx{min-width:0}
.ds-ttl .eyebrow{display:block;margin-bottom:7px}
.ds-ttl .poster-title{font-size:clamp(26px,4.6cqi,46px)}
.ds-sub{margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.ds-tag{font:700 9.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);
  background:var(--gold-s);border-radius:var(--rp);padding:4px 9px}
/* duas colunas: a UDA a esquerda, a ficha do campeao a direita */
.ds-body{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(16px,2vw,26px);
  padding:clamp(16px,2.2vw,26px)}
@container ds (min-width:820px){.ds-body{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}
.ds-h{font:700 10px/1 var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold-3);
  margin-bottom:12px}
.ds-uda{min-width:0}
.ds-num{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.ds-num>div{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:11px 13px}
.ds-num .k{font:600 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ds-num .v{font:800 26px/1 var(--cond);margin-top:8px;font-variant-numeric:tabular-nums}
.ds-num .v small{font:600 12px/1 var(--cond);opacity:.6;margin-left:2px}
.ds-lst{margin-top:16px}
.ds-pl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.ds-pl:last-child{border-bottom:0}
.ds-pl img{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
.ds-pl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ds-pl .st{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.ds-best{margin-top:14px;padding:12px 14px;border-radius:var(--rs);
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold-2)}
.ds-best .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ds-best .v{font-size:13px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.ds-best .s{font-size:11.5px;color:var(--mut);margin-top:3px}
/* ---- as habilidades ---- */
.ds-sk{min-width:0}
.ds-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.ds-row:last-child{border-bottom:0}
.ds-ib{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:11px;padding:1px;
  background:linear-gradient(160deg,var(--gold-3),var(--gold-4));box-shadow:var(--bevel)}
.ds-ib img{width:100%;height:100%;border-radius:10px;background:var(--ink2)}
.ds-row.pas .ds-ib{border-radius:50%;padding:2px;background:linear-gradient(160deg,var(--gold-1),var(--gold-3))}
.ds-row.pas .ds-ib img{border-radius:50%}
/* a tecla e o rotulo real da habilidade: sem ela a lista vira quatro icones soltos */
.ds-key{position:absolute;left:-5px;bottom:-5px;width:20px;height:20px;border-radius:6px;
  display:grid;place-items:center;font:800 11px/1 var(--cond);color:var(--ink);
  background:linear-gradient(160deg,var(--gold-1),var(--gold-2));box-shadow:0 3px 8px rgba(0,0,0,.6)}
.ds-tx{min-width:0}
.ds-tx .n{font:600 13.5px/1.2 var(--body)}
.ds-tx .d{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.45}
.ds-note{font-size:11.5px;color:var(--dim);margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}

/* =========================================================== DIVERSOS */
.empty{padding:44px 24px;text-align:center;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.empty h3{font:600 14px/1 var(--disp);color:var(--txt);margin:0 0 9px}
#demo-banner{background:var(--red);color:#fff;text-align:center;padding:11px 20px;font-size:13px}
#demo-banner b{font-family:var(--disp);font-weight:700}
#demo-banner code{background:rgba(0,0,0,.28);padding:2px 7px;border-radius:5px}
footer{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--card3);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#333d4a}

/* ============================================ DENSIDADE VERTICAL (CELULAR)
   A Visao geral tinha 18968px em 375px de largura: 23 telas de rolagem para
   ver 12 KPIs, 3 do podio, 12 quadros de hall, 31 recordes e 24 partidas.
   Nada e escondido aqui -- o dash continua completo. O que muda e:
     (1) o RITMO: 52px de ar entre secoes viram 28, e o card aperta;
     (2) o PISO das escalas fluidas: todo clamp() foi calibrado pelo topo,
         entao no celular ele caia no MINIMO, que era um minimo de desktop
         (numero de 38px num cartao de 128px);
     (3) a PROPORCAO das artes, que e a maior despesa de altura da pagina;
     (4) a ORDEM, porque a primeira tela do celular tem de responder
         "quem esta ganhando", nao "qual a duracao media da partida".
   Tudo em @container content: acima de 560px de container o desktop nao
   perde um pixel, e nenhuma dessas regras chega a existir. */
@container content (max-width:560px){

  /* -------------------------------------------------- ritmo e respiro */
  #app{--stage:28px}
  #app>section{margin-bottom:var(--stage)}
  .card{padding:15px 14px}
  .ch{margin-bottom:13px;gap:10px}
  .ch .ic{width:28px;height:28px}
  .ch .ic svg{width:15px;height:15px}
  .ch h2{font-size:14.5px}
  .ch .hint{font-size:11.5px;line-height:1.35}

  /* ------------------------------------------------- ORDEM DE LEITURA
     So a ordem VISUAL muda: o DOM continua o mesmo, o leitor de tela e o
     desktop tambem. O data-sec vem do pVisao/podio/hall/recordes -- e
     nomeado de proposito, porque :nth-child quebraria no dia em que
     "Os afundados" nao existir naquela fila. */
  #app{display:flex;flex-direction:column}
  #app>section{order:50}
  #app>[data-sec="podio"]{order:10}          /* quem esta ganhando */
  #app>[data-sec="kpis"]{order:20}           /* o placar do grupo */
  #app>[data-sec="feed"]{order:30}           /* o que acabou de acontecer */
  #app>[data-sec="afundados"]{order:40}
  /* Fama e Vergonha viajam juntas dentro de <section class="halls2">: no celular
     elas ja estao empilhadas e a ordem entre as duas e a do DOM. */
  #app>[data-sec="halls"]{order:50}
  #app>[data-sec="recordes"]{order:70}
  #app>[data-sec="medidor"]{order:80}        /* leitura de estudo, no fim */
  #app>[data-sec="dispersao"]{order:90}

  /* -------------------------------------------------------------- KPIs
     4 herois empilhados a 128px = 512px antes de qualquer conteudo.
     Dois por fila com o numero em 30px: 2 filas de 113. */
  .stats{gap:10px}
  .stats>.kpi-hero{grid-column:span 4}
  .kpi-hero{padding:11px 12px 12px}
  .kpi-hero .v{font-size:30px;margin-top:6px}
  .kpi-hero .v small{font-size:12px}
  .kpi-hero .k{font-size:9px;letter-spacing:.14em}
  .kpi-hero .ic{width:22px;height:22px}
  .kpi-hero .ic svg{width:12px;height:12px}
  .kpi-hero .foot{padding-top:7px}
  .kpi-hero .sub{font-size:10.5px;line-height:1.25}
  .kpi-hero .spark{width:44px;height:14px}
  .kpi-tick{padding:10px 11px}
  .kpi-tick .v{font-size:19px}

  /* ------------------------------------------------------------ PODIO */
  .stage{padding-top:18px}
  .pod-head{margin-bottom:16px}
  .pod-head .poster-note{font-size:11.5px}
  .podium3{gap:16px}
  .podium3 .pod .artbox{aspect-ratio:308/236}
  .podium3 .pod.p1 .artbox{aspect-ratio:308/300}
  .pod-por{margin-bottom:24px}
  .pod.p1 .pod-por{margin-bottom:28px}
  .pod .nm{font-size:17px}
  .pod.p1 .nm{font-size:21px}
  .pod .sc{font-size:26px;margin-top:6px}
  .pod.p1 .sc{font-size:32px}
  .pod .ft{margin-top:9px}
  .pod .step{margin-top:11px;height:44px}
  .pod.p2 .step{height:50px}
  .pod.p1 .step{height:56px}
  .pod .step .rn{font-size:30px}

  /* -------------------------------------------------- HALL / QUADRO .aw
     461px por quadro x 12 quadros = 5532px, quase um terco da pagina. A
     janela de arte cai de 16/10 para 16/6 (187px -> 124px) e o miolo
     aperta; a placa, o numero e a regua da media continuam legiveis. */
  .hall{padding:20px 0 6px}
  .hall-head{margin-bottom:16px}
  .hall .poster-title{font-size:23px}
  .hall .poster-note{font-size:11.5px}
  .awards{gap:10px}
  .aw-win{aspect-ratio:16/6}
  .aw-tag{padding:8px 10px}
  .aw-tag .t{font-size:12px;letter-spacing:.14em}
  .aw-in{padding:0 11px 12px}
  .aw-disc{width:44px;height:44px;margin-top:-23px}
  .aw-plate{margin-top:9px;padding:7px 10px}
  .aw-plate .nm{font-size:16px}
  .aw-plate .d{font-size:10.5px;margin-top:3px}
  .aw-sc{margin-top:9px}
  .aw-sc b{font-size:26px}
  .aw-m{margin-top:9px}
  .aw-m .cap{margin-top:5px}
  .aw-f{margin-top:9px;padding-top:9px;gap:7px}
  /* o quadro torto da sala da vergonha empurra 4px para fora do container
     numa tela de 375px -- e em coluna unica a piada nem aparece, so a
     conta sobra. Fica reto no celular. (mesma especificidade da regra
     original, vindo depois: ganha sem !important) */
  .hall-shame .aw:nth-child(odd),
  .hall-shame .aw:nth-child(even){--rot:0deg}

  /* --------------------------------------------------------- RECORDES */
  .relics{gap:10px}
  .rel{min-height:172px;padding:13px}
  .rel .big{font-size:30px;margin-top:6px}
  .rel .big small{margin-top:6px}
  .rel .who{margin-top:10px;padding-top:9px}
  .rel .lg{margin-top:7px;font-size:11px}
  .rtabs{margin:16px 0 12px;gap:6px}
  .rgrid{gap:8px}
  .rc{padding:11px 12px}
  .rc .vl{margin-top:7px}
  .rc .vl b{font-size:23px}
  .rc .pl2{padding-top:9px}

  /* -------------------------------------------------------- AFUNDADOS */
  .sunk{gap:10px}
  .sk{padding:14px}
  .sk-why{margin-top:10px}
  .sk-gap{margin-top:10px;padding-top:9px}
  .sk-worst{margin-top:10px;padding-top:9px}

  /* ------------------------------------------------------------- FEED */
  .mfeed{gap:8px}
  .mfeed-top{padding-bottom:10px;margin-bottom:10px}
  .mfeed-lg{font-size:11px}

  /* --------------------------------------------- graficos e distancias */
  .gauge{max-height:172px}
  .gmeta .v{font-size:18px}
  .legend{gap:8px 14px;margin-top:12px;padding-top:11px;font-size:11px}
  .hbar{padding:7px 8px}
  .content{padding-bottom:56px}

  /* Jogadores e Campeoes pegam carona no mesmo aperto */
  .pcards{gap:12px}
  .pc-h{padding:14px}
  .pc-b{padding:14px;gap:14px}
  .champs{padding:12px 14px 14px}
  .cgrid{gap:10px}
}

/* ================================================= VER MAIS / VER MENOS
   O botao e a classe abaixo nao tem media query de proposito: quem decide
   se eles existem e o dobrar(), e ele so dobra em tela estreita. Sem JS,
   ou no desktop, nada disto chega a existir no documento. */
.fold-off{display:none!important}
.maisbtn{grid-column:1/-1;appearance:none;width:100%;min-height:44px;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 16px;cursor:pointer;border-radius:var(--rs);
  background:var(--card2);border:1px dashed var(--line);color:var(--mut);
  font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;
  transition:border-color .13s,color .13s}
.maisbtn:hover,.maisbtn:focus-visible{border-style:solid;border-color:var(--gold-2);color:var(--txt)}
.maisbtn::after{content:"";width:7px;height:7px;flex:0 0 auto;margin-top:-3px;
  border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;
  transform:rotate(45deg);transition:transform .16s var(--e)}
.maisbtn[aria-expanded="true"]::after{transform:rotate(225deg);margin-top:2px}

/* ====================================================== ALVOS DE TOQUE
   Medido hoje: .rtab 31px, .cchip 32px, .pchip ~31px, .seg button 26px,
   .mc-p 41px. O dash foi desenhado para um cursor de 1px. Este e um
   @media de VIEWPORT de proposito: quem define o alvo e o dedo que segura
   o aparelho, nao a largura do container. */
@media(max-width:620px){
  .rtab{min-height:44px;padding:11px 16px}
  .rtabs{gap:8px}
  .pchip,.pbtn{min-height:44px;padding:10px 14px}
  .pod .cchip{min-height:44px;padding:10px 14px}
  .mc-p{min-height:44px}
  .seg button{min-height:44px;padding:12px 14px}
  .form i{width:26px;height:26px}
  /* a linha da tabela ja e o alvo: 44px garante que o toque abre o cartao
     do jogador sem o dedo cair na linha de cima */
  #tbl tbody tr td{padding-top:10px;padding-bottom:10px}
}
</style>
</head>
<body>
<div id="demo-banner" hidden><b>DADOS FICTÍCIOS</b> — nada aqui veio da Riot.
  Números sorteados por <code>demo.py</code>. Para o painel real, rode <code>python run.py</code>.</div>

<div class="app">
  <aside id="drawer" tabindex="-1" data-open="false" aria-label="Navegação">
    <!-- so aparece abaixo do limiar: quem esta no dedo quer um alvo, nao so o Esc -->
    <button class="drawerx" id="drawerx" type="button" aria-label="Fechar menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
