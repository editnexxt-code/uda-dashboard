name: Atualizar dashboard

on:
  schedule:
    # PESQUISA RAPIDA. 5 min e o minimo que o GitHub aceita, e ele avisa que
    # agendamento frequente pode atrasar ou ser descartado em horario de pico --
    # entao na pratica isto e "a cada 5 a 20 min", nao um relogio.
    # A Riot nao tem webhook de fim de partida; pesquisar e o unico caminho.
    - cron: "*/5 * * * *"
    # BATIMENTO. De 2 em 2h publica mesmo sem partida nova, para o elo, o "Atualizado
    # ha X" e a janela de 90 dias nao envelhecerem quando ninguem joga.
    - cron: "0 1-23/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez. Com cancel-in-progress:false o GitHub mantem no maximo
# UMA na fila e descarta as demais, entao pesquisa de 5 em 5 min nao empilha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    # 60 min cobre com folga ate uma carga fria completa. Era 180, mas numa
    # pesquisa de 5 em 5 min um travamento seguraria a fila por 3 horas.
    timeout-minutes: 60
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
      salvar: ${{ steps.decidir.outputs.salvar }}
      novas: ${{ steps.decidir.outputs.novas }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # O banco precisa sobreviver entre execucoes: o fetch e incremental e so
      # baixa o que ainda nao tem. Chave com o run_id (sempre unica, sempre grava)
      # e restore-keys pegando a entrada mais recente. Se o cache sumir, a run
      # seguinte refaz a carga inteira sozinha -- so demora mais.
      - name: Restaurar banco
        uses: actions/cache/restore@v4
        with:
          path: data
          key: uda-db-${{ github.run_id }}
          restore-keys: uda-db-

      - name: Coletar dados e gerar o HTML
        id: coleta
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python run.py

      # O banco passou de 48 MB. Gravar cache a cada 5 min seriam ~13 GB/dia
      # contra um teto de 10 GB por repositorio: ele viveria se despejando.
      # Entao so gravamos e publicamos quando houve partida nova -- ou no
      # batimento de 2h, ou quando alguem dispara na mao.
      #
      # if: always() aqui e essencial: sem ele, uma coleta que falha pula este
      # passo, 'salvar' sai vazio e o cache NAO e gravado -- perdendo o download
      # parcial que a proxima execucao deveria retomar.
      - name: Decidir
        id: decidir
        if: always()
        run: |
          NOVAS=$(python ci_novas.py)
          echo "novas=$NOVAS" >> "$GITHUB_OUTPUT"

          COLETA="${{ steps.coleta.outcome }}"

          # Guardar o banco: quando veio partida nova, OU quando a coleta caiu no
          # meio (o que ja baixou tem que sobreviver para a proxima retomar).
          if [ "$NOVAS" != "0" ] || [ "$COLETA" != "success" ]; then
            echo "salvar=sim" >> "$GITHUB_OUTPUT"
          else
            echo "salvar=nao" >> "$GITHUB_OUTPUT"
          fi

          # Publicar: so com coleta bem-sucedida E (partida nova, ou batimento
          # de 2h, ou disparo manual).
          if [ "$COLETA" = "success" ] && { [ "$NOVAS" != "0" ]               || [ "${{ github.event_name }}" != "schedule" ]               || [ "${{ github.event.schedule }}" = "0 1-23/2 * * *" ]; }; then
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
            echo "::notice::Publicando -- $NOVAS partida(s) nova(s)"
          else
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem publicacao (novas=$NOVAS, coleta=$COLETA)"
          fi

      - name: Guardar banco
        if: always() && steps.decidir.outputs.salvar == 'sim'
        uses: actions/cache/save@v4
        with:
          path: data
          key: uda-db-${{ github.run_id }}

      - name: Montar o site
        if: steps.decidir.outputs.publicar == 'sim'
        run: |
          mkdir -p site
          cp dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v4
        if: steps.decidir.outputs.publicar == 'sim'
        with:
          path: site

  publicar:
    needs: gerar
    if: needs.gerar.outputs.publicar == 'sim'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
